<svg xmlns="http://www.w3.org/2000/svg" width="420" height="675" viewBox="0 0 420 675"><rect width="420" height="675" fill="white"/><g font-family="Arial, sans-serif" fill="#15263a" stroke="none"><text x="18" y="28" font-size="16">08  Gray FIFO structure: two clock domains</text><text x="18" y="49" font-size="12">Concept / CPU prediction — not a tool waveform</text><text x="26" y="103" font-size="14">clk_W: wbin + 1</text><text x="233" y="103" font-size="14">clk_R: rbin + 1</text><text x="26" y="187" font-size="14">wgray=b ^ (b&gt;&gt;1)</text><text x="233" y="187" font-size="14">rgray=b ^ (b&gt;&gt;1)</text><text x="18" y="262" font-size="12">clk_W / rgray sync</text><text x="225" y="262" font-size="12">clk_R / wgray sync</text><text x="26" y="293" font-size="14">R1</text><text x="22" y="310" font-size="12">D</text><text x="78" y="310" font-size="12">Q</text><text x="126" y="293" font-size="14">R2</text><text x="122" y="310" font-size="12">D</text><text x="178" y="310" font-size="12">Q</text><text x="233" y="293" font-size="14">W1</text><text x="229" y="310" font-size="12">D</text><text x="285" y="310" font-size="12">Q</text><text x="333" y="293" font-size="14">W2</text><text x="329" y="310" font-size="12">D</text><text x="385" y="310" font-size="12">Q</text><text x="26" y="388" font-size="14">FULL comparator</text><text x="233" y="388" font-size="14">EMPTY comparator</text><text x="26" y="483" font-size="14">Dual-port memory: W write / R read addresses</text><text x="18" y="552" font-size="14">Depth 4: address 2 bits, pointer 3 bits</text><text x="18" y="578" font-size="12">FULL next: wg_next == {~rg_sync[2:1],rg_sync[0]}</text><text x="18" y="604" font-size="14">EMPTY: rg == wg_sync; local reset release in W/R</text><text x="18" y="632" font-size="12">Gray routing skew + dual-port timing required.</text><text x="18" y="661" font-size="12">Crossings without dots: separate nets.</text></g><g fill="none" stroke="#15263a" stroke-width="1.8"><rect x="18" y="80" width=