<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">11管OTA与实际共模反馈</title><desc id="desc">左侧M1/M2输入差分对、M3/M4 PMOS负载、M5尾源。右侧M7/M8误差对、M9尾源、M10/M11 PMOS镜。M6与50微安参考生成vb。sense由两只电阻取样，vc连接主PMOS栅。电容逐节点列于图下。</desc><rect width="100%" height="100%" fill="#fff"/><style>text{font-family:Arial,"Noto Sans CJK SC",sans-serif;fill:#172936} .wire{fill:none;stroke:#253b4a;stroke-width:2} .gate{fill:none;stroke:#106c9d;stroke-width:2.5}</style><text x="30" y="30" font-size="24" text-anchor="start">One 11-MOS circuit: bias, sensing, actuation and hidden states</text><text x="70" y="70" font-size="19" text-anchor="start">Main differential OTA</text><text x="740" y="70" font-size="18" text-anchor="start">CMFB: sense up -&gt; vc up -&gt; main current down</text><path class="wire" d="M150 105 L520 105"/><text x="155" y="95" font-size="15" text-anchor="start">VDD = 3.3 V</text><path class="wire" d="M220 140 L220 151"/><path class="wire" d="M220 151 L220 179"/><path class="wire" d="M220 179 L220 190"/><path class="wire" d="M208 151 L208 179"/><path class="gate" d="M182 165 L208 165"/><circle cx="203" cy="165" r="4" fill="white" stroke="#253b4a" stroke-width="1.5"/><text x="233" y="170" font-size="15" text-anchor="start">M3</text><path class="wire" d="M220 105 L220 140"/><path class="wire" d="M220 190 L220 270"/><circle cx="220" cy="250" r="4" fill="#253b4a"/><path class="wire" d="M220 300 L220 311"/><path class="wire" d="M220 311 L220 339"/><path class="wire" d="M220 339 L220 350"/><path class="wire" d="M208 311 L208 339"/><path class="gate" d="M182 325 L208 325"/><text x="233" y="330" font-size="15" text-anchor="start">M1</text><path class="wire" d="M220 270 L220 300"/><path class="wire" d="M220 350 L220 410"/><path class="wire" d="M480 140 L480 151"/><path class="wire" d="M480 151 L480 179"/><path class="wire" d="M480 179 L480 190"/><path class="wire" d="M468 151 L468 179"/><path class="gate" d="M442 165 L468 165"/><circle