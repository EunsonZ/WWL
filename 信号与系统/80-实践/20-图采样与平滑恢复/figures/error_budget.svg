<polyline points="70.000,131.821 88.750,162.354 107.500,171.473 126.250,180.064 145.000,188.633 163.750,197.202 182.500,205.771 201.250,214.339 220.000,222.908 238.750,231.476 257.500,240.045 276.250,248.614 295.000,257.182 313.750,265.751 332.500,274.320 351.250,282.888 370.000,291.457 388.750,300.025 407.500,308.594 426.250,317.163 445.000,325.731 463.750,334.300 482.500,342.869 501.250,351.437 520.000,360.006 538.750,368.574 557.500,377.143 576.250,385.712 595.000,394.280 613.750,402.849 632.500,411.418 651.250,419.986 670.000,428.555" fill="none" stroke="#124e78" stroke-width="3" stroke-dasharray="7 5"/>
<text x="70" y="510" font-size="16" fill="#18293d">Iteration 0 to 32 | vertical: norm in V (log10)</text>
<text x="70" y="548" font-size="16" fill="#18293d">Orange: ||Qx-b||/q_min | Blue: error to direct optimum</text>
<text x="735" y="140" font-size="20" fill="#18293d">A different fixed zero-data case:</text>
<text x="735" y="181" font-size="18" fill="#18293d">C6, samples {0,3}, truth = u_s</text>
<text x="735" y="221" font-size="18" fill="#18293d">sample residual = 0.0 V</text>
<text x="735" y="261" font-size="18" fill="#18293d">unique smooth output error = 1.0 V</text>
<text x="735" y="316" font-size="20" fill="#124e78">Optimizer unique: YES</text>
<text x="735" y="354" font-size="20" fill="#b94e30">Truth identifiable: NO</text>
<text x="735" y="415" font-size="18" fill="#18293d">A stopped optimizer does not measure</text>
<text x="735" y="445" font-size="18" fill="#18293d">the missing direction.</text>
</g></svg>
