<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380" role="img" aria-labelledby="title desc">
<title id="title">C5 and K2,3: same clique number, different coloring</title>
<desc id="desc">A five-cycle needs three colors but has no triangle. A complete two-part graph with parts of size two and three needs two colors and reaches the six-edge Mantel bound.</desc>
<rect width="960" height="380" fill="#fafafa"/>
<text x="240" y="34" text-anchor="middle" font-size="22" font-family="sans-serif">C5</text>
<line x1="240.00" y1="76.00" x2="343.67" y2="151.32" stroke="#555" stroke-width="3"/>
<line x1="240.00" y1="76.00" x2="136.33" y2="151.32" stroke="#555" stroke-width="3"/>
<line x1="343.67" y1="151.32" x2="304.07" y2="273.18" stroke="#555" stroke-width="3"/>
<line x1="304.07" y1="273.18" x2="175.93" y2="273.18" stroke="#555" stroke-width="3"/>
<line x1="175.93" y1="273.18" x2="136.33" y2="151.32" stroke="#555" stroke-width="3"/>
<circle cx="240.00" cy="76.00" r="24" fill="#cfe5ff" stroke="#222" stroke-width="2"/>
<text x="240.00" y="81.00" text-anchor="middle" font-size="16" font-family="sans-serif">0:A</text>
<circle cx="343.67" cy="151.32" r="24" fill="#ffe1bb" stroke="#222" stroke-width="2"/>
<text x="343.67" y="156.32" text-anchor="middle" font-size="16" font-family="sans-serif">1:B</text>
<circle cx="304.07" cy="273.18" r="24" fill="#cfe5ff" stroke="#222" stroke-width="2"/>
<text x="304.07" y="278.18" text-anchor="middle" font-size="16" font-family="sans-serif">2:A</text>
<circle cx="175.93" cy="273.18" r="24" fill="#ffe1bb" stroke="#222" stroke-width="2"/>
<text x="175.93" y="278.18" text-anchor="middle" font-size="16" font-family="sans-serif">3:B</text>
<circle cx="136.33" cy="151.32" r="24" fill="#d4efdc" stroke="#222" stroke-width="2"/>
<text x="136.33" y="156.32" text-anchor="middle" font-size="16" font-family="sans-serif">4:C</text>
<text x="240" y="351" text-anchor="middle" font-size="17" font-family="sans-serif">omega=2, alpha=2, chi=3; 5 edges</text>
<text x="720" y="34" text-anchor="middle" font-size="22" font-family="sans-serif">K2,3</text>
<line x1="625.00" y1="125.00" x2="815.00" y2="85.00" stroke="#555" stroke-width="3"/>
<line x1="625.00" y1="125.00" x2="815.00" y2="185.00" stroke="#555" stroke-width="3"/>
<line x1="625.00" y1="125.00" x2="815.00" y2="285.00" stroke="#555" stroke-width="3"/>
<line x1="625.00" y1="245.00" x2="815.00" y2="85.00" stroke="#555" stroke-width="3"/>
<line x1="625.00" y1="245.00" x2="815.00" y2="185.00" stroke="#555" stroke-width="3"/>
<line x1="625.00" y1="245.00" x2="815.00" y2="285.00" stroke="#555" stroke-width="3"/>
<circle cx="625.00" cy="125.00" r="24" fill="#cfe5ff" stroke="#222" stroke-width="2"/>
