name: ChinaResearch handoff transfer
on:
  push:
    branches:
      - handoff/chinaresearch-2026-10-09
    paths:
      - .github/workflows/chinaresearch-handoff-transfer.yml
permissions:
  contents: write
jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Recover, verify and store the original handoff
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TRANSFER_URL: 'https://sdmntprwestus.oaiusercontent.com/files/00000000-7848-8230-afdd-acae8fc5bcb0/raw?se=2026-10-09T05%3A39%3A12Z&sp=r&sv=2026-02-06&sr=b&scid=5277e1b1-97d5-50b7-9271-cc883a8cf63b&skoid=89c13f8f-c33a-46d8-9bf3-ad7158c7790a&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-09T01%3A28%3A30Z&ske=2026-10-10T01%3A28%3A30Z&sks=b&skv=2026-02-06&sig=1/jwRBLgNB0jjWWtTabPgiev2SyloMC3OWcVdx1MJ40%3D'
          TRANSFER_KEY: '53d1e812a604f8eb90f1535b118f663eb928084da1f9bedda4f633ebb00781f4'
          TRANSFER_IV: '0acd78f9c5bc13f6b4f125bc0cbdf169'
        run: |
          set -euo pipefail
          echo "::add-mask::$TRANSFER_URL"
          echo "::add-mask::$TRANSFER_KEY"
          python3 - <<'PY'
          import base64, datetime, hashlib, io, json, os, pathlib, subprocess, urllib.request, zipfile
          repo = 'EunsonZ/WWL'
          branch = 'handoff/chinaresearch-2026-10-09'
          prefix = '资料/ChinaResearch/2026-10-09/'
          package = 'WWL_ChinaResearch_Handoff_2026-10-09'
          expected = 'cc1c0d31c8d806cf9777a84e2af2d11a58cab0e937af32043fa7bfdf5aacc48b'
          cipher_hash = '433d1e7b01683cce43df8b278a4b5d21c5b1a8dddc103580751422eccbbe3a5d'
          def digest(data):
              return hashlib.sha256(data).hexdigest()
          def api(path, method='GET', data=None):
              headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', 'User-Agent': 'WWL-authorized-handoff'}
              payload = None if data is None else json.dumps(data).encode('utf-8')
              if payload is not None:
                  headers['Content-Type'] = 'application/json'
              request = urllib.request.Request('https://api.github.com/repos/' + repo + path, data=payload, headers=headers, method=method)
              with urllib.request.urlopen(request, timeout=45) as response:
                  return json.load(response)
          assert os.environ['GITHUB_REPOSITORY'] == repo
          assert os.environ['GITHUB_REF'] == 'refs/heads/' + branch
          assert api('')['private'] is True, 'Destination must remain private'
          head = api('/git/ref/heads/' + branch)['object']['sha']
          assert head == os.environ['GITHUB_SHA'], 'Branch changed: refuse to overwrite'
          base_tree = api('/git/commits/' + head)['tree']['sha']
          # This download uses no GitHub authorization header. It contains ciphertext only.
          with urllib.request.urlopen(os.environ['TRANSFER_URL'], timeout=45) as response:
              encrypted = response.read(1553464)
          assert len(encrypted) == 1553463 and digest(encrypted) == cipher_hash, 'Encrypted payload mismatch'
          result = subprocess.run(['openssl', 'enc', '-d', '-aes-256-ctr', '-K', os.environ['TRANSFER_KEY'], '-iv', os.environ['TRANSFER_IV']], input=encrypted, stdout=subprocess.PIPE, stderr=subprocess.PIPE, check=True)
          original = result.stdout
          assert len(original) == 1553463 and digest(original) == expected, 'Original ZIP mismatch'
          files = {prefix + package + '.zip': original}
          with zipfile.ZipFile(io.BytesIO(original)) as archive:
              entries = archive.infolist()
              assert len(entries) == 11 and sum(x.file_size for x in entries) < 3000000
              assert archive.testzip() is None, 'ZIP CRC check failed'
              for entry in entries:
                  parts = pathlib.PurePosixPath(entry.filename)
                  assert not parts.is_absolute() and '..' not in parts.parts
                  assert entry.filename.startswith(package + '/') and not entry.is_dir()
                  assert ((entry.external_attr >> 16) & 0o170000) != 0o120000, 'Symlink not permitted'
                  files[prefix + entry.filename] = archive.read(entry)
          manifest = json.loads(files[prefix + package + '/manifest.json'])
          assert len(manifest['files']) == 10
          for item in manifest['files']:
              data = files[prefix + package + '/' + item['path']]
              assert len(data) == item['bytes'] and digest(data) == item['sha256'], item['path']
          receipt = {
              'status': 'original_archive_and_all_members_verified',
              'uploaded_on_utc': datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'repository': repo, 'branch': branch, 'parent_commit': head,
              'archive_path': prefix + package + '.zip', 'archive_bytes': len(original),
              'archive_sha256': expected, 'zip_crc': 'passed', 'member_count': 11,
              'manifest_entries_verified': 10,
              'files': [{'path': path, 'bytes': len(data), 'sha256': digest(data), 'git_blob_sha': hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()} for path, data in files.items()],
              'note': 'Transport and byte identity only. No research claims, PDF rendering or Codex implementation certified.'
          }
          files[prefix + 'UPLOAD_VERIFICATION.json'] = (json.dumps(receipt, ensure_ascii=False, indent=2) + '\n').encode('utf-8')
          files[prefix + 'SHA256SUMS'] = (expected + '  ' + package + '.zip\n').encode('utf-8')
          readme = '''# ChinaResearch 原始交接包

          本目录保存 2026-10-09 对话生成的交接包原件，以及从该 ZIP 逐字节解压的全部 11 个文件。研究实施见 [#119](https://github.com/EunsonZ/WWL/issues/119)，历史论证档案见 [#118](https://github.com/EunsonZ/WWL/issues/118)。

          ## 直接访问

          - [完整原始 ZIP](WWL_ChinaResearch_Handoff_2026-10-09.zip)
          - [72 页原始 PDF](WWL_ChinaResearch_Handoff_2026-10-09/originals/China_Governance_Economy_Society_2026_2035_Report.pdf)
          - [原始调查 TXT](WWL_ChinaResearch_Handoff_2026-10-09/originals/ResearchReport.txt)
          - [逐页提取正文](WWL_ChinaResearch_Handoff_2026-10-09/derived/report_extracted.md)
          - [新版反思概览](WWL_ChinaResearch_Handoff_2026-10-09/research/new_reflections.md)
          - [上传与逐文件校验回执](UPLOAD_VERIFICATION.json)

          ## Codex 获取

          材料位于 `handoff/chinaresearch-2026-10-09` 分支，不要求先合并即可读取。已经 clone WWL 的环境可执行：

          ```bash
          git fetch origin handoff/chinaresearch-2026-10-09
          git archive FETCH_HEAD -- '资料/ChinaResearch/2026-10-09' | tar -x -C /path/to/separate-workspace
          ```

          上述目标目录须自行替换为已存在的独立工作目录，避免覆盖人的修改。也可直接在 GitHub 本目录下载 ZIP；解压后从包内 README 与 #119 的纠偏要求开始阅读。

          ZIP 的 SHA-256：`cc1c0d31c8d806cf9777a84e2af2d11a58cab0e937af32043fa7bfdf5aacc48b`，大小 1,553,463 字节。在本目录可运行 `sha256sum -c SHA256SUMS`。

          ## 保留历史身份

          原 ZIP 未重新打包，PDF 未重排、重建或压缩。包内旧 README、manifest 的 `github_uploaded_binary: false` 反映原打包时尚未上传的状态，特意保留不改，以维护原件哈希；本目录的上传回执记录后续状态。原报告资料截止 2026-08-10，不是本次上传日的实时经济报告。

          字节校验不等于事实核查。原文中的待核数字、旧情景权重和已有纠偏由 #119 管理；不得把材料上传当成知识正文已经实施、独立审查完成或 Obsidian 已同步。
          '''
          import textwrap
          files[prefix + 'README.md'] = (textwrap.dedent(readme).strip() + '\n').encode('utf-8')
          # No archive member is executed. Store only the explicitly bounded material directory.
          tree_entries = []
          for path, data in files.items():
              blob = api('/git/blobs', 'POST', {'content': base64.b64encode(data).decode('ascii'), 'encoding': 'base64'})
              computed = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
              assert blob['sha'] == computed, 'GitHub blob identity mismatch'
              tree_entries.append({'path': path, 'mode': '100644', 'type': 'blob', 'sha': blob['sha']})
          tree = api('/git/trees', 'POST', {'base_tree': base_tree, 'tree': tree_entries})
          commit = api('/git/commits', 'POST', {'message': 'docs: preserve verified ChinaResearch ZIP and all original handoff files (#119)', 'tree': tree['sha'], 'parents': [head]})
          assert api('/git/ref/heads/' + branch)['object']['sha'] == head, 'Concurrent branch update'
          api('/git/refs/heads/' + branch, 'PATCH', {'sha': commit['sha'], 'force': False})
          print('Uploaded commit:', commit['sha'])
          print('Verified original ZIP SHA-256:', expected)
          print('Archive members:', 11, 'stored files including access documentation:', len(files))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'w', encoding='utf-8') as summary:
              summary.write('# Original handoff uploaded\n\nCommit: `' + commit['sha'] + '`\n\nOriginal ZIP SHA-256: `' + expected + '`\n\nAll 11 archive members and 10 manifest entries verified. Research and knowledge-base implementation remain separate.\n')
          PY
