</text><line x1="100" y1="333" x2="145" y2="333"/><line x1="130" y1="318" x2="145" y2="318"/><circle cx="130" cy="318" r="3" fill="#111"/><path d="M145 310 L145 340 L178 325 Z"/><text x="147" y="322" font-size="12">+</text><text x="147" y="336" font-size="12">-</text><line x1="160" y1="316.8" x2="160" y2="305"/><line x1="160" y1="333.2" x2="160" y2="345"/><text x="164" y="309" font-size="10">+</text><text x="164" y="347" font-size="10">-</text><line x1="178" y1="325" x2="225" y2="325"/><text x="230" y="330" font-size="13">t7</text><line x1="130" y1="55" x2="130" y2="318"/><text x="105" y="49" font-size="12">Vin</text><text x="275" y="90" font-size="14">Vin shared</text><text x="275" y="125" font-size="14">latch clock</text><text x="275" y="165" font-size="14">rails +/-3.3V</text><text x="275" y="205" font-size="14">all comparator</text><text x="275" y="230" font-size="14">supply pins</text><text x="275" y="255" font-size="14">same model</text><text x="15" y="378" font-size="14">valid thermometer -&gt; encode -&gt; register</text><text x="15" y="430" font-size="17">Pipeline: two3bit stages, gain8 residue</text><text x="15" y="469" font-size="14">v[k] -&gt; c1[k], D1=c1*3/8</text><text x="15" y="500" font-size="14">r[k]=8(v[k]-D1[k]) -&gt; c2[k] next stage</text><text x="15" y="531" font-size="14">align: code[k]=8c1[k]+c2[k]</text><text x="15" y="562" font-size="14">Filled pipeline: rate1/clock; latency2clocks</text><text x="15" y="620" font-size="17">First-order normalized delta-sigma</text><text x="15" y="662" font-size="14">q[k]=s[k]+u[k]; y[k]=sign(q[k])</text><text x="15" y="693" font-size="14">s[k+1]=q[k]-y[k], feedbackDAC +/-1</text><text x="15" y="724" font-size="14">Initial s0=0; |u|&lt;=1, |s0|&lt;=1</text><text x="15" y="755" font-size="14">Bounded state here is proved, not assumed</text><text x="15" y="786" font-size="14">Linear e replacement: STF1, NTF1-z^-1</text></g><style>text{fill:#111;stroke:none;font-family:DejaVu Sans,sans-serif}</style></svg>