<svg xmlns="http://www.w3.org/2000/svg" width="980" height="610" viewBox="0 0 980 610" role="img" aria-labelledby="title desc">
<title id="title">同一有限工作负载的投影字节与批入口调用</title><desc id="desc">上半图比较行文件完整记录与四列投影返回的序列化字节；下半图比较显式入口调用。单位分开，不给运行时间或物理I/O加速结论。</desc><rect width="100%" height="100%" fill="white"/><g font-family="sans-serif"><text x="32" y="35" font-size="23" fill="#17212b">同一查询：少读列与少进批入口分别省什么？</text><text x="32" y="65" font-size="15" fill="#17212b">N=1024；9列×int64；筛选发生日≥10且渠道web；每条事实仍只算一次</text><text x="32" y="105" font-size="18" fill="#17212b">A · 序列化payload返回字节（不是SSD物理I/O）</text><text x="35" y="154" font-size="16" fill="#17212b">按行全记录</text><rect x="205" y="132" width="560.0" height="32" fill="#326b9b"/><text x="770.0" y="155" font-size="14" fill="#17212b">73,728 bytes</text><text x="35" y="216" font-size="16" fill="#17212b">按列投影4列</text><rect x="205" y="194" width="248.9" height="32" fill="#55916a"/><text x="458.8888888888889" y="217" font-size="14" fill="#17212b">32,768 bytes</text><text x="32" y="290" font-size="18" fill="#17212b">B · 显式处理入口调用；行内判断/聚合工作仍在</text><text x="32" y="318" font-size="15" fill="#17212b">所有路径predicate_rows=1024；selected/aggregate_updates=512</text><text x="35" y="366" font-size="15" fill="#17212b">逐行入口</text><rect x="205" y="345" width="560.0" height="27" fill="#8768a5"/><text x="773.0" y="365" font-size="14" fill="#17212b">1024</text><text x="35" y="406" font-size="15" fill="#17212b">批入口 B=1</text><rect x="205" y="385" width="560.0" height="27" fill="#8768a5"/><text x="773.0" y="405" font-size="14" fill="#17212b">1024</text><text x="35" y="446" font-size="15" fill="#17212b">批入口 B=16</text><rect x="205" y="425" width="35.0" height="27" fill="#8768a5"/><text x="248.0" y="445" font-size="14" fill="#17212b">64</text><text x="35" y="486" font-size="15" fill="#17212b">批入口 B=64</text><rect x="205" y="465" width="8.8" height="27" fill="#8768a5"/><text x="221.75" y="485" font-size="14" fill="#17212b">16</text><text x="35" y="526" font-size="15" fill="#17212b">批入口 B=2048</text><rect x="205" y="505" width="0.5" height="27" fill="#8768a5"/><text x="213.546875" y="525" font-size="14" fill="#17212b">1</text><text x="32" y="585" font-size="15" fill="#17212b">Python批循环 ≠ SIMD；不据这些计数声称真实引擎加速。</text></g></svg>
