<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="370" viewBox="0 0 1080 370"><rect width="1080" height="370" fill="#f6f8fc"/><g font-family="PingFang SC, Noto Sans CJK SC, sans-serif"><text x="30" y="43" font-size="26" fill="#12243b">独立DB计划：费用、OCI和缴款分开</text><text x="30" y="78" font-size="16" fill="#42536a">单位：万元；IFRS，期初义务100 / 计划资产80；折现率5%</text><rect x="30.0" y="113" width="241.5" height="165" rx="12" fill="#224a73"/><text x="44.0" y="150" font-size="19" fill="#fff">期初净负债</text><text x="44.0" y="192" font-size="22" fill="#fff">20</text><text x="44.0" y="233" font-size="14" fill="#fff">100 - 80</text><path d="M273.5,193 h14 l-5,-5 m5,5 l-5,5" fill="none" stroke="#42536a" stroke-width="2"/><rect x="289.5" y="113" width="241.5" height="165" rx="12" fill="#22637b"/><text x="303.5" y="150" font-size="19" fill="#fff">损益成本</text><text x="303.5" y="192" font-size="22" fill="#fff">+ 9</text><text x="303.5" y="233" font-size="14" fill="#fff">服务8 + 净利息1</text><path d="M533.0,193 h14 l-5,-5 m5,5 l-5,5" fill="none" stroke="#42536a" stroke-width="2"/><rect x="549.0" y="113" width="241.5" height="165" rx="12" fill="#9b6032"/><text x="563.0" y="150" font-size="19" fill="#fff">OCI损失</text><text x="563.0" y="192" font-size="22" fill="#fff">+ 7</text><text x="563.0" y="233" font-size="14" fill="#fff">义务精算6 + 回报偏差1</text><path d="M792.5,193 h14 l-5,-5 m5,5 l-5,5" fill="none" stroke="#42536a" stroke-width="2"/><rect x="808.5" y="113" width="241.5" height="165" rx="12" fill="#29825d"/><text x="822.5" y="150" font-size="19" fill="#fff">雇主缴款</text><text x="822.5" y="192" font-size="22" fill="#fff">- 10</text><text x="822.5" y="233" font-size="14" fill="#fff">期末净负债26 = 115 - 89</text><text x="30" y="325" font-size="17" fill="#23374e">20 + 9 + 7 - 10 = 26；基金付福利4同时减义务和资产，不再减雇主现金。</text></g></svg>