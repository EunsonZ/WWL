<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="825" viewBox="0 0 1160 825">
<title>STFT of the same three synthetic signals</title><desc>Hann is symmetric length L. No frame padding or centering. Time cells surround actual frame centers, frequency cells surround bin centers. Same global amplitude reference across cases; colors clip -80 to zero dB. Full complex matrices saved in samples.npz.</desc>
<rect width="100%" height="100%" fill="white"/>
<style>text{font:14px Arial,sans-serif;fill:#18212c}.head{font-size:19px;font-weight:bold}.grid{stroke:#dce2e8;stroke-width:1}</style>
<text x="25" y="28" class="head">Same samples: Hann L=400, H=160, FFT=512; 98 complete frames</text>
<defs><clipPath id="p0"><rect x="80" y="75" width="950" height="165"/></clipPath></defs>
<text x="80" y="60">base: f0=125 Hz; pole frequencies [500, 1500] Hz</text>
<image href="data:image/png;base64," x="87.095313" y="74.355469" width="931.000000" height="166.289062" preserveAspectRatio="none" image-rendering="pixelated" clip-path="url(#p0)"/>
<text x="25" y="82">4000</text><text x="35" y="240">0 Hz</text>
<text x="80" y="265">0</text><text x="970" y="265">1 s</text>
<text x="80" y="288">White margins: no frame-center cells. Black=-80 dB; bright pink=0 dB (global |STFT| reference).</text>
<defs><clipPath id="p1"><rect x="80" y="325" width="950" height="165"/></clipPath></defs>
<text x="80" y="310">pitch: f0=250 Hz; pole frequencies [500, 1500] Hz</text>
<image href="data:image/png;base64," x="87.095313" y="324.355469" width="931.000000" height="166.289062" preserveAspectRatio="none" image-rendering="pixelated" clip-path="url(#p1)"/>
<text x="25" y="332">4000</text><text x="35" y="490">0 Hz</text>
<text x="80" y="515">0</text><text x="970" y="515">1 s</text>
<text x="80" y="538">White margins: no frame-center cells. Black=-80 dB; bright pink=0 dB (global |STFT| reference).</text>
<defs><clipPath id="p2"><rect x="80" y="575" width="950" height="165"/></clipPath></defs>
<text x="80" y="560">filter: f0=125 Hz; pole frequencies [500, 2200] Hz</text>
<image href="data:image/png;base64," x="87.095313" y="574.355469" width="931.000000" height="166.289062" preserveAspectRatio="none" image-rendering="pixelated" clip-path="url(#p2)"/>
<text x="25" y="582">4000</text><text x="35" y="740">0 Hz</text>
<text x="80" y="765">0</text><text x="970" y="765">1 s</text>
<text x="80" y="788">White margins: no frame-center cells. Black=-80 dB; bright pink=0 dB (global |STFT| reference).</text>
</svg>
