<svg xmlns="http://www.w3.org/2000/svg" width="760" height="600" viewBox="0 0 760 600" role="img" aria-labelledby="title desc">
<title id="title">Quadratic reciprocity lattice for p=7 q=11</title>
<desc id="desc">Fifteen points with i=1,2,3 and j=1,...,5. Eight blue circles satisfy 7j less than 11i; seven orange squares satisfy 11i less than 7j. No point is on the line.</desc>
<rect width="760" height="600" fill="#fafafa"/>
<text x="380" y="32" text-anchor="middle" font-family="sans-serif" font-size="22">p=7, q=11: 8 + 7 = 15 lattice points</text>
<line x1="125" y1="500" x2="650.0" y2="500" stroke="#555"/>
<line x1="125" y1="500" x2="125" y2="71.0" stroke="#555"/>
<line x1="125" y1="500" x2="650.0" y2="71.0" stroke="#666" stroke-width="2" stroke-dasharray="7 5"/>
<text x="275" y="530" text-anchor="middle" font-family="sans-serif" font-size="18">i=1</text>
<text x="425" y="530" text-anchor="middle" font-family="sans-serif" font-size="18">i=2</text>
<text x="575" y="530" text-anchor="middle" font-family="sans-serif" font-size="18">i=3</text>
<text x="105" y="428" text-anchor="end" font-family="sans-serif" font-size="18">j=1</text>
<text x="105" y="350" text-anchor="end" font-family="sans-serif" font-size="18">j=2</text>
<text x="105" y="272" text-anchor="end" font-family="sans-serif" font-size="18">j=3</text>
<text x="105" y="194" text-anchor="end" font-family="sans-serif" font-size="18">j=4</text>
<text x="105" y="116" text-anchor="end" font-family="sans-serif" font-size="18">j=5</text>
<circle cx="275" cy="422" r="7" fill="#175cd3"/>
<circle cx="425" cy="422" r="7" fill="#175cd3"/>
<circle cx="425" cy="344" r="7" fill="#175cd3"/>
<circle cx="425" cy="266" r="7" fill="#175cd3"/>
<circle cx="575" cy="422" r="7" fill="#175cd3"/>
<circle cx="575" cy="344" r="7" fill="#175cd3"/>
<circle cx="575" cy="266" r="7" fill="#175cd3"/>
<circle cx="575" cy="188" r="7" fill="#175cd3"/>
<rect x="269" y="338" width="12" height="12" fill="#b54708"/>
<rect x="269" y="260" width="12" height="12" fill="#b54708"/>
<rect x="269" y="182" width="12" height="12" fill="#b54708"/>
<rect x="269" y="104" width="12" height="12" fill="#b54708"/>
<rect x="419" y="182" width="12" height="12" fill="#b54708"/>
<rect x="419" y="104" width="12" height="12" fill="#b54708"/>
<rect x="569" y="104" width="12" height="12" fill="#b54708"/>
<text x="380" y="572" text-anchor="middle" font-family="sans-serif" font-size="18">circle: 7j &lt; 11i; square: 11i &lt; 7j; dashed: equality</text>
</svg>
