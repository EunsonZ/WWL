<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 420" role="img"><title>Exact sampling variance does not make a nonlinear network unbiased</title><desc>All subsets of neighbors -1,0,1,2. Left: sample mean variance equals finite-population formula. Right: expectation of ReLU(sample mean minus .5) differs from ReLU(population mean minus .5).</desc>
<rect width="1100" height="420" fill="white"/><g font-family="sans-serif" fill="#172d3c">
<text x="20" y="27" font-size="19" >Uniform sampling WITHOUT replacement: all finite subsets, no Monte Carlo error</text>
<line x1="70" y1="80" x2="70" y2="330" stroke="#54616c" />
<line x1="70" y1="330" x2="445" y2="330" stroke="#54616c" />
<line x1="70" y1="330.0" x2="445" y2="330.0" stroke="#e6ebef" />
<text x="61" y="334.0" font-size="13" text-anchor="end">0.00</text>
<line x1="70" y1="253.33333333333331" x2="445" y2="253.33333333333331" stroke="#e6ebef" />
<text x="61" y="257.3333333333333" font-size="13" text-anchor="end">0.50</text>
<line x1="70" y1="176.66666666666666" x2="445" y2="176.66666666666666" stroke="#e6ebef" />
<text x="61" y="180.66666666666666" font-size="13" text-anchor="end">1.00</text>
<line x1="70" y1="100.0" x2="445" y2="100.0" stroke="#e6ebef" />
<text x="61" y="104.0" font-size="13" text-anchor="end">1.50</text>
<text x="70" y="354" font-size="14" text-anchor="middle">1</text>
<text x="195" y="354" font-size="14" text-anchor="middle">2</text>
<text x="320" y="354" font-size="14" text-anchor="middle">3</text>
<text x="445" y="354" font-size="14" text-anchor="middle">4</text>
<text x="70" y="65" font-size="16" >Variance of sample mean (feature units squared)</text>
<polyline fill="none" stroke="#166b99" stroke-width="2.5" points="70,138.33333333333334 195,266.1111111111111 320,308.7037037037037 445,330.0" />
<circle cx="70" cy="138.33333333333334" r="4" fill="white" stroke="#166b99" stroke-width="2"/>
<circle cx="195" cy="266.1111111111111" r="4" fill="white" stroke="#166b99" stroke-width="2"/>
<circle cx="320" cy="308.7037037037037" r="4" fill="white" stroke="#166b99" stroke-width="2"/>
<circle cx="445" cy="330.0" r="4" fill="white" stroke="#166b99" stroke-width="2"/>
<text x="175" y="393" font-size="16" >Fanout f (integer)</text>
<line x1="605" y1="80" x2="605" y2="330" stroke="#54616c" />
<line x1="605" y1="330" x2="980" y2="330" stroke="#54616c" />
<line x1="605" y1="330.0" x2="980" y2="330.0" stroke="#e6ebef" />
<text x="596" y="334.0" font-size="13" text-anchor="end">0.00</text>
<line x1="605" y1="253.33333333333334" x2="980" y2="253.33333333333334" stroke="#e6ebef" />
<text x="596" y="257.33333333333337" font-size="13" text-anchor="end">0.20</text>
<line x1="605" y1="176.66666666666669" x2="980" y2="176.66666666666669" stroke="#e6ebef" />
<text x="596" y="180.66666666666669" font-size="13" text-anchor="end">0.40</text>
<line x1="605" y1="100.0" x2="980" y2="100.0" stroke="#e6ebef" />
<text x="596" y="104.0" font-size="13" text-anchor="end">0.60</text>
<text x="605" y="354" font-size="14" text-anchor="middle">1</text>
<text x="730" y="354" font-size="14" text-anchor="middle">2</text>
<text x="855" y="354" font-size="14" text-anchor="middle">3</text>
<text x="980" y="354" font-size="14" text-anchor="middle">4</text>
<text x="605" y="65" font-size="16" >After ReLU(t - .5): output feature units</text>
<polyline fill="none" stroke="#b45524" stroke-width="2.5" points="605,138.33333333333331 730,234.16666666666666 855,266.1111111111111 980,330.0" />
<line x1="605" y1="330.0" x2="980" y2="330.0" stroke="#52616b" stroke-width="3" stroke-dasharray="5 4"/>
<text x="710" y="393" font-size="16" >Fanout f (integer)</text>
<text x="85" y="100" font-size="13" >line: enumeration; circles: exact formula</text>
<text x="620" y="100" font-size="13" >solid: E[ReLU]; dashed: ReLU(E)=0</text>
</g></svg>