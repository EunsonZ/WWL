<text x="1050" y="388" font-size="19" fill="#182a3a">1/2</text>
<text x="35" y="474" font-size="19" fill="#182a3a">One draw 0000: knowledge HT for (0,0) = 8, true mean = 1. Unbiasedness is an expectation.</text>
<text x="35" y="510" font-size="19" fill="#b33d26">Exactly 2 treated: (0,0) impossible. No inverse weight can recover that missing exposure.</text>
<text x="35" y="542" font-size="17" fill="#182a3a">All numbers are synthetic. Scores and design come from inputs/model.json; no real audience observations.</text>
