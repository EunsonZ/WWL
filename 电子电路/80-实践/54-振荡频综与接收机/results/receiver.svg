<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="920" viewBox="0 0 1200 920"><title>同一接收机：少一点阻塞，付出多少噪声代价</title><desc>显式参考面、前置损耗的联合预算、带外相噪变式与真实/声明功耗边界。</desc><rect width="1200" height="920" fill="#fafcfe"/><g font-family="PingFang SC,Noto Sans CJK SC,sans-serif"><text x="35" y="42" font-size="28" fill="#17293a">同一接收机：少一点阻塞，付出多少噪声代价</text><text x="35" y="82" font-size="19" fill="#17293a">下列为显式单向/匹配模块模型，不是两旧MOS电路的实际物理级联。</text><rect x="30" y="115" width="180" height="65" rx="6" fill="#e9f1f6" stroke="#55778c"/><text x="42" y="154.5" font-size="19" fill="#17293a">前置损耗 L</text><rect x="240" y="115" width="160" height="65" rx="6" fill="#e9f1f6" stroke="#55778c"/><text x="252" y="154.5" font-size="19" fill="#17293a">CG 输出1kΩ</text><rect x="430" y="115" width="250" height="65" rx="6" fill="#e9f1f6" stroke="#55778c"/><text x="442" y="154.5" font-size="19" fill="#17293a">缓冲1k→差分50Ω</text><rect x="710" y="115" width="210" height="65" rx="6" fill="#e9f1f6" stroke="#55778c"/><text x="722" y="154.5" font-size="19" fill="#17293a">基波混频到10MHz</text><rect x="950" y="115" width="210" height="65" rx="6" fill="#e9f1f6" stroke="#55778c"/><text x="962" y="154.5" font-size="19" fill="#17293a">IF增益100</text><text x="35" y="235" font-size="19" fill="#17293a">相同110MHz希望 / 130与150MHz等功率阻塞：前衰减减少三阶失真，也损害NF和灵敏度。</text><text x="35" y="292" font-size="18" fill="#17293a">L</text><text x="150" y="292" font-size="18" fill="#17293a">NF dB</text><text x="330" y="292" font-size="18" fill="#17293a">总增益 dB</text><text x="540" y="292" font-size="18" fill="#17293a">C/IM3 dB</text><text x="750" y="292" font-size="18" fill="#17293a">未选频峰值 √W</text><text x="1000" y="292" font-size="18" fill="#17293a">联合结果</text><text x="35" y="340" font-size="21" fill="#c25b23">1</text><text x="150" y="340" font-size="21" fill="#c25b23">12.707</text><text x="330" y="340" font-size="21" fill="#c25b23">14.512</text><text x="540" y="340" font-size="21" fill="#c25b23">25.000</text><text x="750" y="340" font-size="21" fill="#c25b23">0.01693</text><text x="1000" y="340" font-size="21" fill="#c25b23">FAIL</text><text x="35" y="395" font-size="21" fill="#c25b23">2</text><text x="150" y="395" font-size="21" fill="#c25b23">15.718</text><text x="330" y="395" font-size="21" fill="#c25b23">11.502</text><text x="540" y="395" font-size="21" fill="#c25b23">31.021</text><text x="750" y="395" font-size="21" fill="#c25b23">0.01198</text><text x="1000" y="395" font-size="21" fill="#c25b23">FAIL</text><text x="35" y="450" font-size="21" fill="#19866c">4</text><text x="150" y="450" font-size="21" fill="#19866c">18.728</text><text x="330" y="450" font-size="21" fill="#19866c">8.492</text><text x="540" y="450" font-size="21" fill="#19866c">37.041</text><text x="750" y="450" font-size="21" fill="#19866c">0.00848</text><text x="1000" y="450" font-size="21" fill="#19866c">PASS</text><text x="35" y="530" font-size="19" fill="#17293a">标称远偏移LO谱：20/40/40/60MHz四项，不外推低偏移PLL连续模型。</text><text x="35" y="575" font-size="19" fill="#17293a">无衰减热噪声 2.185e-13 W / RM 3.576e-14 W；B=100kHz。</text><text x="35" y="620" font-size="19" fill="#17293a">L=4时：名义带外谱 SNR=24.924dB；只将带外谱×10 →23.608dB，原带内抖动不变。</text><text x="35" y="665" font-size="19" fill="#17293a">预算：NF≤19dB，增益≥8dB，C/IM3≥35dB，峰值≤.01√W，SNR≥24.5dB。</text><text x="35" y="720" font-size="19" fill="#17293a">功耗合计 9.900000mW：LC/CG来自实际Q，其余缓冲/IF/驱动/控制为声明卡。</text><text x="35" y="775" font-size="19" fill="#17293a">R=2k的477.345fs与L=4名义谱同时通过；强带外谱使SNR失败，不能只挑最低抖动。</text><text x="35" y="840" font-size="19" fill="#17293a">立方IM3是同频相干干扰，单独报C/IM3；未把它伪装成随机热噪声加进NF。</text></g></svg>
