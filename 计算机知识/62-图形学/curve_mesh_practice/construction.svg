<text x="35" y="502" font-size="16">几何</text><text x="280" y="502" font-size="16">误差</text><text x="450" y="502" font-size="16">顶点/边/面</text><text x="690" y="502" font-size="16">64px覆盖数</text>
<text x="35" y="535" font-size="16">base_n4</text><text x="280" y="535" font-size="16">0.0625</text><text x="450" y="535" font-size="16">10/17/8</text><text x="690" y="535" font-size="16">54</text>
<text x="35" y="560" font-size="16">base_n8</text><text x="280" y="560" font-size="16">0.015625</text><text x="450" y="560" font-size="16">18/33/16</text><text x="690" y="560" font-size="16">58</text>
<text x="35" y="585" font-size="16">base_n16</text><text x="280" y="585" font-size="16">0.00390625</text><text x="450" y="585" font-size="16">34/65/32</text><text x="690" y="585" font-size="16">56</text>
<text x="35" y="610" font-size="16">raised_n4</text><text x="280" y="610" font-size="16">0.09375</text><text x="450" y="610" font-size="16">10/17/8</text><text x="690" y="610" font-size="16">60</text>
<text x="35" y="635" font-size="16">nonuniform</text><text x="280" y="635" font-size="16">0.36</text><text x="450" y="635" font-size="16">10/17/8</text><text x="690" y="635" font-size="16">62</text>
</g></svg>
