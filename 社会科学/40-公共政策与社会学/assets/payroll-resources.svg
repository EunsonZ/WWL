<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="590" viewBox="0 0 1040 590" role="img">
<title>工资怎样连接到生活资源</title>
<desc>三列两行的六个检查点，依次连线。详见相邻正文解释。</desc>
<rect width="1040" height="590" fill="#f5f7fb"/>
<defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8" fill="#55708c"/></marker></defs>
<g font-family="PingFang SC,Microsoft YaHei,sans-serif">
<text x="40" y="56" font-size="28" fill="#142b46">工资怎样连接到生活资源</text>
<rect x="40" y="110" width="300" height="142" rx="14" fill="#fff" stroke="#a4b7cb"/>
<text x="60" y="150" font-size="23" fill="#16466b">1. 雇主成本 12000</text>
<text x="60" y="195" font-size="18" fill="#33465c">工资10000＋1800＋200</text>
<path d="M343,181 L364,181" stroke="#55708c" fill="none" stroke-width="2" marker-end="url(#a)"/>
<rect x="370" y="110" width="300" height="142" rx="14" fill="#fff" stroke="#a4b7cb"/>
<text x="390" y="150" font-size="23" fill="#16466b">2. 税前工资 10000</text>
<text x="390" y="195" font-size="18" fill="#33465c">扣个人款项之前</text>
<path d="M673,181 L694,181" stroke="#55708c" fill="none" stroke-width="2" marker-end="url(#a)"/>
<rect x="700" y="110" width="300" height="142" rx="14" fill="#fff" stroke="#a4b7cb"/>
<text x="720" y="150" font-size="23" fill="#16466b">3. 到手现金 8780</text>
<text x="720" y="195" font-size="18" fill="#33465c">减个人缴费800、税420</text>
<rect x="40" y="315" width="300" height="142" rx="14" fill="#fff" stroke="#a4b7cb"/>
<text x="60" y="355" font-size="23" fill="#16466b">4. 家庭现金 13480</text>
<text x="60" y="400" font-size="18" fill="#33465c">加伴侣、转移和财产现金</text>
<path d="M343,386 L364,386" stroke="#55708c" fill="none" stroke-width="2" marker-end="url(#a)"/>
<rect x="370" y="315" width="300" height="142" rx="14" fill="#fff" stroke="#a4b7cb"/>
<text x="390" y="355" font-size="23" fill="#16466b">5. 价格与支出</text>
<text x="390" y="400" font-size="18" fill="#33465c">现金能买多少，剩多少</text>
<path d="M673,386 L694,386" stroke="#55708c" fill="none" stroke-width="2" marker-end="url(#a)"/>
<rect x="700" y="315" width="300" height="142" rx="14" fill="#fff" stroke="#a4b7cb"/>
<text x="720" y="355" font-size="23" fill="#16466b">6. 服务、时间与风险</text>
<text x="720" y="400" font-size="18" fill="#33465c">分别检查，不能直接加钱</text>
<path d="M850,258 L850,285 L190,285 L190,309" stroke="#55708c" fill="none" stroke-width="2" marker-end="url(#a)"/>
<text x="40" y="530" font-size="17" fill="#33465c">金额为元/月；虚构税制与教学账。家庭现金不是完整统计可支配收入。</text>
<text x="40" y="565" font-size="15" fill="#52677e">箭头为阅读连接；不能从先后步骤直接推断因果、法律效力或福利。</text>
</g></svg>
