<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600">
<title>Optimization certificate versus signal error</title><desc>GD残差证书核同一二次目标；唯一最小点并非真信号可辨。</desc>
<rect width="100%" height="100%" fill="#fbfcfe"/>
<g font-family="Arial, sans-serif" fill="#18293d">
<text x="35" y="38" font-size="25" fill="#18293d">Separate optimization error from signal error</text>
<text x="35" y="70" font-size="17" fill="#18293d">Same even-node observations | mu = 0.1 | step = 1 / q_max</text>
<polyline points="70.000,108.000 70.000,475.000 670.000,475.000" fill="none" stroke="#8798aa" stroke-width="1"/>
<text x="18" y="480" font-size="13" fill="#18293d">1e-12</text>
<text x="18" y="399" font-size="13" fill="#18293d">1e-9</text>
<text x="18" y="318" font-size="13" fill="#18293d">1e-6</text>
<text x="18" y="237" font-size="13" fill="#18293d">1e-3</text>
<text x="18" y="156" font-size="13" fill="#18293d">1e0</text>
