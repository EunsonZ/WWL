<svg xmlns="http://www.w3.org/2000/svg" width="900" height="405" viewBox="0 0 900 405">
<title>Life expectancy is the sum of lived-year areas</title>
<desc>Synthetic life-table comparison. baseline, tail m=1/20: contributions in years (0-20: 18, 20-40: 12, 40+: 8); e0=38. tail m doubled, tail m=1/10: contributions in years (0-20: 18, 20-40: 12, 40+: 4); e0=34.</desc>
<rect width="900" height="405" fill="white"/>
<g font-family="sans-serif" font-size="18" fill="#18232b">
<text x="30" y="35">Synthetic life table: contributions to e0 (years)</text>
<text x="30" y="102">baseline</text>
<rect x="220" y="75" width="251.053" height="44" fill="#31688e" stroke="white"/>
<text x="345.526" y="103" text-anchor="middle" fill="black">18</text>
<rect x="471.053" y="75" width="167.368" height="44" fill="#35b779" stroke="white"/>
<text x="554.737" y="103" text-anchor="middle" fill="black">12</text>
<rect x="638.421" y="75" width="111.579" height="44" fill="#f0bd38" stroke="white"/>
<text x="694.211" y="103" text-anchor="middle" fill="black">8</text>
<text x="762" y="103">sum = 38</text>
<text x="30" y="197">tail m doubled</text>
<rect x="220" y="170" width="251.053" height="44" fill="#31688e" stroke="white"/>
<text x="345.526" y="198" text-anchor="middle" fill="black">18</text>
<rect x="471.053" y="170" width="167.368" height="44" fill="#35b779" stroke="white"/>
<text x="554.737" y="198" text-anchor="middle" fill="black">12</text>
<rect x="638.421" y="170" width="55.7895" height="44" fill="#f0bd38" stroke="white"/>
<text x="666.316" y="198" text-anchor="middle" fill="black">4</text>
<text x="706.211" y="198">sum = 34</text>
<rect x="220" y="264" width="16" height="16" fill="#31688e"/>
<text x="248" y="280">0-20: 18 / 18 years (baseline / doubled)</text>
<rect x="220" y="297" width="16" height="16" fill="#35b779"/>
<text x="248" y="313">20-40: 12 / 12 years (baseline / doubled)</text>
<rect x="220" y="330" width="16" height="16" fill="#f0bd38"/>
<text x="248" y="346">40+: 8 / 4 years (baseline / doubled)</text>
<text x="220" y="388" font-size="14">Labels rounded to 4 significant digits; exact values in results.json and SVG description.</text>
</g></svg>
