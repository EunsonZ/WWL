<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>预约反馈教学原型</title>
<style>
body { font: 18px/1.6 system-ui; max-width: 42rem; margin: 2rem auto; padding: 0 1rem; }
label { display: block; margin-top: 1rem; }
input, button { font: inherit; padding: .45rem; }
button { margin: .75rem .5rem .75rem 0; }
:focus-visible { outline: 3px solid #1459b8; outline-offset: 3px; }
[aria-invalid="true"] { border: 2px solid #a00000; }
#errors { color: #800000; }
</style>
<h1>预约反馈教学原型</h1>
<p>合成社区咨询室，同一天09:00–17:00。不连接服务器；刷新清空记录，不产生真实预约。</p>
<p id="rules">时间填从午夜起的整数分钟，例如09:00填540。时长30–120分钟，结束不晚于1020。结束点不占用。</p>
<form id="form" novalidate>
<label for="start">开始分钟</label>
<input id="start" type="number" min="540" max="990" step="1" value="540" aria-describedby="rules errors" required>
<label for="end">结束分钟</label>
<input id="end" type="number" min="570" max="1020" step="1" value="600" aria-describedby="rules errors" required>
<p id="errors"></p>
<button type="submit">创建教学预约</button>
</form>
<p id="result" role="status" aria-live="polite" aria-atomic="true">尚未创建预约。</p>
<h2>本页活动预约</h2>
<ul id="bookings"></ul>
<script>
"use strict";
const form = document.getElementById("form");
const startInput = document.getElementById("start");
const endInput = document.getElementById("end");
const errors = document.getElementById("errors");
const result = document.getElementById("result");
const list = document.getElementById("bookings");
let nextId = 1;
const bookings = [];
function reportError(message, field) {
  errors.textContent = message;
  field.setAttribute("aria-invalid", "true");
  result.textContent = "未创建：" + message;
  field.focus();
}
function render() {
  list.replaceChildren();
  for (const b of bookings.filter(b => b.active)) {
    const item = document.createElement("li");
    item.append(document.createTextNode(`预约${b.id}：${b.start}–${b.end}分钟 `));
    const cancel = document.createElement("button");
    cancel.type = "button";
    cancel.textContent = `取消预约${b.id}`;
    cancel.addEventListener("click", () => {
      b.active = false;
      render();
      result.textContent = `已取消预约${b.id}，其区间已释放。`;
      startInput.focus();
    });
    item.append(cancel);
    list.append(item);
  }
}
form.addEventListener("submit", event => {
  event.preventDefault();
  errors.textContent = "";
  startInput.removeAttribute("aria-invalid");
  endInput.removeAttribute("aria-invalid");
  const start = startInput.valueAsNumber;
  const end = endInput.valueAsNumber;
  if (!Number.isInteger(start) || start < 540 || start > 990) {
    reportError("开始必须为540–990的整数分钟。", startInput); return;
  }
  if (!Number.isInteger(end) || end > 1020 || end <= start) {
    reportError("结束必须为大于开始且不超过1020的整数分钟。", endInput); return;
  }
  if (end - start < 30 || end - start > 120) {
    reportError("时长必须为30–120分钟，请修改结束。", endInput); return;
  }
  if (bookings.some(b => b.active && start < b.end && b.start < end)) {
    reportError("该时间与活动预约重叠，请修改开始或结束。", startInput); return;
  }
  const booking = {id: nextId++, start, end, active: true};
  bookings.push(booking);
  render();
  result.textContent = `已创建预约${booking.id}：${start}–${end}分钟。`;
});
</script>
</html>
