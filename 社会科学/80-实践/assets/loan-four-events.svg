<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1080" viewBox="0 0 360 1080" role="img" aria-labelledby="title desc">
<title id="title">同一贷款的四个事件</title>
<desc id="desc">竖向箭头表示时间顺序。小陈存款是对银行资产，债务是还款义务，银行准备金用于跨行结算。四事件为放贷20、付款20、返报酬12、还本10并付利息1。</desc>
<rect width="360" height="1080" fill="white"/>
<g font-family="PingFang SC, Heiti SC, sans-serif" fill="#16202a">
<text x="22" y="35" font-size="23" font-weight="600">同一贷款的四个事件</text>
<text x="22" y="65" font-size="18" font-weight="600">箭头只表示时间顺序</text>
<text x="22" y="91" font-size="17">金额为教学单位；无手续费与税</text>
<rect x="14" y="115" width="332" height="169" rx="9" fill="#eaf2fa" stroke="#334452" stroke-width="1.4"/>
<text x="26" y="144" font-size="20" font-weight="600">1  A放贷20</text>
<text x="26" y="173" font-size="17">小陈：存款5变25，债务0变20</text>
<text x="26" y="201" font-size="17">A：贷款与存款负债各增加20</text>
<text x="26" y="229" font-size="17">A准备金仍30；B仍20</text>
<text x="26" y="257" font-size="17">借到钱，不等于净财富增加20</text>
<path d="M180 285 V298" stroke="#334452" stroke-width="2.5"/><path d="M175 295 L180 303 L185 295" fill="#334452"/>
<rect x="14" y="307" width="332" height="169" rx="9" fill="#f4f1e8" stroke="#334452" stroke-width="1.4"/>
<text x="26" y="336" font-size="20" font-weight="600">2  小陈跨行付商户20</text>
<text x="26" y="365" font-size="17">小陈：存款25变5，债务仍20</text>
<text x="26" y="393" font-size="17">商户在B存款10变30</text>
<text x="26" y="421" font-size="17">A准备金30变10，B20变40</text>
<text x="26" y="449" font-size="17">两行存款合计仍200</text>
<path d="M180 477 V490" stroke="#334452" stroke-width="2.5"/><path d="M175 487 L180 495 L185 487" fill="#334452"/>
<rect x="14" y="499" width="332" height="169" rx="9" fill="#eaf3ee" stroke="#334452" stroke-width="1.4"/>
<text x="26" y="528" font-size="20" font-weight="600">3  商户返劳动报酬12</text>
<text x="26" y="557" font-size="17">商户在B存款30变18</text>
<text x="26" y="585" font-size="17">小陈在A存款5变17</text>
<text x="26" y="613" font-size="17">B准备金40变28，A10变22</text>
<text x="26" y="641" font-size="17">这是另笔已发生的劳动报酬</text>
<path d="M180 669 V682" stroke="#334452" stroke-width="2.5"/><path d="M175 679 L180 687 L185 679" fill="#334452"/>
<rect x="14" y="691" width="332" height="169" rx="9" fill="#f0edf7" stroke="#334452" stroke-width="1.4"/>
<text x="26" y="720" font-size="20" font-weight="600">4  还本金10、利息1</text>
<text x="26" y="749" font-size="17">小陈：存款17变6，债务20变10</text>
<text x="26" y="777" font-size="17">A贷款90变80，存款102变91</text>
<text x="26" y="805" font-size="17">A权益10变11；利息计入收益</text>
<text x="26" y="833" font-size="17">A准备金22、B28均不变</text>
<text x="22" y="927" font-size="20" font-weight="600">三种对象分开看</text>
<text x="22" y="959" font-size="17">存款：小陈对银行的金融资产</text>
<text x="22" y="987" font-size="17">准备金：银行对央行的结算资产</text>
<text x="22" y="1015" font-size="17">债务：小陈对A的还款义务</text>
<text x="22" y="1052" font-size="16">银行逐行闭合与反例，见邻接账本</text>
</g>
</svg>
