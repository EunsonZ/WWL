<svg xmlns="http://www.w3.org/2000/svg" width="480" height="665" viewBox="0 0 480 665"><rect width="480" height="665" fill="#ffffff"/><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#304967"/></marker></defs><style>text{font-family:Arial,sans-serif;font-size:17px;fill:#182f48}.small{font-size:14px}.title{font-size:21px;font-weight:bold}.line{fill:none;stroke:#304967;stroke-width:2}.curve{fill:none;stroke:#006a91;stroke-width:3}.dash{stroke:#8799aa;stroke-dasharray:4 4;stroke-width:1}.box{fill:#f0f6fa;stroke:#304967;stroke-width:1.5}</style><text x="20" y="30" class="title">A value is a condition-bound statement</text><rect x="20" y="65" width="440" height="72" rx="8" class="box"/><text x="35" y="92" class="">1  Identity</text><text x="35" y="118" class="small">Manufacturer, full part, revision, package</text><line x1="240" y1="138" x2="240" y2="153" class="line" marker-end="url(#arrow)"/><rect x="20" y="157" width="440" height="72" rx="8" class="box"/><text x="35" y="184" class="">2  Stress boundary</text><text x="35" y="210" class="small">Absolute: damage limit; not normal bias</text><line x1="240" y1="230" x2="240" y2="245" class="line" marker-end="url(#arrow)"/><rect x="20" y="249" width="440" height="72" rx="8" class="box"/><text x="35" y="276" class="">3  Operating region</text><text x="35" y="302" class="small">Recommended table, or explicitly absent</text><line x1="240" y1="322" x2="240" y2="337" class="line" marker-end="url(#arrow)"/><rect x="20" y="341" width="440" height="72" rx="8" class="box"/><text x="35" y="368" class="">4  Characteristic</text><text x="35" y="394" class="small">min / typ / max / nominal; blank is unknown</text><line x1="240" y1="414" x2="240" y2="429" class="line" marker-end="url(#arrow)"/><rect x="20" y="433" width="440" height="72" rx="8" class="box"/><text x="35" y="460" class="">5  Test conditions</text><text x="35" y="486" class="small">Bias, T, pulse, f, circuit, endpoint</text><line x1="240" y1="506" x2="240" y2="521" class="line" marker-end="url(#arrow)"/><rect x="20" y="525" width="440" height="72" rx="8" class="box"/><text x="35" y="552" class="">6  Model and checks</text><text x="35" y="578" class="small">Assumptions, range, source; test extrapolation</text><text x="20" y="640" class="small">A test point cannot identify every model parameter</text></svg>