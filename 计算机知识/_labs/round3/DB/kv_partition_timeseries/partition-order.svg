<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640" role="img" aria-labelledby="title desc">
<title id="title">迟到进入旧桶，并列时间仍有独立身份</title>
<desc id="desc">S1九个接受变更分三日桶。R14晚于R08到达但事件时点更早，因此排在旧桶R08前。R12 R13时点相同，使用事件id打破并列。下表显示同一查询三个布局的逻辑成本，不是引擎时延。</desc>
<rect width="1100" height="640" fill="white"/><g font-family="PingFang SC,sans-serif" fill="#1c2d44">
<text x="40" y="43" font-size="25">事件时点决定桶与顺序，处理位置决定何时可见</text>
<text x="40" y="77" font-size="17">每行按(event_ms,event_id)排序；横向只表示顺序，不按时长比例绘制</text>
<text x="40" y="150" font-size="18">UTC日 0</text>
<rect x="195" y="125" width="190" height="65" rx="8" fill="#e9f1fb" stroke="#425b78"/><text x="207" y="150" font-size="18">R01 v1</text><text x="207" y="174" font-size="15">t=0 ms</text>
<rect x="405" y="125" width="190" height="65" rx="8" fill="#fff1d6" stroke="#425b78"/><text x="417" y="150" font-size="18">R14 v3</text><text x="417" y="174" font-size="15">t=50 ms</text>
<rect x="615" y="125" width="190" height="65" rx="8" fill="#e9f1fb" stroke="#425b78"/><text x="627" y="150" font-size="18">R08 v2</text><text x="627" y="174" font-size="15">t=100 ms</text>
<rect x="825" y="125" width="190" height="65" rx="8" fill="#e9f1fb" stroke="#425b78"/><text x="837" y="150" font-size="18">R02 v1</text><text x="837" y="174" font-size="15">t=86399999 ms</text>
<text x="40" y="250" font-size="18">UTC日 1</text>
<rect x="195" y="225" width="190" height="65" rx="8" fill="#e9f1fb" stroke="#425b78"/><text x="207" y="250" font-size="18">R12 删除</text><text x="207" y="274" font-size="15">t=86400000 ms</text>
<rect x="405" y="225" width="190" height="65" rx="8" fill="#e9f1fb" stroke="#425b78"/><text x="417" y="250" font-size="18">R13 v3</text><text x="417" y="274" font-size="15">t=86400000 ms</text>
<rect x="615" y="225" width="190" height="65" rx="8" fill="#e9f1fb" stroke="#425b78"/><text x="627" y="250" font-size="18">R15 删除</text><text x="627" y="274" font-size="15">t=86400001 ms</text>
<rect x="825" y="225" width="190" height="65" rx="8" fill="#e9f1fb" stroke="#425b78"/><text x="837" y="250" font-size="18">R17 v5</text><text x="837" y="274" font-size="15">t=86400002 ms</text>
<text x="40" y="350" font-size="18">UTC日 2</text>
<rect x="195" y="325" width="190" height="65" rx="8" fill="#e9f1fb" stroke="#425b78"/><text x="207" y="350" font-size="18">R18 v1</text><text x="207" y="374" font-size="15">t=172800001 ms</text>
<text x="40" y="455" font-size="19">S1全范围首分页(size=2)：相同答案，不同布局成本</text>
<text x="40" y="491" font-size="16">布局</text><text x="375" y="491" font-size="16">探测分区</text><text x="535" y="491" font-size="16">拷入候选行</text><text x="735" y="491" font-size="16">最大实际分区行数</text>
<text x="40" y="527" font-size="17">daily</text><text x="375" y="527" font-size="17">3</text><text x="535" y="527" font-size="17">7</text><text x="735" y="527" font-size="17">4</text>
<text x="40" y="561" font-size="17">half_day</text><text x="375" y="561" font-size="17">5</text><text x="535" y="561" font-size="17">8</text><text x="735" y="561" font-size="17">4</text>
<text x="40" y="595" font-size="17">daily_sharded</text><text x="375" y="595" font-size="17">6</text><text x="535" y="595" font-size="17">8</text><text x="735" y="595" font-size="17">4</text>
</g></svg>
