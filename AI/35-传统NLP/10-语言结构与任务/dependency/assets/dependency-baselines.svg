<title id="title">Conditional reference-word dependency baseline and document slices</title><desc id="desc">Fixed Swedish-Talbanken r2.16 short-word sentences, gold words and gold UPOS as declared inputs. Exact complete relation labels, real root included, reference punctuation excluded. Bars are descriptive proportions, not confidence intervals or human meaning. P301 contributes435 of548 scored test words. Data-derived adaptations CC BY-SA4.0; upstream attribution in dependency/data.</desc>
