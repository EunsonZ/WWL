<svg xmlns="http://www.w3.org/2000/svg" width="800" height="470" viewBox="0 0 800 470"><title>线性税楔：同一供需与税前税后均衡</title><desc>横轴Q件每月，纵轴P元每件。D=100-2P，S=20+2P。无税Q60P20；税后Q48，买26卖14。税收576元每月，损失72元每月。固定竞争局部模型。</desc><rect width="800" height="470" fill="#fcfcfa"/><g font-family="Hiragino Sans GB, Microsoft YaHei, Arial Unicode MS, sans-serif" font-size="16" fill="#253343"><text x="40" y="30" font-size="21">同一曲线上的从量税 t = 12 元/件</text><path d="M90 55V370H640" fill="none" stroke="#253343" stroke-width="2"/><text x="20" y="53">P 元/件</text><text x="540" y="405">Q 件/月</text><rect x="90" y="214" width="240" height="72" fill="#93c9d8" opacity="0.55"/><polygon points="330,214 330,286 390,250" fill="#ecad7c" opacity="0.75"/><path d="M90 70L590 370" stroke="#bd4760" stroke-width="3"/><path d="M190 370L590 130" stroke="#237e74" stroke-width="3"/><g stroke="#758694" stroke-dasharray="5 4" fill="none"><path d="M90 214H330V370M90 286H330M90 250H390V370"/></g><g fill="#253343"><circle cx="330" cy="214" r="4"/><circle cx="330" cy="286" r="4"/><circle cx="390" cy="250" r="4"/></g><text x="56" y="220">26</text><text x="56" y="256">20</text><text x="56" y="292">14</text><text x="80" y="392">0</text><text x="319" y="393">48</text><text x="379" y="393">60</text><text x="470" y="315" fill="#bd4760">需求 D</text><text x="505" y="162" fill="#237e74">供给 S</text><text x="112" y="244">税收矩形</text><text x="112" y="266">576 元/月</text><path d="M364 244L455 216" stroke="#ad662f"/><text x="462" y="213">损失 72 元/月</text><text x="401" y="260">无税交点</text><text x="40" y="441">解析坐标手绘图源；固定供需、竞争、无外部性；未运行图生成/数值实验</text></g></svg>