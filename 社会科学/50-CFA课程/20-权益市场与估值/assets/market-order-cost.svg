<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 470"><style>.title{font:700 29px -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif;fill:#152033}.head{font:700 20px -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif;fill:#152033}.body{font:16px -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif;fill:#243047}.small{font:14px -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif;fill:#3f4d63}.line{stroke:#52677f;stroke-width:2;fill:none}</style><rect width="100%" height="100%" fill="#ffffff"/><text x="38" y="50" class="title">同一买单：决定价格、报价、成交与成本必须分层</text><rect x="38" y="120" width="250" height="235" rx="15" fill="#eaf2fb" stroke="#49647d" stroke-width="2"/><text x="56" y="160" class="head">决策时点</text><text x="56" y="202" class="body">基准价 32.95/股</text><text x="56" y="238" class="body">买入 1,000 股</text><text x="56" y="274" class="body">基准名义 32,950</text><path d="M292 238 L308 238" class="line"/><path d="M302 232 L308 238 L302 244" class="line"/><rect x="312" y="120" width="250" height="235" rx="15" fill="#f6efe5" stroke="#49647d" stroke-width="2"/><text x="330" y="160" class="head">盘口报价</text><text x="330" y="202" class="body">bid 32.90</text><text x="330" y="238" class="body">ask 33.10</text><text x="330" y="274" class="body">中点 33.00</text><path d="M566 238 L582 238" class="line"/><path d="M576 232 L582 238 L576 244" class="line"/><rect x="586" y="120" width="250" height="235" rx="15" fill="#e7f4ec" stroke="#49647d" stroke-width="2"/><text x="604" y="160" class="head">实际成交</text><text x="604" y="202" class="body">市场买单 33.10</text><text x="604" y="238" class="body">佣金 20</text><text x="604" y="274" class="body">现金流出 33120</text><path d="M840 238 L856 238" class="line"/><path d="M850 232 L856 238 L850 244" class="line"/><rect x="860" y="120" width="250" height="235" rx="15" fill="#f4ebf7" stroke="#49647d" stroke-width="2"/><text x="878" y="160" class="head">成本解释</text><text x="878" y="202" class="body">相对中点 120</text><text x="878" y="238" class="body">决策短缺 170</text><text x="878" y="274" class="body">约 51.6 bp</text><text x="38" y="420" class="small">市场单重成交、不锁价格；限价单锁最差价格、不保证成交。成本不等于发行人的价值变化。</text></svg>
