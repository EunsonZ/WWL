<svg xmlns="http://www.w3.org/2000/svg" width="360" height="478" viewBox="0 0 360 478"><title>Capacitor in parallel with voltage source and consistency condition</title><rect width="360" height="478" fill="#fff"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#17324d"/></marker></defs><g font-family="Arial, sans-serif"><text xml:space="preserve" x="14" y="26" font-size="16" fill="#17324d">M07-02/03  source constraint</text><path d="M95 80 L265 80" stroke="#17324d" stroke-width="2" fill="none"/><path d="M95 80 L95 120" stroke="#17324d" stroke-width="2" fill="none"/><path d="M95 160 L95 205" stroke="#17324d" stroke-width="2" fill="none"/><path d="M95 205 L265 205" stroke="#17324d" stroke-width="2" fill="none"/><path d="M70 120 L120 120" stroke="#17324d" stroke-width="2" fill="none"/><path d="M70 135 L120 135" stroke="#17324d" stroke-width="2" fill="none"/><path d="M95 135 L95 160" stroke="#17324d" stroke-width="2" fill="none"/><path d="M265 80 L265 114" stroke="#17324d" stroke-width="2" fill="none"/><path d="M265 164 L265 205" stroke="#17324d" stroke-width="2" fill="none"/><circle cx="265" cy="139" r="25" fill="none" stroke="#17324d" stroke-width="2"/><text xml:space="preserve" x="258" y="132" font-size="14" fill="#17324d">+</text><text xml:space="preserve" x="258" y="155" font-size="14" fill="#17324d">−</text><circle cx="175" cy="80" r="4" fill="#17324d"/><text xml:space="preserve" x="182" y="73" font-size="14" fill="#17324d">v</text><circle cx="175" cy="205" r="4" fill="#17324d"/><text xml:space="preserve" x="182" y="198" font-size="14" fill="#17324d">0</text><text xml:space="preserve" x="20" y="150" font-size="14" fill="#17324d">C</text><text xml:space="preserve" x="298" y="144" font-size="14" fill="#17324d">Vs</text><path d="M285 85 L285 109" stroke="#17324d" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text xml:space="preserve" x="300" y="103" font-size="14" fill="#17324d">j</text><text xml:space="preserve" x="20" y="245" font-size="16" fill="#17324d">C dv/dt + j = 0  [A]</text><text xml:space="preserve" x="20" y="276" font-size="16" fill="#17324d">v − Vs = 0  [V]</text><text xml:space="preserve" x="20" y="320" font-size="15" fill="#17324d">Vs = 1 + 1000t V;  C = 1 µF</text><text xml:space="preserve" x="20" y="353" font-size="16" fill="#17324d">consistent: v0 = 1 V</text><text xml:space="preserve" x="20" y="385" font-size="16" fill="#17324d">then j = −1 mA</text><text xml:space="preserve" x="20" y="427" font-size="16" fill="#b13b36">v0 = 0 + finite current:</text><text xml:space="preserve" x="20" y="452" font-size="14" fill="#b13b36">incompatible with source constraint</text></g></svg>
