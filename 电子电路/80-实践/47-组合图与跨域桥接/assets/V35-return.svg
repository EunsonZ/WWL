<svg xmlns="http://www.w3.org/2000/svg" width="425" height="795" viewBox="0 0 425 795"><rect width="425" height="795" fill="white"/><style>text{font:16px sans-serif;fill:#18232c}.title{font-weight:bold}.small{font-size:14px}.wire{stroke:#18232c;stroke-width:2;fill:none}.box{fill:#f2f5f7;stroke:#18232c;stroke-width:1.5}</style><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#18232c"/></marker></defs><text x="16" y="28" class="title">V35: layer, reference and local loop</text><text x="16" y="57" class="">Top view: signal above reference plane</text><rect class="box" x="16" y="75" width="393" height="83"/><path class="wire" d="M40 101L380 101" marker-end="url(#a)"/><path class="wire" d="M380 131L40 131" marker-end="url(#a)"/><text x="45" y="94" class="">signal</text><text x="110" y="150" class="">distributed return, continuous plane</text><rect class="box" x="16" y="184" width="393" height="119"/><rect x="201" y="184" width="24" height="78" fill="white" stroke="#18232c"/><path class="wire" d="M40 203L380 203" marker-end="url(#a)"/><path class="wire" d="M380 231H255V278H171V231H40" marker-end="url(#a)"/><text x="30" y="296" class="">Slot -&gt; return detour; not a universal split rule</text><text x="16" y="333" class="">Section: isolated signal via / GND stitch</text><path class="wire" d="M25 370L280 370"/><text x="25" y="355" class="">F.Cu SIGNAL</text><path class="wire" d="M330 370L399 370"/><text x="325" y="355" class="">GND</text><path class="wire" d="M25 440L243 440"/><path class="wire" d="M279 440L399 440"/><path class="wire" d="M250 440L272 440"/><path class="wire" d="M261 370L261 440"/><path class="wire" d="M355 370L355 440"/><text x="25" y="397" class="">1.6 mm dielectric</text><text x="25" y="426" class="">B.Cu GND</text><text x="16" y="467" class="">Signal via -&gt; SAME signal isolated pad</text><text x="16" y="491" class="">Gap at plane = antipad / copper clearance</text><text x="16" y="515" class="">GND stitch connects GND patch to plane</text><text x="16" y="539" class="">Different reference nets need another path</text><rect class="box" x="16" y="560" width="393" height="54"/><text x="26" y="583" class="">Local power -&gt; LOAD -&gt; GND -&gt; C -&gt; power</text><text x="26" y="607" class="">Fast di/dt closes locally; remote source is slower</text><text x="16" y="640" class="">5 mA / 5 ns: 2 nH -&gt; 2 mV</text><text x="16" y="667" class="">detour 20 nH -&gt; 20 mV (assumed L)</text><text x="16" y="694" class="">100 nF + .05 ohm + 2 nH: |Z|1.242 ohm</text><text x="16" y="721" class="">at 100 MHz; resonance 11.254 MHz</text><text x="16" y="748" class="">Swap reference: analyze plane connection / C</text><text x="16" y="772" class="small">No fill, EM extraction, board or TDR result</text></svg>
