<text x="131.0" y="238" font-size="18">1</text>
<text x="265" y="126" font-size="20">True Y: p=1/2</text>
<rect x="265" y="148" width="64" height="64" fill="rgb(255,255,255)" stroke="#607080" stroke-width="2"/>
<text x="287.0" y="238" font-size="18">1</text>
<rect x="329" y="148" width="64" height="64" fill="rgb(0,0,0)" stroke="#607080" stroke-width="2"/>
<text x="351.0" y="238" font-size="18">0</text>
<text x="485" y="126" font-size="20">Observed X = mean(Y)</text>
<rect x="548" y="148" width="64" height="64" fill="rgb(128,128,128)" stroke="#607080" stroke-width="2"/>
<text x="570.0" y="238" font-size="18">1/2</text>
<text x="492" y="267" font-size="18">One SCALAR reading</text>
<text x="795" y="126" font-size="20">Conditional mean m(X)</text>
<rect x="830" y="148" width="64" height="64" fill="rgb(128,128,128)" stroke="#607080" stroke-width="2"/>
<text x="852.0" y="238" font-size="18">1/2</text>
<rect x="894" y="148" width="64" height="64" fill="rgb(128,128,128)" stroke="#607080" stroke-width="2"/>
<text x="916.0" y="238" font-size="18">1/2</text>
<text x="795" y="267" font-size="18">Expected MSE=1/4</text>
