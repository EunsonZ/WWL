<svg xmlns="http://www.w3.org/2000/svg" width="425" height="540" viewBox="0 0 425 540" role="img" aria-labelledby="t d"><title id="t">张量A的完整三乘五存储</title><desc id="d">完整三行五列、0起始行主序的张量A，格中为0到14。高亮A[2,3]，即第三行第四列、线性索引13；B[3,2]共享它，块宽8时责任为block1 thread5。</desc><rect width="425" height="540" fill="#fbfcfe"/><style>text{font-family:'Arial Unicode MS','Hiragino Sans GB','PingFang SC',Arial,sans-serif;font-size:16px;fill:#17232e}.h{font-size:18px;font-weight:bold}.c{fill:#e7eef7;stroke:#52799f;stroke-width:1.4}.x{fill:#f8d487;stroke:#a66513;stroke-width:2.4}</style><text class="h" x="16" y="25">A：3×5，stride=(5,1)，FP32</text><text x="16" y="54">行 i / 列 j</text><g transform="translate(92 70)"><text x="7" y="-11">0</text><text x="67" y="-11">1</text><text x="127" y="-11">2</text><text x="187" y="-11">3</text><text x="247" y="-11">4</text><text x="-28" y="29">0</text><text x="-28" y="85">1</text><text x="-28" y="141">2</text><g class="c"><rect width="54" height="46"/><rect x="60" width="54" height="46"/><rect x="120" width="54" height="46"/><rect x="180" width="54" height="46"/><rect x="240" width="54" height="46"/><rect y="56" width="54" height="46"/><rect x="60" y="56" width="54" height="46"/><rect x="120" y="56" width="54" height="46"/><rect x="180" y="56" width="54" height="46"/><rect x="240" y="56" width="54" height="46"/><rect y="112" width="54" height="46"/><rect x="60" y="112" width="54" height="46"/><rect x="120" y="112" width="54" height="46"/><rect class="x" x="180" y="112" width="54" height="46"/><rect x="240" y="112" width="54" height="46"/></g><g text-anchor="middle"><text x="27" y="29">0</text><text x="87" y="29">1</text><text x="147" y="29">2</text><text x="207" y="29">3</text><text x="267" y="29">4</text><text x="27" y="85">5</text><text x="87" y="85">6</text><text x="147" y="85">7</text><text x="207" y="85">8</text><text x="267" y="85">9</text><text x="27" y="141">10</text><text x="87" y="141">11</text><text x="147" y="141">12</text><text x="207" y="141">13</text><text x="267" y="141">14</text></g></g><text class="h" x="16" y="255">A[2,3]=1.5：k=13（第14格）</text><text x="16" y="282">binary32 位模式：0x3FC00000</text><text x="16" y="309">相对字节偏移：13×4=52 字节</text><rect x="16" y="334" width="393" height="78" rx="8" fill="#f3f7fb" stroke="#9eb4c7"/><text x="30" y="363">转置 view：B=A.T，shape=(5,3)</text><text x="30" y="390">stride=(1,5)，B[3,2] 仍共享 k=13。</text><rect x="16" y="429" width="393" height="88" rx="8" fill="#f3f7fb" stroke="#9eb4c7"/><text x="30" y="458">教学责任：块宽8，k=13 → block 1，thread 5。</text><text x="30" y="487">k=15 的输出屏蔽；合作加载另看自己的条件。</text></svg>
