<svg xmlns="http://www.w3.org/2000/svg" width="425" height="625" viewBox="0 0 425 625"><title>Symbol footprint and connector mapping</title><desc>Numbered capacitor symbol to pad1OUT pad2GND and J2 explicit VDD/OUT/GND. Land geometry teaching only;actualMPN/ratings/part polarity not qualified.</desc><rect width="425" height="625" fill="white"/><g stroke="#111" stroke-width="2" fill="none"><text x="15" y="25" font-size="17">Number is the bridge between three views</text><rect x="25" y="90" width="125" height="70" fill="white"/><text x="30" y="130.0" font-size="15">C1 symbol</text><text x="25" y="182" font-size="15">1=OUT; 2=GND</text><line x1="150" y1="125" x2="240" y2="125"/><rect x="240" y="85" width="155" height="80" fill="white"/><text x="245" y="130.0" font-size="15">0805 pads</text><rect x="250" y="178" width="42" height="42" fill="white"/><text x="255" y="204.0" font-size="15">1</text><rect x="340" y="178" width="42" height="42" fill="white"/><text x="345" y="204.0" font-size="15">2</text><line x1="270" y1="166" x2="270" y2="178"/><line x1="360" y1="166" x2="360" y2="178"/><text x="15" y="264" font-size="15">Candidate pads1.2 x1.4mm; pitch1.9mm</text><text x="15" y="297" font-size="15">Actual MPN drawing not selected/checked</text><text x="15" y="355" font-size="17">J2 front top view: fixed pin numbering</text><rect x="40" y="400" width="28" height="28" fill="white"/><text x="45" y="419.0" font-size="15">1</text><text x="95" y="422" font-size="15">1 VDD</text><rect x="40" y="445" width="28" height="28" fill="white"/><text x="45" y="464.0" font-size="15">2</text><text x="95" y="467" font-size="15">2 OUT</text><rect x="40" y="490" width="28" height="28" fill="white"/><text x="45" y="509.0" font-size="15">3</text><text x="95" y="512" font-size="15">3 GND</text><text x="15" y="565" font-size="15">Bottom view mirrors position, not pin IDs</text><text x="15" y="600" font-size="15">Nonpolar ceramic C: replacement still qualified</text></g><style>text{fill:#111;stroke:none;font-family:DejaVu Sans,sans-serif}</style></svg>