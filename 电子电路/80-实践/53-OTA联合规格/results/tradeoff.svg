<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="845" viewBox="0 0 1200 845"><title>两环补偿与非线性步进的代价</title><desc>同一11MOS及显式输入RC/跨节点补偿的有限教学模型；数据从固定spec/results读取，不是工艺或硅测量。</desc><rect width="100%" height="100%" fill="#f8fafc"/><g font-family="PingFang SC,sans-serif"><text x="35" y="40" font-size="26" fill="#24364b" text-anchor="start">同Q点的一次补偿，改善了哪条环路？</text><text x="35" y="73" font-size="17" fill="#24364b" text-anchor="start">噪声积分1 Hz…100 kHz；单边PSD；输出RMS和逐频输入等效RMS分列</text><text x="35" y="118" font-size="16" fill="#24364b" text-anchor="start">设计</text><text x="200" y="118" font-size="16" fill="#24364b" text-anchor="start">Co pF</text><text x="305" y="118" font-size="16" fill="#24364b" text-anchor="start">Cc nF</text><text x="430" y="118" font-size="16" fill="#24364b" text-anchor="start">DM PM°</text><text x="555" y="118" font-size="16" fill="#24364b" text-anchor="start">CM PM°</text><text x="690" y="118" font-size="16" fill="#24364b" text-anchor="start">DM µV</text><text x="825" y="118" font-size="16" fill="#24364b" text-anchor="start">CM µV</text><text x="990" y="118" font-size="16" fill="#24364b" text-anchor="start">输入等效 µV</text><text x="35" y="165" font-size="17" fill="#913c33" text-anchor="start">starting</text><text x="200" y="165" font-size="17" fill="#913c33" text-anchor="start">20</text><text x="305" y="165" font-size="17" fill="#913c33" text-anchor="start">10</text><text x="430" y="165" font-size="17" fill="#913c33" text-anchor="start">47.98</text><text x="555" y="165" font-size="17" fill="#913c33" text-anchor="start">73.79</text><text x="690" y="165" font-size="17" fill="#913c33" text-anchor="start">120.78</text><text x="825" y="165" font-size="17" fill="#913c33" text-anchor="start">144.58</text><text x="990" y="165" font-size="17" fill="#913c33" text-anchor="start">21.01</text><text x="35" y="213" font-size="17" fill="#913c33" text-anchor="start">dm_only</text><text x="200" y="213" font-size="17" fill="#913c33" text-anchor="start">100</text><tex