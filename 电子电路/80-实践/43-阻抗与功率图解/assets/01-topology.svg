<svg xmlns="http://www.w3.org/2000/svg" width="680" height="705" viewBox="0 0 680 705"><rect width="680" height="100%" fill="white"/><defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#222"/></marker></defs><g font-family="sans-serif" fill="#111"><text x="30" y="40" font-size="24" text-anchor="start">Which nodes carry the same series current?</text><text x="30" y="80" font-size="24" text-anchor="start">Fixed RLC: 10 V RMS; omega = 1000 rad/s</text><line x1="130" y1="160" x2="210" y2="160" stroke="#222" stroke-width="3" stroke-dasharray=""/><line x1="290" y1="160" x2="340" y2="160" stroke="#222" stroke-width="3" stroke-dasharray=""/><line x1="420" y1="160" x2="490" y2="160" stroke="#222" stroke-width="3" stroke-dasharray=""/><line x1="510" y1="160" x2="580" y2="160" stroke="#222" stroke-width="3" stroke-dasharray=""/><line x1="580" y1="160" x2="580" y2="400" stroke="#222" stroke-width="3" stroke-dasharray=""/><line x1="580" y1="400" x2="130" y2="400" stroke="#222" stroke-width="3" stroke-dasharray=""/><line x1="130" y1="400" x2="130" y2="330" stroke="#222" stroke-width="3" stroke-dasharray=""/><line x1="130" y1="230" x2="130" y2="160" stroke="#222" stroke-width="3" stroke-dasharray=""/><circle cx="130" cy="280" r="50" fill="none" stroke="#222" stroke-width="3"/><text x="130" y="260" font-size="24" text-anchor="middle">+</text><text x="130" y="310" font-size="24" text-anchor="middle">-</text><rect x="210" y="140" width="80" height="40" fill="none" stroke="#222" stroke-width="3"/><path d="M340 160 Q350 125 360 160 Q370 125 380 160 Q390 125 400 160 Q410 125 420 160" fill="none" stroke="#222" stroke-width="3"/><line x1="490" y1="135" x2="490" y2="185" stroke="#222" stroke-width="3" stroke-dasharray=""/><line x1="510" y1="135" x2="510" y2="185" stroke="#222" stroke-width="3" stroke-dasharray=""/><text x="180" y="235" font-size="24" text-anchor="start">R=10 ohm</text><text x="340" y="270" font-size="24" text-anchor="start">L=10 mH</text><text x="445" y="320" font-size="24" text-anchor="start">C=200 uF</text><line x1="190" y1="115" x2="290" y2="115" stroke="#222" stroke-width="3" stroke-dasharray="" marker-end="url(#tip)"/><text x="315" y="120" font-size="24" text-anchor="start">i(t) -&gt;</text><text x="95" y="155" font-size="24" text-anchor="start">n1</text><text x="305" y="200" font-size="24" text-anchor="start">n2</text><text x="440" y="200" font-size="24" text-anchor="start">n3</text><text x="90" y="415" font-size="24" text-anchor="start">0</text><text x="30" y="480" font-size="24" text-anchor="start">vR = v(n1)-v(n2); vL = v(n2)-v(n3)</text><text x="30" y="525" font-size="24" text-anchor="start">vC = v(n3)-v(0); v = v(n1)-v(0)</text><text x="30" y="570" font-size="24" text-anchor="start">Current enters each positive voltage terminal.</text><text x="30" y="615" font-size="24" text-anchor="start">KVL: vR + vL + vC = v. Same rule in RMS.</text><text x="30" y="660" font-size="24" text-anchor="start">Ideal steady-state model, no physical assembly.</text><circle cx="130" cy="160" r="4" fill="#222"/><circle cx="320" cy="160" r="4" fill="#222"/><circle cx="440" cy="160" r="4" fill="#222"/><circle cx="130" cy="400" r="4" fill="#222"/></g></svg>