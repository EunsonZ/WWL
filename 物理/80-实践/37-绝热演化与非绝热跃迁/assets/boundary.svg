<svg xmlns="http://www.w3.org/2000/svg" width="850" height="725" viewBox="0 0 850 725" role="img"><title>Finite endpoints and numerical convergence</title><desc>Both panels use boundary.csv; endpoint difference and step-size error are separately labelled.</desc><rect width="100%" height="100%" fill="white"/><g font-family="sans-serif"><text x="80" y="28" font-size="18" fill="#19232c" text-anchor="start">Extend endpoints at fixed Delta and v: not a slower fixed path</text><path d="M80,90 V290 H770" fill="none" stroke="#68727b"/><text x="80.0" y="312" font-size="12" fill="#19232c" text-anchor="middle">2</text><text x="72" y="294.0" font-size="12" fill="#19232c" text-anchor="end">0</text><text x="252.5" y="312" font-size="12" fill="#19232c" text-anchor="middle">5.5</text><text x="72" y="244.0" font-size="12" fill="#19232c" text-anchor="end">0.000566</text><text x="425.0" y="312" font-size="12" fill="#19232c" text-anchor="middle">9</text><text x="72" y="194.0" font-size="12" fill="#19232c" text-anchor="end">0.00113</text><text x="597.5" y="312" font-size="12" fill="#19232c" text-anchor="middle">12.5</text><text x="72" y="144.0" font-size="12" fill="#19232c" text-anchor="end">0.0017</text><text x="770.0" y="312" font-size="12" fill="#19232c" text-anchor="middle">16</text><text x="72" y="94.0" font-size="12" fill="#19232c" text-anchor="end">0.00226</text><text x="425.0" y="339" font-size="13" fill="#19232c" text-anchor="middle">endpoint x = vT / Delta</text><text x="80" y="77" font-size="14" fill="#19232c" text-anchor="start">Final excited probability</text><polyline points="80.0000,221.7223 178.5714,137.2837 375.7143,123.3333 770.0000,125.4268" fill="none" stroke="#235d9c" stroke-width="2"/><polyline points="80.0000,124.9657 770.0000,124.9657" fill="none" stroke="#b44534" stroke-width="2" stroke-dasharray="6 4"/><circle cx="80.0" cy="221.72229541179175" r="4" fill="#235d9c"/><circle cx="178.57142857142856" cy="137.283710218478" r="4" fill="#235d9c"/><circle cx="375.7142857142857" cy="123.33333333333331" r="4" fill="#235d9c"/><circle cx="770.0" cy="125.42679464808069" r="4" fill="#235d9c"/><path d="M80,400 V580 H770" fill="none" stroke="#68727b"/><text x="80.0" y="602" font-size="12" fill="#19232c" text-anchor="middle">2</text><text x="72" y="584.0" font-size="12" fill="#19232c" text-anchor="end">-15</text><text x="252.5" y="602" font-size="12" fill="#19232c" text-anchor="middle">5.5</text><text x="72" y="539.0" font-size="12" fill="#19232c" text-anchor="end">-11.5</text><text x="425.0" y="602" font-size="12" fill="#19232c" text-anchor="middle">9</text><text x="72" y="494.0" font-size="12" fill="#19232c" text-anchor="end">-8</text><text x="597.5" y="602" font-size="12" fill="#19232c" text-anchor="middle">12.5</text><text x="72" y="449.0" font-size="12" fill="#19232c" text-anchor="end">-4.5</text><text x="770.0" y="602" font-size="12" fill="#19232c" text-anchor="middle">16</text><text x="72" y="404.0" font-size="12" fill="#19232c" text-anchor="end">-1</text><text x="425.0" y="629" font-size="13" fill="#19232c" text-anchor="middle">endpoint x = vT / Delta</text><text x="80" y="387" font-size="14" fill="#19232c" text-anchor="start">log10 absolute probability difference</text><polyline points="80.0000,425.2083 178.5714,436.7172 375.7143,448.0023 770.0000,455.0609" fill="none" stroke="#b44534" stroke-width="2"/><polyline points="80.0000,565.0773 178.5714,547.1838 375.7143,538.0261 770.0000,549.3903" fill="none" stroke="#267755" stroke-width="2"/><text x="80" y="665" font-size="13" fill="#19232c" text-anchor="start">blue above: finite endpoint; dashed red above: infinite-time LZ</text><text x="80" y="693" font-size="13" fill="#19232c" text-anchor="start">below red: finite-minus-LZ; green: half/fine grid error (separate quantities)</text></g></svg>
