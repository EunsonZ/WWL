<svg xmlns="http://www.w3.org/2000/svg" width="840" height="460" viewBox="0 0 840 460" role="img" aria-labelledby="title desc">
<title id="title">Coordinate error for fixed right-image perturbation and changed baseline</title>
<desc id="desc">Four point IDs match the epipolar diagram. Horizontal axis known camera-center distance in metres; vertical axis Euclidean reconstruction error in metres. Discrete cases only; segments connect sampled inputs and are not a universal law. Right pixel perturbation is [0.5, -0.25] pixels.</desc>
<rect width="840" height="460" fill="white"/><g font-family="sans-serif" font-size="16" fill="#172638">
<text x="25" y="28">Fixed right-pixel error [0.5, -0.25] px; same rotation, scaled camera center</text>
<path d="M150,100 V350 H700" fill="none" stroke="#536478"/><text x="35" y="105">error (m)</text>
<text x="55" y="125">0.776877</text><text x="125" y="355">0</text>
<text x="140" y="380">0</text><text x="625" y="380">0.201246</text>
<g fill="#176a9b" stroke="#176a9b"><polyline points="650.00000,346.55946 400.00000,343.14359 200.00000,315.06370" fill="none" stroke-width="2"/><circle cx="650.00000" cy="346.55946" r="4"/><circle cx="400.00000" cy="343.14359" r="4"/><circle cx="200.00000" cy="315.06370" r="4"/><text x="80" y="70" stroke="none">P0</text></g><g fill="#b04e19" stroke="#b04e19"><polyline points="650.00000,347.95965 400.00000,345.93125 200.00000,329.32790" fill="none" stroke-width="2"/><circle cx="650.00000" cy="347.95965" r="4"/><circle cx="400.00000" cy="345.93125" r="4"/><circle cx="200.00000" cy="329.32790" r="4"/><text x="255" y="70" stroke="none">P1</text></g><g fill="#6e5494" stroke="#6e5494"><polyline points="650.00000,342.35561 400.00000,334.74760 200.00000,271.52128" fill="none" stroke-width="2"/><circle cx="650.00000" cy="342.35561" r="4"/><circle cx="400.00000" cy="334.74760" r="4"/><circle cx="200.00000" cy="271.52128" r="4"/><text x="430" y="70" stroke="none">P2</text></g><g fill="#267242" stroke="#267242"><polyline points="650.00000,328.32893 400.00000,306.42534 200.00000,120.00000" fill="none" stroke-width="2"/><circle cx="650.00000" cy="328.32893" r="4"/><circle cx="400.00000" cy="306.42534" r="4"/><circle cx="200.00000" cy="120.00000" r="4"/><text x="605" y="70" stroke="none">P3</text></g><text x="300" y="415">known baseline norm (m)</text><text x="85" y="445">Segments join finite test cases; no general error bound is asserted.</text></g></svg>
