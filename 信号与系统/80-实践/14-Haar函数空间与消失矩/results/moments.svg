<text x="540" y="221" font-size="16" fill="#172433" text-anchor="start">-2.4980018e-16</text>
<text x="760" y="221" font-size="16" fill="#172433" text-anchor="start">-1.2247449</text>
<text x="80" y="251" font-size="16" fill="#172433" text-anchor="start">sparse_qmf</text>
<text x="320" y="251" font-size="16" fill="#172433" text-anchor="start">0</text>
<text x="540" y="251" font-size="16" fill="#172433" text-anchor="start">-2.1213203</text>
<text x="760" y="251" font-size="16" fill="#172433" text-anchor="start">-6.363961</text>
<text x="80" y="290" font-size="15" fill="#172433" text-anchor="start">db2 h = 0.482963, 0.836516, 0.224144, -0.129410</text>
<text x="80" y="342" font-size="20" fill="#172433" text-anchor="start">B  同一有限斜坡：完整零延拓输出（包括两端）</text>
