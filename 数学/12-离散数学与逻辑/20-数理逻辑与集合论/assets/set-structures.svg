<text x="980" y="235">Keep e1: 19 independent</text><text x="980" y="275">12 maximal bases keep e1</text>
<text x="980" y="335">Choice family: 27 partial functions</text><text x="980" y="375">8 maximal; no maximum</text><text x="980" y="415">Chain union preserves compatibility.</text>
