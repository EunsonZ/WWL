<svg xmlns="http://www.w3.org/2000/svg" width="720" height="500" viewBox="0 0 720 500"><defs><marker id="arr" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="#222"/></marker></defs><rect width="100%" height="100%" fill="white"/><g stroke="#222" stroke-width="2.5" fill="none"><text x="20" y="30" font-family="Arial,sans-serif" font-size="24" fill="#111" stroke="none">Two-node common-source small-signal model</text><text x="15" y="117" font-family="Arial,sans-serif" font-size="22" fill="#111" stroke="none">iin</text><path d="M20 140 L150 140" marker-end="url(#arr)"/><circle cx="150" cy="140" r="4" fill="#222"/><text x="130" y="123" font-family="Arial,sans-serif" font-size="22" fill="#111" stroke="none">v1</text><path d="M150 140 L150 60"/><path d="M150 60 L270 60"/><path d="M270 60 L292 60"/><path d="M292 47 L292 73"/><path d="M300 47 L300 73"/><path d="M300 60 L322 60"/><path d="M322 60 L540 60"/><path d="M540 60 L540 140"/><circle cx="540" cy="140" r="4" fill="#222"/><text x="545" y="123" font-family="Arial,sans-serif" font-size="22" fill="#111" stroke="none">v2</text><text x="260" y="94" font-family="Arial,sans-serif" font-size="22" fill="#111" stroke="none">Cgd</text><path d="M150 140 L150 235"/><path d="M150 235 L160 235"/><rect x="160" y="227" width="70" height="16"/><path d="M230 235 L240 235"/><path d="M240 235 L280 235"/><path d="M280 235 L280 247"/><path d="M268 247 L292 247"/><path d="M272 253 L288 253"/><path d="M276 259 L284 259"/><text x="177" y="221" font-family="Arial,sans-serif" font-size="22" fill="#111" stroke="none">G1</text><path d="M150 235 L150 300"/><path d="M150 300 L172 300"/><path d="M172 287 L172 313"/><path d="M180 287 L180 313"/><path d="M180 300 L202 300"/><path d="M202 300 L280 300"/><path d="M280 300 L280 235"/><text x="173" y="339" font-family="Arial,sans-serif" font-size="22" fill="#111" stroke="none">C1</text><path d="M540 140 L540 235"/><path d="M540 235 L550 235"/><rect x="550" y="227" width="70" height="16"/><path d="M620 235 L630 235"/><path d="M630 235 L675 235"/><path d="M675 235 L675 247"/><path d="M663 247 L687 247"/><path d="M667 253 L683 253"/><path d="M671 259 L679 259"/><text x="567" y="221" font-family="Arial,sans-serif" font-size="22" fill="#111" stroke="none">G2</text><path d="M540 235 L540 300"/><path d="M540 300 L562 300"/><path d="M562 287 L562 313"/><path d="M570 287 L570 313"/><path d="M570 300 L592 300"/><path d="M592 300 L675 300"/><path d="M675 300 L675 235"/><text x="560" y="339" font-family="Arial,sans-serif" font-size="22" fill="#111" stroke="none">C2</text><path d="M540 140 L410 140"/><path d="M410 140 L410 187"/><path d="M410 187 L434 215 L410 243 L386 215 Z"/><path d="M410 243 L410 278"/><path d="M410 278 L410 290"/><path d="M398 290 L422 290"/><path d="M402 296 L418 296"/><path d="M406 302 L414 302"/><path d="M410 201 L410 228" marker-end="url(#arr)"/><text x="295" y="368" font-family="Arial,sans-serif" font-size="22" fill="#111" stroke="none">gm v1 flows from v2 to 0</text><text x="20" y="423" font-family="Arial,sans-serif" font-size="23" fill="#111" stroke="none">v2/v1 = -(gm-s Cgd)/(G2+s(C2+Cgd))</text><text x="20" y="468" font-family="Arial,sans-serif" font-size="23" fill="#111" stroke="none">RHP zero: s = +gm/Cgd [rad/s]</text></g></svg>