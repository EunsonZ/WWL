<svg xmlns="http://www.w3.org/2000/svg" width="940" height="430" viewBox="0 0 940 430">
<title>Finite pulse: which source events can reach the observer?</title><desc>空间切线的源区宽度放大。源活跃0至20 ns，观察点30 m；允许到达窗口100.065893至120.072564 ns。示意线的角度不用于测光速。</desc>
<rect width="100%" height="100%" fill="#fcfcfa"/>
<g font-family="sans-serif" font-size="15" fill="#152b3b">
<text x="35" y="30" font-size="21">Finite pulse: which source events can reach the observer?</text>
<line x1="110" y1="355" x2="850" y2="355" stroke="#687987" />
<line x1="110" y1="355" x2="110" y2="65" stroke="#687987" />
<text x="65" y="62" font-size="15">t (ns)</text>
<text x="777" y="402" font-size="15">x (m)</text>
<text x="192" y="382" font-size="15">center 0</text>
<text x="730" y="382" font-size="15">observer 30</text>
<rect x="190" y="311" width="50" height="44" fill="#d9edf3" stroke="#006b8f"/>
<text x="350" y="330" font-size="15">Source active only during 0–20 ns</text>
<text x="125" y="240" font-size="15">−a to +a (width enlarged)</text>
<line x1="190" y1="355.0" x2="750" y2="134.84035875912528" stroke="#006b8f" />
<line x1="240" y1="355.0" x2="750" y2="134.855035579314" stroke="#006b8f" />
<line x1="190" y1="311.0" x2="750" y2="90.84035875912525" stroke="#006b8f" />
<line x1="240" y1="311.0" x2="750" y2="90.855035579314" stroke="#006b8f" />
<line x1="750" y1="134.855035579314" x2="750" y2="90.84035875912525" stroke="#a54b00" stroke-width="6"/>
<text x="375" y="71" font-size="15">Arrival window: [100.065893, 120.072564] ns</text>
<text x="385" y="102" font-size="15">Edge lines: nearest / farthest source events</text>
<text x="325" y="405" font-size="15">Inside the window, cancellation can still yield zero.</text>
<text x="65" y="360.0" font-size="15">0</text>
<line x1="105" y1="355.0" x2="115" y2="355.0" stroke="#687987" />
<text x="65" y="316.0" font-size="15">20</text>
<line x1="105" y1="311.0" x2="115" y2="311.0" stroke="#687987" />
<text x="65" y="139.99999999999997" font-size="15">100</text>
<line x1="105" y1="134.99999999999997" x2="115" y2="134.99999999999997" stroke="#687987" />
<text x="65" y="96.0" font-size="15">120</text>
<line x1="105" y1="91.0" x2="115" y2="91.0" stroke="#687987" />
</g></svg>
