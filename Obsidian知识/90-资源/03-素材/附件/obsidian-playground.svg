<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="title desc">
  <title id="title">Obsidian 本地学习路径</title>
  <desc id="desc">从开始到练习、连接和回顾的简单学习路径图</desc>
  <rect width="900" height="360" rx="24" fill="#171522"/>
  <text x="52" y="58" fill="#f4f0ff" font-family="sans-serif" font-size="28" font-weight="700">本地学习路径</text>
  <text x="53" y="88" fill="#b9b2ce" font-family="sans-serif" font-size="15">在自己的笔记库里，边试边连，慢慢形成网络</text>
  <g stroke="#9b8afb" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M210 188H285"/><path d="M420 188H495"/><path d="M630 188H705"/>
    <path d="M276 179l12 9-12 9M486 179l12 9-12 9M696 179l12 9-12 9"/>
  </g>
  <g font-family="sans-serif" text-anchor="middle">
    <g><rect x="55" y="135" width="155" height="106" rx="18" fill="#29253d" stroke="#7565d7" stroke-width="2"/><text x="132" y="177" fill="#d9d1ff" font-size="18" font-weight="700">01 开始</text><text x="132" y="207" fill="#b9b2ce" font-size="14">打开首页</text></g>
    <g><rect x="288" y="135" width="155" height="106" rx="18" fill="#29253d" stroke="#7565d7" stroke-width="2"/><text x="365" y="177" fill="#d9d1ff" font-size="18" font-weight="700">02 练习</text><text x="365" y="207" fill="#b9b2ce" font-size="14">写下第一笔</text></g>
    <g><rect x="498" y="135" width="155" height="106" rx="18" fill="#29253d" stroke="#7565d7" stroke-width="2"/><text x="575" y="177" fill="#d9d1ff" font-size="18" font-weight="700">03 连接</text><text x="575" y="207" fill="#b9b2ce" font-size="14">添加内部链接</text></g>
    <g><rect x="708" y="135" width="137" height="106" rx="18" fill="#433b67" stroke="#a997ff" stroke-width="2"/><text x="776" y="177" fill="#fff" font-size="18" font-weight="700">04 回顾</text><text x="776" y="207" fill="#e0d9ff" font-size="14">检查与迭代</text></g>
  </g>
  <text x="450" y="306" fill="#8e85a8" font-family="sans-serif" font-size="14" text-anchor="middle">每一次小实验，都是下一条路径的入口</text>
</svg>
