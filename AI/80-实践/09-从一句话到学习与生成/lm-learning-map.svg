<svg xmlns="http://www.w3.org/2000/svg" width="425" height="670" viewBox="0 0 425 670" role="img" aria-labelledby="title desc"><title id="title">自回归教学模型的输入、可见性、计分和共享梯度</title><desc id="desc">上层的五个输入token右移为五个标签，EOS只在标签中。中层分别标明因果可见性、padding或文档边界和loss计分职责。下层的位置logits与共享bias产生softmax；每个有效位置的p减y梯度相加到同一个bias，SGD后从BOS按自己的前缀长度贪心生成并在EOS停止。</desc><style>text{font-family:'Arial Unicode MS','Hiragino Sans GB','PingFang SC','Noto Sans CJK SC',Arial,sans-serif;font-size:16px;fill:#172033}.h{font-weight:700}.card{fill:#ffffff;stroke:#3b5b87;stroke-width:1.7}.blue{fill:#eaf3ff;stroke:#2166a5}.orange{fill:#fff2e7;stroke:#a74818}.green{fill:#eaf8ef;stroke:#2c7a52}.muted{fill:#f1f4f7;stroke:#596678}.arrow{stroke:#2166a5;stroke-width:2;fill:none;marker-end:url(#m)}.plus{fill:#a74818;font-size:25px;font-weight:700}</style><defs><marker id="m" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#2166a5"/></marker></defs><rect width="425" height="670" fill="#f8fbff"/><text class="h" x="18" y="31">一句话：从训练到EOS生成</text><text x="18" y="59">输入（shift）：BOS　我　爱　蓝　猫</text><g transform="translate(18 74)"><rect class="card blue" width="68" height="42" rx="5"/><rect class="card blue" x="78" width="68" height="42" rx="5"/><rect class="card blue" x="156" width="68" height="42" rx="5"/><rect class="card blue" x="234" width="68" height="42" rx="5"/><rect class="card blue" x="312" width="68" height="42" rx="5"/><text x="13" y="27">BOS</text><text x="104" y="27">我</text><text x="182" y="27">爱</text><text x="260" y="27">蓝</text><text x="338" y="27">猫</text></g><path class="arrow" d="M210 121v27"/><text x="18" y="171">目标（右移）：我　爱　蓝　猫　EOS</text><text x="18" y="207" class="h">三个边界：看谁、什么属于本句、什么计分</text><rect class="card muted" x="18" y="220" width="389" height="72" rx="6"/><text x="32" y="247">因果可见性：位置 i 只可读 j≤i</text><text x="32" y="273">padding / 文档边界：不能把补齐或另一句当上下文</text><rect class="card orange" x="18" y="306" width="389" height="52" rx="6"/><text x="32" y="338">loss：仅有效标签进入NLL与有效token分母</text><text x="18" y="393" class="h">实际 toy：位置条件 softmax 与共享反向路径</text><rect class="card green" x="18" y="407" width="389" height="76" rx="6"/><text x="32" y="434">z[t,v] = position_logits[t,v] + shared_bias[v]</text><text x="32" y="462">softmax(z) → p；每个有效位置给出 p − y</text><path class="arrow" d="M75 486v43"/><path class="arrow" d="M170 486v43"/><path class="arrow" d="M265 486v43"/><text class="plus" x="111" y="543">+</text><text class="plus" x="206" y="543">+</text><rect class="card orange" x="54" y="551" width="318" height="50" rx="6"/><text x="70" y="582">shared_bias 梯度：所有有效位置相加</text><path class="arrow" d="M212 604v25"/><text x="18" y="653">SGD后：BOS → 我 → 爱 → 蓝 → 猫 → EOS（停止）</text></svg>
