<svg xmlns="http://www.w3.org/2000/svg" width="425" height="685" viewBox="0 0 425 685"><title>Manufacturing evidence pipeline</title><desc>Versioned nativeCAD inputs and exactreview boundaries throughactualsoftwareERC/DRC/fill/export,manufacturingviewer,assemblyandtest. Tool outputphotos not fabricated;CPU source candidate only.</desc><rect width="425" height="685" fill="white"/><g stroke="#111" stroke-width="2" fill="none"><text x="15" y="25" font-size="17">Same version: project -&gt; reviewed package</text><rect x="35" y="75" width="350" height="40" fill="white"/><text x="40" y="100.0" font-size="15">1 schematic/pinmap</text><text x="40" y="138" font-size="13">symbols,pins,rails,externalcontract</text><rect x="35" y="153" width="350" height="40" fill="white"/><text x="40" y="178.0" font-size="15">2 footprint/BOM</text><text x="40" y="216" font-size="13">actual MPN/drawing/ratings pending</text><rect x="35" y="231" width="350" height="40" fill="white"/><text x="40" y="256.0" font-size="15">3 PCB/rules/fill</text><text x="40" y="294" font-size="13">ground zone fill + sourceparity</text><rect x="35" y="309" width="350" height="40" fill="white"/><text x="40" y="334.0" font-size="15">4 actualERC/DRC</text><text x="40" y="372" font-size="13">not_run;CPUgeometry is different</text><rect x="35" y="387" width="350" height="40" fill="white"/><text x="40" y="412.0" font-size="15">5 Gerber/drill/BOM</text><text x="40" y="450" font-size="13">not generated;layers+units+origin</text><rect x="35" y="465" width="350" height="40" fill="white"/><text x="40" y="490.0" font-size="15">6 independentviewer</text><text x="40" y="528" font-size="13">not_run;holes/mask/outline/pin1</text><rect x="35" y="543" width="350" height="40" fill="white"/><text x="40" y="568.0" font-size="15">7 assemble/test</text><text x="40" y="606" font-size="13">no sameboardphoto or live results</text><text x="15" y="660" font-size="15">Do not send candidate as qualified fab package</text></g><style>text{fill:#111;stroke:none;font-family:DejaVu Sans,sans-serif}</style></svg>