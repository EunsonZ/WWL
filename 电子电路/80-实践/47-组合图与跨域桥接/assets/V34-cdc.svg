<svg xmlns="http://www.w3.org/2000/svg" width="425" height="687" viewBox="0 0 425 687"><rect width="425" height="687" fill="white"/><style>text{font:16px sans-serif;fill:#18232c}.title{font-weight:bold}.small{font-size:14px}.wire{stroke:#18232c;stroke-width:2;fill:none}.box{fill:#f2f5f7;stroke:#18232c;stroke-width:1.5}</style><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#18232c"/></marker></defs><text x="16" y="28" class="title">V34: information and physical boundaries</text><rect class="box" x="16" y="48" width="393" height="76"/><text x="26" y="71" class="">Single-bit state -&gt; FF1 -&gt; FF2 -&gt; logic</text><text x="26" y="95" class="">FF1 is not a direct functional source</text><text x="26" y="119" class="">Destination clock; analog risk remains</text><rect class="box" x="16" y="146" width="393" height="76"/><text x="26" y="169" class="">Pulse HIGH at 1..4 ns</text><text x="26" y="193" class="">Destination edges 0,10,20 ns miss it</text><text x="26" y="217" class="">More stages do not restore lost events</text><rect class="box" x="16" y="244" width="393" height="76"/><text x="26" y="267" class="">Multi-bit 01 -&gt; 10 may appear 00 / 11</text><text x="26" y="291" class="">Binary 011 -&gt; 100 changes 3 bits</text><text x="26" y="315" class="">Gray   010 -&gt; 110 changes 1 bit</text><rect class="box" x="16" y="345" width="182" height="76"/><text x="26" y="368" class="">wclk: binary</text><text x="26" y="392" class="">address + Gray</text><text x="26" y="416" class="">write / full</text><rect class="box" x="226" y="345" width="183" height="76"/><text x="236" y="368" class="">rclk: binary</text><text x="236" y="392" class="">address + Gray</text><text x="236" y="416" class="">read / empty</text><path class="wire" d="M198 367L226 367" marker-end="url(#a)"/><path class="wire" d="M226 397L198 397" marker-end="url(#a)"/><text x="16" y="446" class="">Pointers cross synchronizers; data uses RAM</text><rect class="box" x="16" y="463" width="393" height="76"/><text x="26" y="486" class="">Dual-port RAM; separate read/write timing</text><text x="26" y="510" class="">Gray skew, wrap bit, full/empty required</text><text x="26" y="534" class="">This is structure, not implemented FIFO</text><rect class="box" x="16" y="562" width="393" height="76"/><text x="26" y="585" class="">Reset: asynchronous assert in each domain</text><text x="26" y="609" class="">Release waits for each LOCAL clock</text><text x="26" y="633" class="">Recovery/removal + epoch remain checks</text><text x="16" y="665" class="small">No simulated metastable voltages / MTBF claim</text></svg>
