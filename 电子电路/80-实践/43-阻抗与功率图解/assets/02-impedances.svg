<svg xmlns="http://www.w3.org/2000/svg" width="680" height="720" viewBox="0 0 680 720"><rect width="680" height="100%" fill="white"/><defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#222"/></marker></defs><g font-family="sans-serif" fill="#111"><text x="30" y="40" font-size="24" text-anchor="start">Why is L above and C below the real axis?</text><text x="30" y="85" font-size="24" text-anchor="start">RLC: R=10 ohm; XL=+10 ohm; XC=-5 ohm</text><line x1="70" y1="430" x2="610" y2="430" stroke="#222" stroke-width="3" stroke-dasharray="" marker-end="url(#tip)"/><line x1="140" y1="590" x2="140" y2="140" stroke="#222" stroke-width="3" stroke-dasharray="" marker-end="url(#tip)"/><text x="545" y="470" font-size="24" text-anchor="start">Re(Z)</text><text x="150" y="155" font-size="24" text-anchor="start">Im(Z) [ohm]</text><line x1="140" y1="430" x2="380.0" y2="430.0" stroke="#215b91" stroke-width="3" stroke-dasharray="" marker-end="url(#tip)"/><text x="395.0" y="475" font-size="24" text-anchor="start">ZR = 10</text><line x1="140" y1="430" x2="140.0" y2="190.0" stroke="#287c40" stroke-width="3" stroke-dasharray="" marker-end="url(#tip)"/><text x="155.0" y="225" font-size="24" text-anchor="start">ZL = +j10</text><line x1="140" y1="430" x2="140.0" y2="550.0" stroke="#965020" stroke-width="3" stroke-dasharray="" marker-end="url(#tip)"/><text x="155.0" y="570" font-size="24" text-anchor="start">ZC = -j5</text><line x1="140" y1="430" x2="380.0" y2="310.0" stroke="#222" stroke-width="3" stroke-dasharray="" marker-end="url(#tip)"/><text x="395.0" y="270" font-size="24" text-anchor="start">Z = 10+j5</text><text x="30" y="635" font-size="24" text-anchor="start">e^(+j omega t), passive reference, omega &gt; 0.</text><text x="30" y="680" font-size="24" text-anchor="start">ZL = j omega L; ZC = 1/(j omega C).</text></g></svg>