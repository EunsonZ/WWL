<svg xmlns="http://www.w3.org/2000/svg" width="360" height="465" viewBox="0 0 360 465"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#17212b"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0 8 L8 0" stroke="#88929a" stroke-width="1"/></pattern></defs><rect width="360" height="465" fill="white"/><text x="20" y="25" font-family="DejaVu Sans,sans-serif" font-size="15" text-anchor="start" fill="#17212b">Thermal paths: same P = 0.2 W</text><text x="20" y="45" font-family="DejaVu Sans,sans-serif" font-size="15" text-anchor="start" fill="#17212b">3D layer sketch; not a solved field</text><polygon points="50,230 230,230 310,265 130,265" fill="#a6b9c5" stroke="#17212b"/><polygon points="130,265 310,265 310,282 130,282" fill="url(#hatch)" stroke="#17212b"/><text x="130" y="259" font-family="DejaVu Sans,sans-serif" font-size="13" text-anchor="start" fill="#17212b">PCB node b</text><polygon points="50,180 230,180 310,215 130,215" fill="#d6dadd" stroke="#17212b"/><polygon points="130,215 310,215 310,232 130,232" fill="url(#hatch)" stroke="#17212b"/><text x="130" y="209" font-family="DejaVu Sans,sans-serif" font-size="13" text-anchor="start" fill="#17212b">Package path</text><polygon points="50,130 230,130 310,165 130,165" fill="#ddb195" stroke="#17212b"/><polygon points="130,165 310,165 310,182 130,182" fill="url(#hatch)" stroke="#17212b"/><text x="130" y="159" font-family="DejaVu Sans,sans-serif" font-size="13" text-anchor="start" fill="#17212b">Die: node j</text><path d="M182,86 L182,127" stroke="#17212b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="200" y="98" font-family="DejaVu Sans,sans-serif" font-size="13" text-anchor="start" fill="#17212b">P = 0.2 W</text><path d="M110,145 L110,248" stroke="#17212b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="12" y="198" font-family="DejaVu Sans,sans-serif" font-size="12" text-anchor="start" fill="#17212b">j to b</text><path d="M220,286 L220,324" stroke="#17212b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="25" y="340" font-family="DejaVu Sans,sans-serif" font-size="13" text-anchor="start" fill="#17212b">b to ambient; parallel j to ambient</text><path d="M310 165 L340 165 L340 321 L250 321" stroke="#17212b" stroke-width="2" stroke-dasharray="5 4" fill="none" marker-end="url(#arrow)"/><text x="20" y="380" font-family="DejaVu Sans,sans-serif" font-size="13" text-anchor="start" fill="#17212b">Cj = 2 J/K; Cb = 8 J/K</text><text x="20" y="400" font-family="DejaVu Sans,sans-serif" font-size="13" text-anchor="start" fill="#17212b">Rjb = 5 K/W; Rba = 20 K/W</text><text x="20" y="420" font-family="DejaVu Sans,sans-serif" font-size="13" text-anchor="start" fill="#17212b">Rja = 100 K/W (parallel path)</text><text x="20" y="440" font-family="DejaVu Sans,sans-serif" font-size="13" text-anchor="start" fill="#17212b">Ta = 300 K; no geometry calibration</text></svg>