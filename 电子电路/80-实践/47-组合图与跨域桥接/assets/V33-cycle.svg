<svg xmlns="http://www.w3.org/2000/svg" width="425" height="594" viewBox="0 0 425 594"><rect width="425" height="594" fill="white"/><style>text{font:16px sans-serif;fill:#18232c}.title{font-weight:bold}.small{font-size:14px}.wire{stroke:#18232c;stroke-width:2;fill:none}.box{fill:#f2f5f7;stroke:#18232c;stroke-width:1.5}</style><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#18232c"/></marker></defs><text x="16" y="28" class="title">V33: old transactions / new storage</text><text x="16" y="58" class="">CPU expected values; not HDL / VCD</text><text x="16" y="85" class="">drive edge observe = 20 / 25 / 26 ns</text><text x="16" y="112" class="">Next rows advance by 10 ns</text><text x="16" y="153" class="">edge</text><text x="78" y="153" class="">sv</text><text x="120" y="153" class="">mr</text><text x="166" y="153" class="">push</text><text x="224" y="153" class="">pop</text><text x="282" y="153" class="">old</text><text x="347" y="153" class="">new</text><text x="16" y="185" class="">25</text><text x="78" y="185" class="">1</text><text x="120" y="185" class="">1</text><text x="166" y="185" class="">1</text><text x="224" y="185" class="">0</text><text x="282" y="185" class="">--</text><text x="347" y="185" class="">A1</text><path class="wire" d="M16 194L409 194"/><text x="16" y="219" class="">35</text><text x="78" y="219" class="">1</text><text x="120" y="219" class="">0</text><text x="166" y="219" class="">0</text><text x="224" y="219" class="">0</text><text x="282" y="219" class="">A1</text><text x="347" y="219" class="">A1</text><path class="wire" d="M16 228L409 228"/><text x="16" y="253" class="">45</text><text x="78" y="253" class="">1</text><text x="120" y="253" class="">0</text><text x="166" y="253" class="">0</text><text x="224" y="253" class="">0</text><text x="282" y="253" class="">A1</text><text x="347" y="253" class="">A1</text><path class="wire" d="M16 262L409 262"/><text x="16" y="287" class="">55</text><text x="78" y="287" class="">1</text><text x="120" y="287" class="">1</text><text x="166" y="287" class="">1</text><text x="224" y="287" class="">1</text><text x="282" y="287" class="">A1</text><text x="347" y="287" class="">B2</text><path class="wire" d="M16 296L409 296"/><text x="16" y="321" class="">65</text><text x="78" y="321" class="">0</text><text x="120" y="321" class="">1</text><text x="166" y="321" class="">0</text><text x="224" y="321" class="">1</text><text x="282" y="321" class="">B2</text><text x="347" y="321" class="">--</text><path class="wire" d="M16 330L409 330"/><text x="16" y="355" class="">75</text><text x="78" y="355" class="">0</text><text x="120" y="355" class="">1</text><text x="166" y="355" class="">0</text><text x="224" y="355" class="">0</text><text x="282" y="355" class="">--</text><text x="347" y="355" class="">--</text><path class="wire" d="M16 364L409 364"/><rect class="box" x="16" y="414" width="393" height="100"/><text x="26" y="437" class="">55 ns: deliver OLD A1, accept B2</text><text x="26" y="461" class="">56 ns: registered head is NEW B2</text><text x="26" y="485" class="">35/45 ns: retain A1 under backpressure</text><text x="26" y="509" class="">Reset cancels queue before this table</text><text x="16" y="545" class="">FIFO history: pop head, then append push</text><text x="16" y="570" class="">True VCD requires actual tool run: not_run</text></svg>
