<svg xmlns="http://www.w3.org/2000/svg" width="425" height="600" viewBox="0 0 425 600"><title>Poisson and carrier conservation mesh</title><desc>F01/V41 device mesh contribution only. One dimensional schematic not to manufacture scale. Internal node quantities, contact boundary contracts and shared oriented edge fluxes. Dashed lines are control-volume faces, not wires.</desc><rect width="425" height="600" fill="white"/><g stroke="#111" stroke-width="2" fill="none"><text x="15" y="26" font-size="17">F01: node unknowns, shared edge flux</text><text x="15" y="58" font-size="14">1D material; drawing not fabrication scale</text><line x1="35" y1="135" x2="390" y2="135"/><text x="355" y="120" font-size="12">+x / m</text><circle cx="45" cy="135" r="5" fill="white"/><text x="33" y="167" font-size="14">0</text><text x="23" y="198" font-size="12">contact</text><circle cx="125" cy="135" r="5" fill="white"/><text x="113" y="167" font-size="14">i-1</text><text x="103" y="198" font-size="12">phi,n,p</text><circle cx="225" cy="135" r="5" fill="white"/><text x="213" y="167" font-size="14">i</text><text x="203" y="198" font-size="12">phi,n,p</text><circle cx="325" cy="135" r="5" fill="white"/><text x="313" y="167" font-size="14">N</text><text x="303" y="198" font-size="12">contact</text><line x1="85" y1="105" x2="85" y2="235" stroke-dasharray="5 4"/><line x1="175" y1="105" x2="175" y2="235" stroke-dasharray="5 4"/><line x1="275" y1="105" x2="275" y2="235" stroke-dasharray="5 4"/><rect x="175" y="220" width="100" height="100" fill="white"/><text x="183" y="275.0" font-size="14"></text><text x="183" y="244" font-size="13">volume w_i</text><text x="183" y="273" font-size="12">rho_i / C m^-3</text><text x="183" y="300" font-size="11">R-G / m^-3 s^-1</text><text x="15" y="365" font-size="14">D_right - D_left = rho_i w_i</text><text x="15" y="397" font-size="14">Jn_right - Jn_left = q(R-G) w_i</text><text x="15" y="429" font-size="14">Jp has the opposite source sign</text><text x="15" y="477" font-size="14">Contacts: phi and carrier contract</text><text x="15" y="509" font-size="14">No-flux boundary is a different condition</text><text x="15" y="541" font-size="14">Shared edge -&gt; internal flux cancels</text><text x="15" y="573" font-size="14">Nodes: V, m^-3; edges: C/m^2, A/m^2</text></g><style>text{fill:#111;stroke:none;font-family:DejaVu Sans,sans-serif}</style></svg>