<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="330" viewBox="0 0 1100 330" role="img" aria-labelledby="title desc">
<title id="title">CRT compatibility in one complete twelve-position period</title>
<desc id="desc">Top: positions 1,5,9 modulo four and 3,9 modulo six overlap at 9. Bottom: positions 1,5,9 and 2,8 do not overlap. Circles mark the first condition, squares the second; filled green marks a common solution.</desc>
<rect width="1100" height="330" fill="#fafafa"/>
<text x="25" y="45" font-family="sans-serif" font-size="20">x = 1 (mod 4), x = 3 (mod 6): compatible; x = 9 (mod 12)</text>
<line x1="65" y1="95" x2="1055" y2="95" stroke="#aaa"/>
<circle cx="65" cy="95" r="15" fill="white" stroke="#999" stroke-width="2"/>
<text x="65" y="100" text-anchor="middle" font-family="sans-serif" font-size="14">0</text>
<circle cx="155" cy="95" r="15" fill="#d1e9ff" stroke="#175cd3" stroke-width="2"/>
<text x="155" y="100" text-anchor="middle" font-family="sans-serif" font-size="14">1</text>
<circle cx="245" cy="95" r="15" fill="white" stroke="#999" stroke-width="2"/>
<text x="245" y="100" text-anchor="middle" font-family="sans-serif" font-size="14">2</text>
<rect x="313" y="73" width="44" height="44" fill="none" stroke="#b54708" stroke-width="3"/>
<circle cx="335" cy="95" r="15" fill="white" stroke="#999" stroke-width="2"/>
<text x="335" y="100" text-anchor="middle" font-family="sans-serif" font-size="14">3</text>
<circle cx="425" cy="95" r="15" fill="white" stroke="#999" stroke-width="2"/>
<text x="425" y="100" text-anchor="middle" font-family="sans-serif" font-size="14">4</text>
<circle cx="515" cy="95" r="15" fill="#d1e9ff" stroke="#175cd3" stroke-width="2"/>
<text x="515" y="100" text-anchor="middle" font-family="sans-serif" font-size="14">5</text>
<circle cx="605" cy="95" r="15" fill="white" stroke="#999" stroke-width="2"/>
<text x="605" y="100" text-anchor="middle" font-family="sans-serif" font-size="14">6</text>
<circle cx="695" cy="95" r="15" fill="white" stroke="#999" stroke-width="2"/>
<text x="695" y="100" text-anchor="middle" font-family="sans-serif" font-size="14">7</text>
<circle cx="785" cy="95" r="15" fill="white" stroke="#999" stroke-width="2"/>
<text x="785" y="100" text-anchor="middle" font-family="sans-serif" font-size="14">8</text>
<rect x="853" y="73" width="44" height="44" fill="none" stroke="#b54708" stroke-width="3"/>
<circle cx="875" cy="95" r="15" fill="#abefc6" stroke="#175cd3" stroke-width="2"/>
<text x="875" y="100" text-anchor="middle" font-family="sans-serif" font-size="14">9</text>
<circle cx="965" cy="95" r="15" fill="white" stroke="#999" stroke-width="2"/>
<text x="965" y="100" text-anchor="middle" font-family="sans-serif" font-size="14">10</text>
<circle cx="1055" cy="95" r="15" fill="white" stroke="#999" stroke-width="2"/>
<text x="1055" y="100" text-anchor="middle" font-family="sans-serif" font-size="14">11</text>
<text x="25" y="195" font-family="sans-serif" font-size="20">x = 1 (mod 4), x = 2 (mod 6): incompatible; gcd 2 does not divide 1</text>
<line x1="65" y1="245" x2="1055" y2="245" stroke="#aaa"/>
<circle cx="65" cy="245" r="15" fill="white" stroke="#999" stroke-width="2"/>
<text x="65" y="250" text-anchor="middle" font-family="sans-serif" font-size="14">0</text>
<circle cx="155" cy="245" r="15" fill="#d1e9ff" stroke="#175cd3" stroke-width="2"/>
<text x="155" y="250" text-anchor="middle" font-family="sans-serif" font-size="14">1</text>
<rect x="223" y="223" width="44" height="44" fill="none" stroke="#b54708" stroke-width="3"/>
<circle cx="245" cy="245" r="15" fill="white" stroke="#999" stroke-width="2"/>
<text x="245" y="250" text-anchor="middle" font-family="sans-serif" font-size="14">2</text>
<circle cx="335" cy="245" r="15" fill="white" stroke="#999" stroke-width="2"/>
<text x="335" y="250" text-anchor="middle" font-family="sans-serif" font-size="14">3</text>
<circle cx="425" cy="245" r="15" fill="white" stroke="#999" stroke-width="2"/>
<text x="425" y="250" text-anchor="middle" font-family="sans-serif" font-size="14">4</text>
<circle cx="515" cy="245" r="15" fill="#d1e9ff" stroke="#175cd3" stroke-width="2"/>
<text x="515" y="250" text-anchor="middle" font-family="sans-serif" font-size="14">5</text>
<circle cx="605" cy="245" r="15" fill="white" stroke="#999" stroke-width="2"/>
<text x="605" y="250" text-anchor="middle" font-family="sans-serif" font-size="14">6</text>
<circle cx="695" cy="245" r="15" fill="white" stroke="#999" stroke-width="2"/>
<text x="695" y="250" text-anchor="middle" font-family="sans-serif" font-size="14">7</text>
<rect x="763" y="223" width="44" height="44" fill="none" stroke="#b54708" stroke-width="3"/>
<circle cx="785" cy="245" r="15" fill="white" stroke="#999" stroke-width="2"/>
<text x="785" y="250" text-anchor="middle" font-family="sans-serif" font-size="14">8</text>
<circle cx="875" cy="245" r="15" fill="#d1e9ff" stroke="#175cd3" stroke-width="2"/>
<text x="875" y="250" text-anchor="middle" font-family="sans-serif" font-size="14">9</text>
<circle cx="965" cy="245" r="15" fill="white" stroke="#999" stroke-width="2"/>
<text x="965" y="250" text-anchor="middle" font-family="sans-serif" font-size="14">10</text>
<circle cx="1055" cy="245" r="15" fill="white" stroke="#999" stroke-width="2"/>
<text x="1055" y="250" text-anchor="middle" font-family="sans-serif" font-size="14">11</text>
</svg>
