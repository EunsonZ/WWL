<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480"><defs><marker id="arr" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="#222"/></marker></defs><rect width="100%" height="100%" fill="white"/><g stroke="#222" stroke-width="2.5" fill="none"><text x="18" y="30" font-family="Arial,sans-serif" font-size="23" fill="#111" stroke="none">Same loop, four independent voltage injections</text><circle cx="90" cy="150" r="20"/><text x="82" y="157" font-family="Arial,sans-serif" font-size="24" fill="#111" stroke="none">+</text><circle cx="290" cy="150" r="20"/><text x="282" y="157" font-family="Arial,sans-serif" font-size="24" fill="#111" stroke="none">+</text><circle cx="550" cy="150" r="20"/><text x="542" y="157" font-family="Arial,sans-serif" font-size="24" fill="#111" stroke="none">+</text><path d="M20 150 L70 150" marker-end="url(#arr)"/><text x="20" y="130" font-family="Arial,sans-serif" font-size="22" fill="#111" stroke="none">r</text><path d="M110 150 L140 150" marker-end="url(#arr)"/><rect x="140" y="125" width="100" height="50"/><text x="175" y="157" font-family="Arial,sans-serif" font-size="22" fill="#111" stroke="none">C</text><path d="M240 150 L270 150" marker-end="url(#arr)"/><text x="250" y="133" font-family="Arial,sans-serif" font-size="22" fill="#111" stroke="none">u</text><path d="M310 150 L355 150" marker-end="url(#arr)"/><rect x="355" y="125" width="100" height="50"/><text x="390" y="157" font-family="Arial,sans-serif" font-size="22" fill="#111" stroke="none">P</text><path d="M455 150 L530 150" marker-end="url(#arr)"/><path d="M570 150 L685 150" marker-end="url(#arr)"/><text x="650" y="132" font-family="Arial,sans-serif" font-size="22" fill="#111" stroke="none">y</text><path d="M290 70 L290 130" marker-end="url(#arr)"/><text x="270" y="59" font-family="Arial,sans-serif" font-size="22" fill="#111" stroke="none">di</text><path d="M550 70 L550 130" marker-end="url(#arr)"/><text x="530" y="59" font-family="Arial,sans-serif" font-size="22" fill="#111" stroke="none">do</text><path d="M620 150 L620 260 L90 260 L90 170" marker-end="url(#arr)"/><circle cx="620" cy="150" r="4" fill="#222"/><path d="M90 65 L90 130" marker-end="url(#arr)"/><text x="62" y="55" font-family="Arial,sans-serif" font-size="22" fill="#111" stroke="none">n (-)</text><text x="98" y="245" font-family="Arial,sans-serif" font-size="18" fill="#111" stroke="none">y (-)</text><text x="25" y="335" font-family="Arial,sans-serif" font-size="24" fill="#111" stroke="none">u = C(r-y-n)    y = P(u+di)+do</text><text x="25" y="383" font-family="Arial,sans-serif" font-size="24" fill="#111" stroke="none">y:  T r + PS di + S do - T n</text><text x="25" y="431" font-family="Arial,sans-serif" font-size="24" fill="#111" stroke="none">u: CS r - T di - CS do - CS n</text></g></svg>