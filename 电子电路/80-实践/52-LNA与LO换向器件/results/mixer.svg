<text x="50" y="846" class="">D 理想常Ron噪声模型：不同RF谱口径，不是实际MOS周期noise仿真</text>
<text x="60" y="884" class="">两RF带 SSB F=2.705074；全白RF所有奇次带 F=3.172475</text>
<text x="60" y="917" class="small">包括2Ron和RB热源；实际预选器还改变谐波阻抗/损耗热源，不能只删谱。</text>
<text x="50" y="978" class="small">弱LO小残余、强音10MHz残余均为有限窗口；步长细化不充PSS/物理IM3或硬件签核。</text>
<text x="50" y="1010" class="small">本图未给LNA到桥的真实balun/加载连接，两个器件实例不能直接乘GT/Friis。</text>
