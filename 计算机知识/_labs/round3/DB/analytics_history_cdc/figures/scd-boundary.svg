<svg xmlns="http://www.w3.org/2000/svg" width="850" height="460" viewBox="0 0 850 460" role="img" aria-labelledby="title desc">
<title id="title">SCD半开接缝与迟到事实归属</title><desc id="desc">r1客户c1的North区间为零到十不含十，South从十开始。前缀五中迟到的flate业务日三仍属North，f2业务日十属South。</desc><rect width="100%" height="100%" fill="white"/><g font-family="sans-serif"><text x="30" y="35" font-size="23" fill="#17212b">晚到的事实：按发生日，还是按收件时的新标签？</text><text x="30" y="64" font-size="15" fill="#17212b">取投递前缀p=5；r1维度；当前事实版本（不是历史全库快照）</text><rect x="100" y="115" width="270" height="40" fill="#d6e7f6" stroke="#415568"/><text x="100" y="103" font-size="16" fill="#17212b">c1-old · North [0,10)</text><rect x="370" y="200" width="324" height="40" fill="#daf0df" stroke="#415568"/><text x="370" y="188" font-size="16" fill="#17212b">c1-new · South [10,∞)</text><line x1="370" y1="82" x2="370" y2="320" stroke="#9a493f" stroke-dasharray="6 4"/><circle cx="181" cy="142" r="6" fill="#17212b"/><line x1="181" y1="149" x2="181" y2="272" stroke="#415568"/><text x="146" y="290" font-size="14" fill="#17212b">p5: flate/v1 / day=3</text><circle cx="343" cy="142" r="6" fill="#17212b"/><line x1="343" y1="149" x2="343" y2="307" stroke="#415568"/><text x="308" y="325" font-size="14" fill="#17212b">p1: f1/v1 / day=9</text><circle cx="370" cy="227" r="6" fill="#17212b"/><polyline points="370,234 500,257 500,342" fill="none" stroke="#415568"/><text x="465" y="360" font-size="14" fill="#17212b">p2: f2/v1 / day=10</text><text x="30" y="405" font-size="17" fill="#17212b">p5比p2晚收，day3仍属于North；day10恰好归South。</text><text x="30" y="435" font-size="15" fill="#17212b">后续flate/v2将发生日改成10，需重归属；修订不是把旧标签也再加一次。</text></g></svg>
