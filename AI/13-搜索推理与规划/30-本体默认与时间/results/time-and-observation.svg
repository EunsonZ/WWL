<svg xmlns="http://www.w3.org/2000/svg" width="880" height="750" viewBox="0 0 880 750" role="img" aria-labelledby="title desc"><title id="title">Successor-state truth table and observation filtering</title><desc id="desc">Top: complete true/false fluent snapshots of the saved action sequence. Bottom: a separate six-world uncertainty example, filtered by AtB and Holding observations; the physical world is unchanged until Drop. Times are action indices and counts are world counts, not probabilities or durations.</desc><rect width="100%" height="100%" fill="white"/><g font-family="sans-serif" font-size="16" fill="#172638"><text x="25" y="30" font-size="20">State changes and information changes are different operations</text><text x="175" y="79">t=0</text><text x="230" y="58">Pick</text><rect x="168" y="92" width="45" height="27" fill="#09699b"/><text x="186" y="112" fill="white">1</text><text x="25" y="112">AtA</text><rect x="168" y="127" width="45" height="27" fill="#e0e5e9"/><text x="186" y="147" fill="#536478">0</text><text x="25" y="147">AtB</text><rect x="168" y="162" width="45" height="27" fill="#09699b"/><text x="186" y="182" fill="white">1</text><text x="25" y="182">HandEmpty</text><rect x="168" y="197" width="45" height="27" fill="#e0e5e9"/><text x="186" y="217" fill="#536478">0</text><text x="25" y="217">Holding</text><rect x="168" y="232" width="45" height="27" fill="#09699b"/><text x="186" y="252" fill="white">1</text><text x="25" y="252">PkgA</text><rect x="168" y="267" width="45" height="27" fill="#e0e5e9"/><text x="186" y="287" fill="#536478">0</text><text x="25" y="287">PkgB</text><text x="335" y="79">t=1</text><text x="390" y="58">MoveAB</text><rect x="328" y="92" width="45" height="27" fill="#09699b"/><text x="346" y="112" fill="white">1</text><rect x="328" y="127" width="45" height="27" fill="#e0e5e9"/><text x="346" y="147" fill="#536478">0</text><rect x="328" y="162" width="45" height="27" fill="#e0e5e9"/><text x="346" y="182" fill="#536478">0</text><rect x="328" y="197" width="45" height="27" fill="#09699b"/><text x="346" y="217" fill="white">1</text><rect x="328" y="232" width="45" height="27" fill="#e0e5e9"/><text x="346" y="252" fill="#536478">0</text><rect x="328" y="267" width="45" height="27" fill="#e0e5e9"/><text x="346" y="287" fill="#536478">0</text><text x="495" y="79">t=2</text><text x="550" y="58">Drop</text><rect x="488" y="92" width="45" height="27" fill="#e0e5e9"/><text x="506" y="112" fill="#536478">0</text><rect x="488" y="127" width="45" height="27" fill="#09699b"/><text x="506" y="147" fill="white">1</text><rect x="488" y="162" width="45" height="27" fill="#e0e5e9"/><text x="506" y="182" fill="#536478">0</text><rect x="488" y="197" width="45" height="27" fill="#09699b"/><text x="506" y="217" fill="white">1</text><rect x="488" y="232" width="45" height="27" fill="#e0e5e9"/><text x="506" y="252" fill="#536478">0</text><rect x="488" y="267" width="45" height="27" fill="#e0e5e9"/><text x="506" y="287" fill="#536478">0</text><text x="655" y="79">t=3</text><rect x="648" y="92" width="45" height="27" fill="#e0e5e9"/><text x="666" y="112" fill="#536478">0</text><rect x="648" y="127" width="45" height="27" fill="#09699b"/><text x="666" y="147" fill="white">1</text><rect x="648" y="162" width="45" height="27" fill="#09699b"/><text x="666" y="182" fill="white">1</text><rect x="648" y="197" width="45" height="27" fill="#e0e5e9"/><text x="666" y="217" fill="#536478">0</text><rect x="648" y="232" width="45" height="27" fill="#e0e5e9"/><text x="666" y="252" fill="#536478">0</text><rect x="648" y="267" width="45" height="27" fill="#09699b"/><text x="666" y="287" fill="white">1</text><text x="25" y="352">t counts modeled action steps, not seconds. 1=true; 0=false in each complete world.</text><text x="25" y="400" font-size="19">A separate uncertain scenario: observe AtB, then Holding, then act Drop</text><rect x="30" y="425" width="195" height="190" rx="7" fill="#f3f6f9" stroke="#9aabb8"/><text x="40" y="452">before</text><text x="40" y="480">6 possible worlds</text><text x="40" y="505" font-size="14">robot A, package A</text><text x="40" y="522" font-size="14">robot A, package B</text><text x="40" y="539" font-size="14">robot A, package held</text><text x="40" y="556" font-size="14">robot B, package A</text><text x="40" y="573" font-size="14">robot B, package B</text><text x="40" y="590" font-size="14">robot B, package held</text><rect x="240" y="425" width="195" height="190" rx="7" fill="#f3f6f9" stroke="#9aabb8"/><text x="250" y="452">after_AtB</text><text x="250" y="480">3 possible worlds</text><text x="250" y="505" font-size="14">robot B, package A</text><text x="250" y="522" font-size="14">robot B, package B</text><text x="250" y="539" font-size="14">robot B, package held</text><rect x="450" y="425" width="195" height="190" rx="7" fill="#f3f6f9" stroke="#9aabb8"/><text x="460" y="452">after_Holding</text><text x="460" y="480">1 possible world</text><text x="460" y="505" font-size="14">robot B, package held</text><rect x="660" y="425" width="195" height="190" rx="7" fill="#f3f6f9" stroke="#9aabb8"/><text x="670" y="452">after_Drop</text><text x="670" y="480">1 possible world</text><text x="670" y="505" font-size="14">robot B, package B</text><text x="25" y="652">Both observations keep actual world (B, held). Only Drop changes it to (B, B).</text><text x="25" y="684">Before Holding is observed, Drop is not safe in all three possible worlds.</text><text x="25" y="716">An incompatible AtA observation reports conflict; empty belief is not omniscience.</text></g></svg>
