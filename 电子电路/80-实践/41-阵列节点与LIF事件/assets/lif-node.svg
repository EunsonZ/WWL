<svg xmlns="http://www.w3.org/2000/svg" width="360" height="565" viewBox="0 0 360 565"><rect width="360" height="565" fill="white"/><style>text{font:14px sans-serif;fill:#18232c}.wire{fill:none;stroke:#18232c;stroke-width:2}.box{fill:#eef4f8;stroke:#18232c;stroke-width:1.5}.node{fill:#18232c}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#18232c"/></marker></defs><text x="16" y="26">LIF subthreshold node and ideal reset rule</text><text x="16" y="53">Synthetic electrical analogy, NOT a cell device</text><path class="wire" d="M55 120L285 120"/><path class="wire" d="M55 120L55 190"/><circle class="wire" cx="55" cy="210" r="20"/><path class="wire" d="M55 226L55 196" marker-end="url(#arrow)"/><path class="wire" d="M55 230L55 325"/><path class="wire" d="M55 325L55 333"/><path class="wire" d="M46 333L64 333"/><path class="wire" d="M49 337L61 337"/><text x="67" y="337">0 V</text><text x="16" y="78">I [A] flows into v</text><path class="wire" d="M165 120L165 180"/><rect class="box" x="158" y="180" width="14" height="55"/><text x="163" y="212.5"></text><path class="wire" d="M165 235L165 325"/><path class="wire" d="M165 325L165 333"/><path class="wire" d="M156 333L174 333"/><path class="wire" d="M159 337L171 337"/><text x="177" y="337">0 V</text><text x="185" y="210">R=10 Mohm</text><path class="wire" d="M285 120L285 195"/><path class="wire" d="M267 195L303 195"/><path class="wire" d="M267 207L303 207"/><path class="wire" d="M285 207L285 325"/><path class="wire" d="M285 325L285 333"/><path class="wire" d="M276 333L294 333"/><path class="wire" d="M279 337L291 337"/><text x="297" y="337">0 V</text><text x="223" y="256">C=1 nF</text><circle class="node" cx="285" cy="120" r="3"/><text x="180" y="104">v [V]; rest=0 V</text><path class="wire" d="M285 120L335 120"/><path class="wire" d="M335 120L335 395" marker-end="url(#arrow)"/><rect class="box" x="20" y="395" width="315" height="80"/><text x="25" y="440.0"></text><text x="30" y="423">Threshold .01 V -> event -> reset 0 V</text><text x="34" y="450">Then ideal hold for 1 ms (own extension)</text><text x="16" y="515">C dv/dt = I - v/R; tau=RC=.01 s</text><text x="16" y="542">Reset control/supply energy not predicted</text></svg>