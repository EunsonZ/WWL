<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="370" viewBox="0 0 1080 370"><rect width="1080" height="370" fill="#f6f8fc"/><g font-family="PingFang SC, Noto Sans CJK SC, sans-serif"><text x="30" y="43" font-size="26" fill="#12243b">独立税片段：永久差异改总费，暂时差异改分配</text><text x="30" y="78" font-size="16" fill="#42536a">单位：万元；会计利润65已含罚款4及免税收入6；税率25%</text><rect x="30.0" y="113" width="241.5" height="165" rx="12" fill="#224a73"/><text x="44.0" y="150" font-size="19" fill="#fff">法定基准</text><text x="44.0" y="192" font-size="22" fill="#fff">16.25</text><text x="44.0" y="233" font-size="14" fill="#fff">65 * 25%</text><path d="M273.5,193 h14 l-5,-5 m5,5 l-5,5" fill="none" stroke="#42536a" stroke-width="2"/><rect x="289.5" y="113" width="241.5" height="165" rx="12" fill="#9b6032"/><text x="303.5" y="150" font-size="19" fill="#fff">不可扣罚款</text><text x="303.5" y="192" font-size="22" fill="#fff">+ 1.00</text><text x="303.5" y="233" font-size="14" fill="#fff">4 * 25%</text><path d="M533.0,193 h14 l-5,-5 m5,5 l-5,5" fill="none" stroke="#42536a" stroke-width="2"/><rect x="549.0" y="113" width="241.5" height="165" rx="12" fill="#29825d"/><text x="563.0" y="150" font-size="19" fill="#fff">免税收入</text><text x="563.0" y="192" font-size="22" fill="#fff">- 1.50</text><text x="563.0" y="233" font-size="14" fill="#fff">6 * 25%</text><path d="M792.5,193 h14 l-5,-5 m5,5 l-5,5" fill="none" stroke="#42536a" stroke-width="2"/><rect x="808.5" y="113" width="241.5" height="165" rx="12" fill="#22637b"/><text x="822.5" y="150" font-size="19" fill="#fff">总税费</text><text x="822.5" y="192" font-size="22" fill="#fff">15.75</text><text x="822.5" y="233" font-size="14" fill="#fff">当前10.75 + 递延5</text><text x="30" y="325" font-size="17" fill="#23374e">多扣税折旧20：当前税减少5、递延税增加5；现金付12另按税余额滚动核对。</text></g></svg>