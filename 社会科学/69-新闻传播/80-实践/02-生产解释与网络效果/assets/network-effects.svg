<text x="705" y="253" font-size="19" fill="#182a3a">1</text>
<text x="820" y="253" font-size="19" fill="#182a3a">2</text>
<text x="935" y="253" font-size="19" fill="#182a3a">2</text>
<text x="1050" y="253" font-size="19" fill="#182a3a">3</text>
