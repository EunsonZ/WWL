<text x="35" y="640" font-size="20" fill="#17324d">蓝：运行 O；橙：制造分摊 M。条长比较窗口总 C，右列另有成功请求分母。</text>
<text x="35" y="676" font-size="20" fill="#17324d">质量不达声明门槛的卡共 1 项：不输出同功能单位强度；完整拒因留在JSON。</text>
