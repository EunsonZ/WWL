<text x="705" y="298" font-size="19" fill="#182a3a">1</text>
<text x="820" y="298" font-size="19" fill="#182a3a">2</text>
<text x="935" y="298" font-size="19" fill="#182a3a">2</text>
<text x="1050" y="298" font-size="19" fill="#182a3a">3</text>
<text x="420" y="343" font-size="17" fill="#182a3a">Attitude: true / expected HT</text>
<text x="705" y="343" font-size="19" fill="#182a3a">3</text>
<text x="820" y="343" font-size="19" fill="#182a3a">3</text>
<text x="935" y="343" font-size="19" fill="#182a3a">3</text>
<text x="1050" y="343" font-size="19" fill="#182a3a">3</text>
