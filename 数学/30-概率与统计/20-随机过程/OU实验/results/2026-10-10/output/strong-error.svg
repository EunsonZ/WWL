<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 340" role="img" aria-labelledby="title desc"><title id="title">OU terminal strong RMS error against time step</title><desc id="desc">Log base two axes. Blue connected values are exact analytic RMS errors. Orange dots are Monte Carlo values, bars show plus or minus two estimated delta method standard errors. This additive noise OU case approaches order one; the figure is not a general proof.</desc><rect width="650" height="340" fill="white"/><g font-family="sans-serif" font-size="13" fill="#222"><text x="75" y="28">OU strong RMS error, T=1; log2 axes</text><path d="M75,55 V265 H590" fill="none" stroke="#333"/><polyline points="575.00,106.79 408.33,139.60 241.67,171.82 75.00,203.76" fill="none" stroke="#185fa0" stroke-width="2"/><path d="M575.00,106.98 V106.58" stroke="#b44517"/><circle cx="575.00" cy="106.78" r="4" fill="#b44517"/><path d="M408.33,139.84 V139.43" stroke="#b44517"/><circle cx="408.33" cy="139.64" r="4" fill="#b44517"/><path d="M241.67,172.15 V171.74" stroke="#b44517"/><circle cx="241.67" cy="171.94" r="4" fill="#b44517"/><path d="M75.00,204.07 V203.66" stroke="#b44517"/><circle cx="75.00" cy="203.87" r="4" fill="#b44517"/><text x="75.00" y="290" text-anchor="middle">1/64</text><text x="241.67" y="290" text-anchor="middle">1/32</text><text x="408.33" y="290" text-anchor="middle">1/16</text><text x="575.00" y="290" text-anchor="middle">1/8</text><text x="335" y="327" text-anchor="middle">Time step h</text><text x="17" y="164" transform="rotate(-90 17 164)" text-anchor="middle">Terminal RMS error (state units)</text><text x="82" y="52">Blue: analytic; orange: MC +/- 2 estimated SE</text><text x="30" y="269">2^-10</text><text x="35" y="79">2^-4</text></g></svg>
