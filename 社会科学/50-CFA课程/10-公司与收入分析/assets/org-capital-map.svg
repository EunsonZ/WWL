<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="430" viewBox="0 0 1080 430">
<style>text{font-family:"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#172033}.title{font-size:25px;font-weight:700}.head{font-size:18px;font-weight:700}.body{font-size:15px}.small{font-size:13px}.line{stroke:#506680;stroke-width:2;fill:none}.box{fill:#eef4fb;stroke:#2f5d8a;stroke-width:2}.accent{fill:#e9f7ef;stroke:#2b7a4b;stroke-width:2}.warn{fill:#fff3e8;stroke:#b65d18;stroke-width:2}</style>
<rect width="1080" height="430" fill="#ffffff"/>
<text x="35" y="45" class="title">组织与所有权改变融资路径，也改变投资者能观察到什么</text><rect x="40" y="105" width="310" height="225" rx="14" class="warn"/><text x="58" y="145" class="head">独资 / 普通合伙</text><text x="58" y="188" class="body">所有者与经营靠得近</text><text x="58" y="230" class="body">责任、税和存续依本地法</text><text x="58" y="272" class="body">融资多受个人资源约束</text><rect x="385" y="105" width="310" height="225" rx="14" class="box"/><text x="403" y="145" class="head">私人有限责任公司</text><text x="403" y="188" class="body">公司与所有者分离</text><text x="403" y="230" class="body">股权转让与披露通常受限</text><text x="403" y="272" class="body">可引入私募债股资本</text><rect x="730" y="105" width="310" height="225" rx="14" class="accent"/><text x="748" y="145" class="head">公众有限责任公司</text><text x="748" y="188" class="body">法律形式不等于已上市</text><text x="748" y="230" class="body">公开交易时披露/监督增加</text><text x="748" y="272" class="body">上市证券通常更有流动性</text><path d="M350 215 L375 215" class="line"/><path d="M695 215 L720 215" class="line"/><text x="40" y="385" class="body">比较顺序：适用法域 → 责任与控制 → 税和披露 → 证券流动性 → 未来资本需求；名称本身不替代合同与法律核对。</text>
</svg>
