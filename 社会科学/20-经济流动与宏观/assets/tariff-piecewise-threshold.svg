<svg xmlns="http://www.w3.org/2000/svg" width="840" height="410" viewBox="0 0 840 410" role="img" aria-labelledby="title desc">
  <title id="title">Small-country tariff: the import cutoff at t equals 20</title>
  <desc id="desc">Three panels show price rising from 40 to 60 then flat, imports declining from 40 to zero then flat, and tariff revenue rising then returning to zero at the self-sufficiency threshold.</desc>
  <style>text{font-family:Arial Unicode MS,Hiragino Sans GB,sans-serif;fill:#1f2937}.axis{stroke:#334155;stroke-width:2}.grid{stroke:#cbd5e1;stroke-width:1}.curve{fill:none;stroke:#0f766e;stroke-width:4}.rev{fill:none;stroke:#b45309;stroke-width:4}.cut{stroke:#dc2626;stroke-width:2;stroke-dasharray:6 4}.label{font-size:15px}.small{font-size:13px}.panel{fill:#f8fafc;stroke:#94a3b8}</style>
  <text x="36" y="28" class="label">D=100−P, S=P−20, world price=40; threshold t=20</text>
  <g transform="translate(35,55)"><rect class="panel" width="235" height="295"/><text x="80" y="24" class="label">price P</text><path class="axis" d="M35 250H215M35 250V50"/><path class="grid" d="M35 150H215M35 50H215"/><path class="curve" d="M35 150L125 50L215 50"/><path class="cut" d="M125 250V45"/><text x="116" y="270" class="small">t=20</text><text x="5" y="154" class="small">40</text><text x="5" y="54" class="small">60</text><text x="175" y="278" class="small">tariff t</text></g>
  <g transform="translate(302,55)"><rect class="panel" width="235" height="295"/><text x="75" y="24" class="label">imports M</text><path class="axis" d="M35 250H215M35 250V50"/><path class="grid" d="M35 50H215"/><path class="curve" d="M35 50L125 250L215 250"/><path class="cut" d="M125 250V45"/><text x="116" y="270" class="small">t=20</text><text x="4" y="54" class="small">40</text><text x="22" y="254" class="small">0</text><text x="175" y="278" class="small">tariff t</text></g>
  <g transform="translate(569,55)"><rect class="panel" width="235" height="295"/><text x="50" y="24" class="label">revenue t·M</text><path class="axis" d="M35 250H215M35 250V50"/><path class="grid" d="M35 50H215"/><path class="rev" d="M35 250Q80 50 125 250L215 250"/><path class="cut" d="M125 250V45"/><text x="116" y="270" class="small">t=20</text><text x="22" y="254" class="small">0</text><text x="175" y="278" class="small">tariff t</text></g>
  <text x="36" y="385" class="small">For t≥20: P=60, M=0, and revenue=0. Curves are the stated teaching model, not empirical policy forecasts.</text>
</svg>
