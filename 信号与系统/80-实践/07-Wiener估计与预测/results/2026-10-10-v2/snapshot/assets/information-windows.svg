<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 590" role="img" aria-labelledby="title desc">
  <title id="title">估计同一 s[n] 时，过去与未来读数何时可用</title>
  <desc id="desc">横轴是采样时刻，蓝色窗口表示到 n 时已知的观测，橙色表示尚未到来的观测。当前、两样本和因果无限历史在 n 可输出；三样本平滑要等到 n 加一；双边无限解是理想投影，有限截断另有延迟与尾误差。表中均方误差仅为指定 AR 一阶与独立白测量噪声的解析结果，单位伏平方，不是实验值。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#334155"/></marker>
  </defs>
  <rect width="1040" height="590" fill="#f8fafc"/>
  <g font-family="sans-serif" fill="#0f172a">
    <text x="32" y="40" font-size="24" font-weight="bold">信息窗口改变了可达到的误差，也改变了输出时刻</text>
    <text x="32" y="71" font-size="16">固定模型：s[n] = 0.5 s[n−1] + q[n]；Var(s)=Var(v)=1 V²；x=s+v</text>
    <path d="M300 126 H890" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M630 103 V502" stroke="#64748b" stroke-dasharray="5 5"/>
    <text x="316" y="110" font-size="16">更早过去</text><text x="508" y="110" font-size="16">n−1</text>
    <text x="620" y="100" font-size="16">n</text><text x="725" y="110" font-size="16">n+1</text><text x="835" y="110" font-size="16">未来</text>
    <text x="34" y="169" font-size="17">当前一抽头</text><rect x="614" y="145" width="32" height="33" rx="5" fill="#2563eb"/>
    <text x="790" y="166" font-size="16">MSE = 1/2 V²</text><text x="34" y="193" font-size="14">在 n 输出</text>
    <text x="34" y="239" font-size="17">当前 + 过去一拍</text><rect x="504" y="215" width="142" height="33" rx="5" fill="#2563eb"/>
    <text x="790" y="236" font-size="16">MSE = 7/15 V²</text><text x="34" y="263" font-size="14">在 n 输出</text>
    <text x="34" y="309" font-size="17">因果无限历史</text><rect x="300" y="285" width="346" height="33" rx="5" fill="#2563eb"/>
    <text x="311" y="308" font-size="17" fill="white">← …</text><text x="790" y="306" font-size="16">MSE = 2√3−3 V²</text>
    <text x="34" y="333" font-size="14">在 n 输出；稳态投影</text>
    <text x="34" y="379" font-size="17">过去 + 当前 + 未来一拍</text><rect x="504" y="355" width="126" height="33" rx="5" fill="#2563eb"/>
    <rect x="630" y="355" width="126" height="33" rx="5" fill="#d97706"/>
    <text x="790" y="376" font-size="16">MSE = 7/16 V²</text><text x="34" y="403" font-size="14">等到 n+1 才输出 s[n] 的估计</text>
    <text x="34" y="449" font-size="17">双边无限理想投影</text><rect x="300" y="425" width="330" height="33" rx="5" fill="#2563eb"/>
    <rect x="630" y="425" width="126" height="33" rx="5" fill="#d97706"/>
    <text x="311" y="448" font-size="17" fill="white">← …</text><text x="707" y="448" font-size="17" fill="white">… →</text>
    <text x="790" y="446" font-size="16">MSE = √3/4 V²</text><text x="34" y="473" font-size="14">有限 radius L 截断需 L 拍延迟；正文另给尾界</text>
    <rect x="34" y="519" width="20" height="20" rx="3" fill="#2563eb"/><text x="65" y="535" font-size="16">到 n 已知</text>
    <rect x="225" y="519" width="20" height="20" rx="3" fill="#d97706"/><text x="256" y="535" font-size="16">到 n 尚未知</text>
    <text x="34" y="569" font-size="15">同一真值、同一统计模型；橙色样本带来的收益不能当成零延迟实时算法的收益。</text>
  </g>
</svg>
