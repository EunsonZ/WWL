<text x="35" y="45" class="title">同为收入200：资本占用不同，ROIC与增长桥就不同</text><text x="65" y="95" class="head">自有产能</text><rect x="65" y="137.5" width="110" height="187.5" fill="#2f5d8a" opacity=".78"/><text x="65" y="350" class="body">平均投入资本 150</text><text x="220" y="145" class="body">NOPAT 30.0</text><text x="220" y="180" class="body">ROIC 20.00%</text><text x="220" y="215" class="body">净再投资 20.0</text><text x="220" y="250" class="body">ROIIC 12.50%</text><text x="220" y="285" class="body">下一期增长 8.33%</text><text x="560" y="95" class="head">合作网络</text><rect x="560" y="253.8" width="110" height="71.2" fill="#2b7a4b" opacity=".78"/><text x="560" y="350" class="body">平均投入资本 57</text><text x="715" y="145" class="body">NOPAT 24.0</text><text x="715" y="180" class="body">ROIC 42.11%</text><text x="715" y="215" class="body">净再投资 6.0</text><text x="715" y="250" class="body">ROIIC 40.00%</text><text x="715" y="285" class="body">下一期增长 10.00%</text><text x="65" y="402" class="body">增长恒等桥（本例）：净再投资/NOPAT × ΔNOPAT/净再投资 = ΔNOPAT/NOPAT；它不是永续预测。</text>
