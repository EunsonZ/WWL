<svg xmlns="http://www.w3.org/2000/svg" width="425" height="850" viewBox="0 0 425 850" role="img">
  <title>P-04：科举的证据链与竞争解释</title>
  <desc>纵向窄图将考试参与与低阶资格、高阶通过、实际任官、地方教育家族与组织资产分开。蓝色实线表示来源直接支持的制度描述或观察范围；橙色虚线表示仍待比较检验的机制推论。底部列出分期、区域、家世资源、配额、战争与其他入仕通道等竞争解释。</desc>
  <rect width="425" height="850" fill="#fbfaf7"/>
  <g font-family="PingFang SC, Noto Sans CJK SC, Hiragino Sans GB, sans-serif" fill="#1f2937">
    <text x="212" y="32" text-anchor="middle" font-size="21" font-weight="700">P-04：不要把四个关口混成一个结果</text>
    <text x="212" y="58" text-anchor="middle" font-size="16">蓝实线＝来源支持范围；橙虚线＝待检验机制</text>
    <g fill="#e6f0f5" stroke="#416a83" stroke-width="2"><rect x="58" y="88" width="309" height="76" rx="12"/><rect x="58" y="234" width="309" height="76" rx="12"/><rect x="58" y="380" width="309" height="76" rx="12"/><rect x="58" y="526" width="309" height="76" rx="12"/></g>
    <g text-anchor="middle" font-size="18"><text x="212" y="120">1. 参加与低阶资格</text><text x="212" y="147" font-size="16">谁能读书、报名、取得生员等资格？</text><text x="212" y="266">2. 高阶通过</text><text x="212" y="293" font-size="16">中举／进士：配额、区域与时代会改变机会</text><text x="212" y="412">3. 实际任官</text><text x="212" y="439" font-size="16">职位、出口与其他入仕通道不能省略</text><text x="212" y="558">4. 地方组织资产</text><text x="212" y="585" font-size="16">书院、家族、庙宇：还要问权利与继承</text></g>
    <g stroke="#416a83" stroke-width="3" fill="none"><path d="M212 164V234"/><path d="M212 310V380"/><path d="M212 456V526"/></g>
    <g stroke="#b45309" stroke-width="2.5" stroke-dasharray="8 6" fill="none"><path d="M367 272C414 330 414 510 367 564"/><path d="M58 126C11 250 11 480 58 564"/></g>
    <text x="212" y="639" text-anchor="middle" font-size="17" fill="#92400e">虚线假说：国家资格集中怎样改变精英组织投资？</text>
    <text x="212" y="665" text-anchor="middle" font-size="16" fill="#92400e">须按隋唐／宋以后、地区与资产权利重选证据</text>
    <rect x="26" y="704" width="373" height="112" rx="12" fill="#f8e7d2" stroke="#b45309" stroke-width="1.5"/>
    <text x="212" y="735" text-anchor="middle" font-size="18">竞争解释与反例入口</text><text x="212" y="763" text-anchor="middle" font-size="16">家世与教育资源 · 地方配额与学校 · 商业化</text><text x="212" y="789" text-anchor="middle" font-size="16">战争与政权转换 · 恩荫／荐举等入仕通道</text>
  </g>
</svg>
