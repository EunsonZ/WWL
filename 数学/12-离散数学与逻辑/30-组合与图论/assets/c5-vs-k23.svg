<circle cx="815.00" cy="85.00" r="24" fill="#ffe1bb" stroke="#222" stroke-width="2"/>
<text x="815.00" y="90.00" text-anchor="middle" font-size="16" font-family="sans-serif">2:B</text>
<circle cx="815.00" cy="185.00" r="24" fill="#ffe1bb" stroke="#222" stroke-width="2"/>
<text x="815.00" y="190.00" text-anchor="middle" font-size="16" font-family="sans-serif">3:B</text>
<circle cx="815.00" cy="285.00" r="24" fill="#ffe1bb" stroke="#222" stroke-width="2"/>
