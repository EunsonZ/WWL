<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 470"><style>.title{font:700 29px -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif;fill:#152033}.head{font:700 20px -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif;fill:#152033}.body{font:16px -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif;fill:#243047}.small{font:14px -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif;fill:#3f4d63}.line{stroke:#52677f;stroke-width:2;fill:none}</style><rect width="100%" height="100%" fill="#ffffff"/><text x="38" y="50" class="title">同三只股票，不同加权方法回答不同问题</text><rect x="38" y="120" width="250" height="235" rx="15" fill="#eaf2fb" stroke="#49647d" stroke-width="2"/><text x="56" y="160" class="head">拆股校正</text><text x="56" y="202" class="body">A: 60 → 30（2拆1）</text><text x="56" y="238" class="body">指数基点 100</text><text x="56" y="274" class="body">除数 1 → 0.7</text><path d="M292 238 L308 238" class="line"/><path d="M302 232 L308 238 L302 244" class="line"/><rect x="312" y="120" width="250" height="235" rx="15" fill="#f6efe5" stroke="#49647d" stroke-width="2"/><text x="330" y="160" class="head">收盘价格回报</text><text x="330" y="202" class="body">A +10%</text><text x="330" y="238" class="body">B −10%</text><text x="330" y="274" class="body">C +10%</text><path d="M566 238 L582 238" class="line"/><path d="M576 232 L582 238 L576 244" class="line"/><rect x="586" y="120" width="250" height="235" rx="15" fill="#e7f4ec" stroke="#49647d" stroke-width="2"/><text x="604" y="160" class="head">三种价格指数</text><text x="604" y="202" class="body">价格加权 1.4286%</text><text x="604" y="238" class="body">等权 3.3333%</text><text x="604" y="274" class="body">市值加权 2.9412%</text><path d="M840 238 L856 238" class="line"/><path d="M850 232 L856 238 L850 244" class="line"/><rect x="860" y="120" width="250" height="235" rx="15" fill="#f4ebf7" stroke="#49647d" stroke-width="2"/><text x="878" y="160" class="head">市值总回报</text><text x="878" y="202" class="body">股息总额 20 百万</text><text x="878" y="238" class="body">价格回报 2.9412%</text><text x="878" y="274" class="body">总回报 4.1176%</text><text x="38" y="420" class="small">除数只中和拆股等非市场价值事件；权重、样本、自由流通调整和再平衡仍会改变指数暴露。</text></svg>
