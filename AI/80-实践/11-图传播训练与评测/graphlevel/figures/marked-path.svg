ME canonical group.</text><text x="30" y="453" font-family="Arial,sans-serif" font-size="15" fill="#172b4d" text-anchor="start">They may illustrate a task, but must never be split into train and test as new entities.</text><text x="30" y="486" font-family="Arial,sans-serif" font-size="14" fill="#172b4d" text-anchor="start">No self loops. Node numbers are display labels; all three readouts ignore their order.</text></svg>
