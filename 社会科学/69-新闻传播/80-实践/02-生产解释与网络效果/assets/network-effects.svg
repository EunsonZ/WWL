<text x="705" y="208" font-size="19" fill="#b33d26">0</text>
<text x="820" y="208" font-size="19" fill="#182a3a">1/2</text>
<text x="935" y="208" font-size="19" fill="#182a3a">1/6</text>
<text x="1050" y="208" font-size="19" fill="#182a3a">1/3</text>
