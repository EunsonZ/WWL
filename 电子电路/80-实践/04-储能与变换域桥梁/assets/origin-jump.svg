<svg xmlns="http://www.w3.org/2000/svg" width="425" height="540" viewBox="0 0 425 540" role="img" aria-labelledby="title desc">
<title id="title">原点跳变及其广义导数面积</title><desc id="desc">协议演示x由0.4V跳到1V，普通右导数为0，原点导数冲激面积0.6V；箭头不表示实际有限高度冲激。</desc>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#222"/></marker></defs>
<rect width="425" height="540" style="fill:white;stroke:none"/>
<style>text{font-family:DejaVu Sans,sans-serif;fill:#151515;stroke:none} path,rect,circle{stroke:#222;stroke-width:1.7;fill:none} .point{fill:#222}</style>
<text x="18" y="26" font-size="16" text-anchor="start">Origin protocol: x- = 0.4 V; x+ = 1 V</text><path d="M54 184L398 184" marker-end="url(#arrow)"/><path d="M212 203L212 55" marker-end="url(#arrow)"/><path d="M54 139L212 139" stroke="#222"/><path d="M212 139L212 75" stroke="#222" stroke-dasharray="5 4"/><path d="M212 75L395 75" stroke="#222"/><text x="61" y="131" font-size="15" text-anchor="start">0.4 V</text><text x="329" y="64" font-size="15" text-anchor="start">1 V</text><text x="215" y="221" font-size="14" text-anchor="start">0</text><text x="393" y="203" font-size="13" text-anchor="start">time</text><text x="18" y="263" font-size="15" text-anchor="start">Right-side ordinary derivative = 0</text><text x="18" y="292" font-size="14" text-anchor="start">Generalized derivative adds 0.6 V * delta(t)</text><path d="M212 410L212 332" marker-end="url(#arrow)"/><path d="M70 410L396 410" stroke="#222"/><text x="226" y="365" font-size="15" text-anchor="start">area = 0.6 V</text><text x="24" y="448" font-size="14" text-anchor="start">Arrow denotes area, not a finite pulse height.</text><text x="24" y="480" font-size="16" text-anchor="start">L- derivative: s X - x- = 0.6 V</text><text x="24" y="512" font-size="16" text-anchor="start">L+ ordinary derivative: s X - x+ = 0</text></svg>