<svg xmlns="http://www.w3.org/2000/svg" width="425" height="718" viewBox="0 0 425 718"><rect width="425" height="718" fill="white"/><style>text{font:16px sans-serif;fill:#18232c}.title{font-weight:bold}.small{font-size:14px}.wire{stroke:#18232c;stroke-width:2;fill:none}.box{fill:#f2f5f7;stroke:#18232c;stroke-width:1.5}</style><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#18232c"/></marker></defs><text x="16" y="28" class="title">V42: photon charge and mechanical ports</text><rect class="box" x="16" y="48" width="393" height="100"/><text x="26" y="71" class="">850 nm, launch 100 uW; 10 dB loss</text><text x="26" y="95" class="">Detector plane: 10 uW; eta=.7 assumed</text><text x="26" y="119" class="">E=hc/lambda [J]; Phi=P/E [1/s]</text><text x="26" y="143" class="">q*eta*Phi = 4.798999 uA</text><path class="wire" d="M212 148L212 173" marker-end="url(#a)"/><rect class="box" x="16" y="180" width="393" height="76"/><text x="26" y="203" class="">TIA current node + CT 10 pF</text><text x="26" y="227" class="">RF 100 kohm / CF 1 pF; finite A</text><text x="26" y="251" class="">DC output -0.479995 V incl. dark current</text><text x="16" y="285" class="">Below: independent MEMS teaching object</text><rect class="box" x="16" y="305" width="393" height="76"/><text x="26" y="328" class="">base a [m/s2] -&gt; relative x [m]</text><text x="26" y="352" class="">m*xdd+b*xd+k*x = -m*a + F</text><text x="26" y="376" class="">f0 1 kHz; +1 g -&gt; x=-0.248405 um</text><path class="wire" d="M212 381L212 408" marker-end="url(#a)"/><rect class="box" x="16" y="413" width="393" height="100"/><text x="26" y="436" class="">Parallel plates: gap 2 um; area 4e-8 m2</text><text x="26" y="460" class="">C+/-=epsilon*A/(g-/+x) [F]</text><text x="26" y="484" class="">Delta C = -44.677765 fF at 1 g</text><text x="26" y="508" class="">Qp=0, high-Z: vp/Vc=x/g; no Cp</text><rect class="box" x="16" y="540" width="393" height="100"/><text x="26" y="563" class="">Separate cantilever: x_tip=+1 um</text><text x="26" y="587" class="">L200 um, t2 um -&gt; strain 75 ustrain</text><text x="26" y="611" class="">GF100 (assumed) -&gt; delta=.0075</text><text x="26" y="635" class="">Vexc1 V, four-arm bridge -&gt; 7.5 mV</text><text x="16" y="670" class="">Keep units, geometry and port conditions</text><text x="16" y="695" class="small">Source values: formal F03/F04 CPU models</text></svg>
