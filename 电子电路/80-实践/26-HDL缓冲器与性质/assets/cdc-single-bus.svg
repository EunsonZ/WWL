<svg xmlns="http://www.w3.org/2000/svg" width="420" height="530" viewBox="0 0 420 530"><rect width="420" height="530" fill="white"/><g font-family="Arial, sans-serif" fill="#15263a" stroke="none"><text x="18" y="28" font-size="16">07  Single-bit CDC and torn two-bit bus</text><text x="18" y="49" font-size="12">Concept / CPU prediction — not a tool waveform</text><text x="88" y="123" font-size="14">FF1</text><text x="85" y="146" font-size="14">D</text><text x="165" y="146" font-size="14">Q</text><text x="132" y="170" font-size="12">/RST</text><text x="278" y="123" font-size="14">FF2</text><text x="275" y="146" font-size="14">D</text><text x="355" y="146" font-size="14">Q</text><text x="322" y="170" font-size="12">/RST</text><text x="18" y="94" font-size="14">async level</text><text x="280" y="90" font-size="14">use only Q2</text><text x="18" y="184" font-size="12">local rst_n</text><text x="18" y="245" font-size="14">clk_B → both triangles; no FF1 fanout</text><text x="18" y="278" font-size="14">FF1 may go metastable; extra settling time</text><text x="18" y="301" font-size="14">Probability reduced; no deterministic 2-cycle bound</text><text x="18" y="342" font-size="14">Two independent bit chains do not make a word.</text><text x="18" y="367" font-size="14">Source 01 → 10; skewed capture can be 00 / 11</text><text x="18" y="405" font-size="14">Atomic bus: hold data, synchronize request,</text><text x="18" y="430" font-size="14">capture after stability margin, return ack.</text><text x="18" y="470" font-size="14">Narrow pulses need toggle / handshake / FIFO.</text><text x="18" y="500" font-size="14">CDC hardware not delivered by this single-clock RTL.</text></g><g fill="none" stroke="#15263a" stroke-width="1.8"><rect x="80" y="100" width="110" height="76"/><polyline points="108,176 108,166 115,171 108,176"/><rect x="270" y="100" width="110" height="76"/><polyline points="298,176 298,166 305,171 298,176"/><polyline points="18,142 80,142"/><polyline points="190,142 270,142"/><polyline points="380,142 402,142"/><polyline points="108,176 108,215 298,215 298,176"/><polyline points="150,176 150,190 340,190 340,176"/><polyline points="18,190 150,190"/><circle cx="150" cy="190" r="3" fill="#15263a"/><polyline points="18,215 108,215"/><circle cx="108" cy="215" r="3" fill="#15263a"/></g></svg>