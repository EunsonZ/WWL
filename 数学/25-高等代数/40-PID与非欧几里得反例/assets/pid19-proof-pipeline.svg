<svg xmlns="http://www.w3.org/2000/svg" width="760" height="390" viewBox="0 0 760 390" role="img" aria-labelledby="title desc">
  <title id="title">从任意理想类到 PID 的证明链</title>
  <desc id="desc">任取理想类，经 Minkowski 界得到范数至多二的整理想代表。模二无根排除范数二，范数一迫使代表为全环，因此类群平凡并得到 PID。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <style>
      .box{stroke-width:1.8;rx:13}
      .arrow{stroke:#334155;stroke-width:2.2;fill:none;marker-end:url(#arrow)}
      .head{font:700 17px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0f172a}
      .body{font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#334155}
      .note{font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#475569}
    </style>
  </defs>
  <rect width="760" height="390" rx="16" fill="#f8fafc"/>
  <text x="28" y="34" class="head">关键量词：先压缩任意理想类，再做有限排除</text>
  <rect x="35" y="72" width="190" height="78" class="box" fill="#eef2ff" stroke="#818cf8"/>
  <text x="130" y="101" text-anchor="middle" class="head">任取理想类 C</text>
  <text x="130" y="127" text-anchor="middle" class="body">由分式理想 A 表示</text>
  <path d="M225 111 H276" class="arrow"/>
  <rect x="278" y="62" width="205" height="98" class="box" fill="#ecfeff" stroke="#22d3ee"/>
  <text x="380" y="91" text-anchor="middle" class="head">Minkowski 类界</text>
  <text x="380" y="117" text-anchor="middle" class="body">J=αA ⊂ O<tspan baseline-shift="sub" font-size="10">K</tspan></text>
  <text x="380" y="141" text-anchor="middle" class="body">N(J)≤(2/π)√19&lt;3</text>
  <path d="M483 111 H534" class="arrow"/>
  <rect x="536" y="72" width="190" height="78" class="box" fill="#f0fdf4" stroke="#4ade80"/>
  <text x="631" y="101" text-anchor="middle" class="head">N(J)=1 或 2</text>
  <text x="631" y="127" text-anchor="middle" class="body">理想范数是正整数</text>
  <path d="M631 150 V205" class="arrow"/>
  <rect x="455" y="207" width="271" height="88" class="box" fill="#fff7ed" stroke="#fb923c"/>
  <text x="590" y="237" text-anchor="middle" class="head">排除 N(J)=2</text>
  <text x="590" y="263" text-anchor="middle" class="body">O<tspan baseline-shift="sub" font-size="10">K</tspan>/J≅F<tspan baseline-shift="sub" font-size="10">2</tspan> 会给</text>
  <text x="590" y="283" text-anchor="middle" class="body">x²+x+1=0；但 F<tspan baseline-shift="sub" font-size="10">2</tspan> 中无根</text>
  <path d="M455 251 H386" class="arrow"/>
  <rect x="184" y="207" width="200" height="88" class="box" fill="#fef2f2" stroke="#f87171"/>
  <text x="284" y="237" text-anchor="middle" class="head">只能 N(J)=1</text>
  <text x="284" y="263" text-anchor="middle" class="body">[O<tspan baseline-shift="sub" font-size="10">K</tspan>:J]=1</text>
  <text x="284" y="283" text-anchor="middle" class="body">所以 J=O<tspan baseline-shift="sub" font-size="10">K</tspan></text>
  <path d="M184 251 H113 V319 H185" class="arrow"/>
  <rect x="187" y="312" width="386" height="55" class="box" fill="#1d4ed8" stroke="#1e40af"/>
  <text x="380" y="346" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="18" font-weight="700" fill="#fff">C 是单位类；C 任意 ⇒ Cl(O<tspan baseline-shift="sub" font-size="11">K</tspan>)=1 ⇒ PID</text>
  <text x="30" y="382" class="note">有限无根检查只负责橙框；覆盖“任意 C”的是 Minkowski 类界。</text>
</svg>

