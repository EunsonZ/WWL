<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
  <title id="title">三期现金流与贴现时间线</title>
  <desc id="desc">从时点零到时点三的时间线。时点零向下箭头表示投入一百，随后三个向上箭头表示每年末收到二十、二十和一百二十。虚线箭头表示按每年百分之五折回时点零。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#405a7a"/></marker>
    <style>
      .axis{stroke:#405a7a;stroke-width:3}.tick{stroke:#405a7a;stroke-width:2}.in{stroke:#16856b;stroke-width:4;marker-end:url(#arrow)}.out{stroke:#b64b4b;stroke-width:4;marker-end:url(#arrow)}.disc{stroke:#7a6aa8;stroke-width:2;stroke-dasharray:7 7;marker-end:url(#arrow)}
      .label{font:20px -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif;fill:#243447}.small{font-size:17px}.box{fill:#f7f9fc;stroke:#c8d2df;stroke-width:1.5}
    </style>
  </defs>
  <rect width="960" height="360" fill="#ffffff"/>
  <text x="40" y="45" class="label">现金流时点固定后，才能比较与贴现</text>
  <line x1="120" y1="190" x2="850" y2="190" class="axis" marker-end="url(#arrow)"/>
  <g class="label small" text-anchor="middle">
    <line x1="160" y1="175" x2="160" y2="205" class="tick"/><text x="160" y="232">t=0</text>
    <line x1="370" y1="175" x2="370" y2="205" class="tick"/><text x="370" y="232">t=1 年末</text>
    <line x1="580" y1="175" x2="580" y2="205" class="tick"/><text x="580" y="232">t=2 年末</text>
    <line x1="790" y1="175" x2="790" y2="205" class="tick"/><text x="790" y="232">t=3 年末</text>
  </g>
  <line x1="160" y1="145" x2="160" y2="282" class="out"/><text x="176" y="294" class="label small" fill="#b64b4b">投入 −100</text>
  <line x1="370" y1="182" x2="370" y2="110" class="in"/><text x="370" y="91" class="label small" text-anchor="middle">收到 +20</text>
  <line x1="580" y1="182" x2="580" y2="110" class="in"/><text x="580" y="91" class="label small" text-anchor="middle">收到 +20</text>
  <line x1="790" y1="182" x2="790" y2="110" class="in"/><text x="790" y="91" class="label small" text-anchor="middle">收到 +120</text>
  <path d="M760 130 C610 300,350 310,190 220" fill="none" class="disc"/>
  <rect x="330" y="286" width="360" height="46" rx="8" class="box"/><text x="510" y="316" class="label small" text-anchor="middle">虚线：按每年有效 5% 折回 t=0</text>
</svg>

