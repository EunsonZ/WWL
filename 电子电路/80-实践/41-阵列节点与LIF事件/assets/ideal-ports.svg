<svg xmlns="http://www.w3.org/2000/svg" width="360" height="550" viewBox="0 0 360 550"><rect width="360" height="550" fill="white"/><style>text{font:14px sans-serif;fill:#18232c}.wire{fill:none;stroke:#18232c;stroke-width:2}.box{fill:#eef4f8;stroke:#18232c;stroke-width:1.5}.node{fill:#18232c}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#18232c"/></marker></defs><text x="16" y="26">Ideal MVM: voltage -> conductance -> current</text><text x="16" y="53">All voltages relative to shared return 0 V</text><rect class="box" x="25" y="90" width="310" height="55"/><text x="30" y="122.5">DAC row drivers: U1=.1 V, U2=.2 V</text><path class="wire" d="M100 145L100 178" marker-end="url(#arrow)"/><path class="wire" d="M250 145L250 178" marker-end="url(#arrow)"/><rect class="box" x="25" y="180" width="310" height="90"/><text x="30" y="230.0">G [uS] = [10 20; 30 40]</text><text x="40" y="248">Rows input; columns output; no negative G</text><path class="wire" d="M100 270L100 310" marker-end="url(#arrow)"/><path class="wire" d="M250 270L250 310" marker-end="url(#arrow)"/><rect class="box" x="25" y="315" width="310" height="60"/><text x="30" y="350.0">I1=7 uA; I2=10 uA into 0-V clamps</text><path class="wire" d="M100 375L100 383"/><path class="wire" d="M91 383L109 383"/><path class="wire" d="M94 387L106 387"/><text x="112" y="387">0 V</text><path class="wire" d="M250 375L250 383"/><path class="wire" d="M241 383L259 383"/><path class="wire" d="M244 387L256 387"/><text x="262" y="387">0 V</text><text x="16" y="432">Ideal rows constant; columns clamped at 0 V</text><text x="16" y="457">Cell: Iij=Gij Ui. Column KCL: Ij=sum_i Iij</text><text x="16" y="491">Drivers and real readout need supply rails</text><text x="16" y="516">VDD/VSS energy is outside this resistor model</text></svg>