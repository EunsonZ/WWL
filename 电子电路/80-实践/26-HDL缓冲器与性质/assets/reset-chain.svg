<svg xmlns="http://www.w3.org/2000/svg" width="420" height="500" viewBox="0 0 420 500"><rect width="420" height="500" fill="white"/><g font-family="Arial, sans-serif" fill="#15263a" stroke="none"><text x="18" y="28" font-size="16">09  Async assertion, per-domain sync release</text><text x="18" y="49" font-size="12">Concept / CPU prediction — not a tool waveform</text><text x="93" y="133" font-size="14">sync1</text><text x="90" y="156" font-size="14">D</text><text x="170" y="156" font-size="14">Q</text><text x="137" y="180" font-size="12">/RST</text><text x="278" y="133" font-size="14">sync2</text><text x="275" y="156" font-size="14">D</text><text x="355" y="156" font-size="14">Q</text><text x="322" y="180" font-size="12">/RST</text><text x="18" y="136" font-size="14">1&#x27;b1</text><text x="265" y="95" font-size="14">local rst_n=Q2</text><text x="18" y="259" font-size="14">clk_domain → both CLK pins</text><text x="18" y="199" font-size="14">rst_n</text><text x="18" y="321" font-size="14">external rst_n → both asynchronous /RST pins</text><text x="18" y="358" font-size="14">Assert low: both Q immediately reset to 0.</text><text x="18" y="383" font-size="14">Release high: shift 1, then 1 on safe clock edges.</text><text x="18" y="410" font-size="14">Only Q2 resets downstream local registers.</text><text x="18" y="439" font-size="14">Recovery/removal, placement and MTBF still apply.</text><text x="18" y="470" font-size="14">Separate chain for each unrelated clock domain.</text></g><g fill="none" stroke="#15263a" stroke-width="1.8"><rect x="85" y="110" width="110" height="76"/><polyline points="113,186 113,176 120,181 113,186"/><rect x="270" y="110" width="110" height="76"/><polyline points="298,186 298,176 305,181 298,186"/><polyline points="18,152 85,152"/><polyline points="195,152 270,152"/><polyline points="380,152 404,152"/><polyline points="113,186 113,235 298,235 298,186"/><polyline points="155,186 155,205 340,205 340,186"/><polyline points="18,205 155,205"/><circle cx="155" cy="205" r="3" fill="#15263a"/><polyline points="18,235 113,235"/><circle cx="113" cy="235" r="3" fill="#15263a"/></g></svg>