<svg xmlns="http://www.w3.org/2000/svg" width="425" height="360" viewBox="0 0 425 360"><rect width="425" height="360" fill="white"/><style>text{font-family:DejaVu Sans,sans-serif;font-size:12px;fill:#111} .w{stroke:#111;stroke-width:1.8;fill:none} .p{fill:white;stroke:#111;stroke-width:1.8}</style><text x="15" y="22" style="font-size:15px;font-weight:bold">ODE, hold and one-sample delay</text><rect class="p" x="20" y="74" width="140" height="43"/><text x="27" y="99.5">held command d[k]</text><rect class="p" x="230" y="74" width="165" height="43"/><text x="237" y="99.5">actuator a: tau=5ms</text><path class="w" d="M160 95 L230 95"/><path class="w" d="M315 117 L205 117"/><path class="w" d="M205 117 L205 163"/><path class="w" d="M205 163 L250 163"/><path class="w" d="M250 163 L258 163"/><path class="w" d="M258 163 l5 -5 l6 10 l6 -10 l6 10 l6 -10 l5 5"/><path class="w" d="M292 163 L295 163"/><path class="w" d="M295 163 L315 163"/><circle cx="315" cy="163" r="3" fill="#111"/><text x="233" y="154">R=20k</text><path class="w" d="M315 163 L315 195"/><path class="w" d="M304 195 L326 195"/><path class="w" d="M304 201 L326 201"/><path class="w" d="M315 201 L315 209"/><path class="w" d="M306 209 L324 209"/><path class="w" d="M309 213 L321 213"/><path class="w" d="M312 217 L318 217"/><text x="331" y="198">C=1uF</text><text x="331" y="166">x [V]</text><path class="w" d="M315 163 L390 163"/><path class="w" d="M390 163 L390 259"/><rect class="p" x="230" y="240" width="165" height="38"/><text x="237" y="263.0">sample: x[k]</text><path class="w" d="M230 259 L185 259"/><rect class="p" x="20" y="240" width="165" height="38"/><text x="27" y="263.0">u[k]=-K*x[k]</text><path class="w" d="M92 240 L92 185"/><rect class="p" x="20" y="144" width="140" height="41"/><text x="27" y="168.5">one tick delay</text><path class="w" d="M92 144 L92 117"/><text x="17" y="320">x_dot=(a-x)/taup; a_dot=(d-a)/taua</text><text x="17" y="340">All states are deviations about 1.65 V.</text></svg>