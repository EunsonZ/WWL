<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 770" role="img">
<title>E＝人民币/美元；从货物追到结算资产</title>
<desc>五步教学流程，路径箭头表示阅读顺序；数字是正文的同一虚构算例。</desc>
<rect width="480" height="770" fill="#f5f7fb"/>
<g font-family="PingFang SC,Microsoft YaHei,sans-serif">
<text x="20" y="38" font-size="21" fill="#142842">E＝人民币/美元；从货物追到结算资产</text>
<rect x="16" y="80" width="448" height="108" rx="12" fill="#ffffff" stroke="#456e9c" stroke-width="2"/>
<text x="30" y="111" font-size="20" fill="#163f6b">1. 货物100美元，E＝7</text>
<text x="30" y="142" font-size="18" fill="#27394b">中国居民进口企业取得货物700人民币</text>
<path d="M240 191v15l-5 -5m5 5l5 -5" fill="none" stroke="#456e9c" stroke-width="2"/>
<rect x="16" y="210" width="448" height="108" rx="12" fill="#ffffff" stroke="#456e9c" stroke-width="2"/>
<text x="30" y="241" font-size="20" fill="#163f6b">2. 支付既有外部存款</text>
<text x="30" y="272" font-size="18" fill="#27394b">对外国银行存款-100美元；没有另添购汇</text>
<path d="M240 321v15l-5 -5m5 5l5 -5" fill="none" stroke="#456e9c" stroke-width="2"/>
<rect x="16" y="340" width="448" height="108" rx="12" fill="#ffffff" stroke="#456e9c" stroke-width="2"/>
<text x="30" y="371" font-size="20" fill="#163f6b">3. 外国出口商收款</text>
<text x="30" y="402" font-size="18" fill="#27394b">本国银行存款＋100；银行负债在两客户间转移</text>
<path d="M240 451v15l-5 -5m5 5l5 -5" fill="none" stroke="#456e9c" stroke-width="2"/>
<rect x="16" y="470" width="448" height="108" rx="12" fill="#ffffff" stroke="#456e9c" stroke-width="2"/>
<text x="30" y="501" font-size="20" fill="#163f6b">4. 两国汇总</text>
<text x="30" y="532" font-size="18" fill="#27394b">中国CA＝FA＝-100；外国CA＝FA＝＋100</text>
<path d="M240 581v15l-5 -5m5 5l5 -5" fill="none" stroke="#456e9c" stroke-width="2"/>
<rect x="16" y="600" width="448" height="108" rx="12" fill="#ffffff" stroke="#456e9c" stroke-width="2"/>
<text x="30" y="631" font-size="20" fill="#163f6b">5. 持有存量与其他变化</text>
<text x="30" y="662" font-size="18" fill="#27394b">交易、汇率重估、价格重估分别连接期末IIP</text>
<text x="20" y="739" font-size="13" fill="#4c5c6c">虚构算例与最小路径；箭头表示阅读顺序。</text>
<text x="20" y="758" font-size="13" fill="#4c5c6c">条件与边界在正文；不代表完整制度或现实预测。</text>
</g></svg>
