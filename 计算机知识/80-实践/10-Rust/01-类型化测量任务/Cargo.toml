[package]
name = "wwl-measurement"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "Bounded typed measurement teaching component"
publish = false
include = ["Cargo.toml", "Cargo.lock", "README.md", "src/**", "tests/**", "fixtures/**", "ffi/**", "examples/**"]

[features]
default = []
threaded = []
fixed = []
ffi = ["fixed"]
async = ["threaded", "dep:tokio"]

[lib]
crate-type = ["rlib", "staticlib"]

[[example]]
name = "fixed"
required-features = ["fixed"]

[dependencies]
tokio = { version = "=1.52.3", optional = true, default-features = false, features = ["rt", "sync"] }

[[example]]
name = "async"
required-features = ["async"]
