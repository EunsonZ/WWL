<svg xmlns="http://www.w3.org/2000/svg" width="425" height="645" viewBox="0 0 425 645"><title>Placement and explicit coupling counterexample</title><desc>Functionzones over commonreference, noAGND/DGNDsplit; hypotheticalnewclock toOUTviaCx labelled. Original board contains noclock/switcher/ADC; coupling assumptionsdo not constitute physicalextraction.</desc><rect width="425" height="645" fill="white"/><g stroke="#111" stroke-width="2" fill="none"><text x="15" y="25" font-size="17">Function regions on same GND, not islands</text><rect x="25" y="80" width="375" height="245" fill="white"/><text x="30" y="207.5" font-size="15"></text><rect x="45" y="125" width="70" height="75" fill="white"/><text x="50" y="167.5" font-size="15">J1</text><rect x="130" y="125" width="100" height="75" fill="white"/><text x="135" y="167.5" font-size="15">R1/C1/R2</text><rect x="290" y="125" width="90" height="75" fill="white"/><text x="295" y="167.5" font-size="15">J2ADC</text><line x1="115" y1="160" x2="130" y2="160"/><line x1="230" y1="160" x2="290" y2="160"/><text x="160" y="105" font-size="13">sensitiveOUT</text><rect x="90" y="250" width="230" height="55" fill="white"/><text x="95" y="282.5" font-size="15">J3 supply /C2C3</text><text x="15" y="367" font-size="17">Counterexample: added clock crosses OUT</text><line x1="30" y1="420" x2="390" y2="420"/><text x="25" y="402" font-size="13">external fastclock</text><line x1="210" y1="420" x2="210" y2="448"/><line x1="198" y1="448" x2="222" y2="448"/><line x1="198" y1="456" x2="222" y2="456"/><line x1="210" y1="456" x2="210" y2="485"/><text x="232" y="457" font-size="13">Cx=1pF</text><line x1="90" y1="485" x2="335" y2="485"/><text x="90" y="515" font-size="15">OUT + C1=1u to reference</text><text x="15" y="555" font-size="15">3.3V edge -&gt;3.3pC -&gt;approx3.3uV</text><text x="15" y="587" font-size="15">Assumption, not extraction or measured noise</text><text x="15" y="619" font-size="15">No switcher/clock on original passiveboard</text></g><style>text{fill:#111;stroke:none;font-family:DejaVu Sans,sans-serif}</style></svg>