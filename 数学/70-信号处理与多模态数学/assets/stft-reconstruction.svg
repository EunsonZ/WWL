<svg xmlns="http://www.w3.org/2000/svg" width="480" height="480" viewBox="0 0 480 480">
<title>有限 STFT 的实际窗平方覆盖分母</title>
<desc>窗 [0, 0.5, 1, 0.5]、hop 2、记录索引 0 至 7。完整帧起点 0、2、4 留下首点未覆盖；显式补边界帧起点负 2、0、2、4、6 后，八个原始样本均可恢复。</desc>
<rect width="480" height="480" fill="#f8fafc"/>
<g font-family="PingFang SC, sans-serif" fill="#0f172a">
<text x="20" y="32" font-size="26" font-weight="600">有限 STFT：逐点覆盖</text>
<text x="20" y="61" font-size="23">D[n] = Σ w[n−s]²</text>
<text x="20" y="96" font-size="23" font-weight="600">完整帧：起点 0、2、4</text>
<path d="M 20 181 H 460" stroke="#475569" fill="none"/>
<rect x="30" y="181" width="35" height="0" fill="#b45309"/>
<circle cx="47.5" cy="181" r="5" fill="#dc2626"/>
<text x="47.5" y="174" text-anchor="middle" font-size="23">0</text>
<text x="47.5" y="206" text-anchor="middle" font-size="20">0</text>
<rect x="85" y="166.75" width="35" height="14.25" fill="#b45309"/>
<text x="102.5" y="159.75" text-anchor="middle" font-size="23">0.25</text>
<text x="102.5" y="206" text-anchor="middle" font-size="20">1</text>
<rect x="140" y="124" width="35" height="57" fill="#b45309"/>
<text x="157.5" y="117" text-anchor="middle" font-size="23">1</text>
<text x="157.5" y="206" text-anchor="middle" font-size="20">2</text>
<rect x="195" y="152.5" width="35" height="28.5" fill="#b45309"/>
<text x="212.5" y="145.5" text-anchor="middle" font-size="23">0.5</text>
<text x="212.5" y="206" text-anchor="middle" font-size="20">3</text>
<rect x="250" y="124" width="35" height="57" fill="#b45309"/>
<text x="267.5" y="117" text-anchor="middle" font-size="23">1</text>
<text x="267.5" y="206" text-anchor="middle" font-size="20">4</text>
<rect x="305" y="152.5" width="35" height="28.5" fill="#b45309"/>
<text x="322.5" y="145.5" text-anchor="middle" font-size="23">0.5</text>
<text x="322.5" y="206" text-anchor="middle" font-size="20">5</text>
<rect x="360" y="124" width="35" height="57" fill="#b45309"/>
<text x="377.5" y="117" text-anchor="middle" font-size="23">1</text>
<text x="377.5" y="206" text-anchor="middle" font-size="20">6</text>
<rect x="415" y="166.75" width="35" height="14.25" fill="#b45309"/>
<text x="432.5" y="159.75" text-anchor="middle" font-size="23">0.25</text>
<text x="432.5" y="206" text-anchor="middle" font-size="20">7</text>
<text x="20" y="235" font-size="23" fill="#b45309" font-weight="600">可恢复：1–7；第 0 点未知</text>
<text x="20" y="274" font-size="23" font-weight="600">补边界帧：−2、0、2、4、6</text>
<path d="M 20 359 H 460" stroke="#475569" fill="none"/>
<rect x="30" y="302" width="35" height="57" fill="#0f766e"/>
<text x="47.5" y="295" text-anchor="middle" font-size="23">1</text>
<text x="47.5" y="384" text-anchor="middle" font-size="20">0</text>
<rect x="85" y="330.5" width="35" height="28.5" fill="#0f766e"/>
<text x="102.5" y="323.5" text-anchor="middle" font-size="23">0.5</text>
<text x="102.5" y="384" text-anchor="middle" font-size="20">1</text>
<rect x="140" y="302" width="35" height="57" fill="#0f766e"/>
<text x="157.5" y="295" text-anchor="middle" font-size="23">1</text>
<text x="157.5" y="384" text-anchor="middle" font-size="20">2</text>
<rect x="195" y="330.5" width="35" height="28.5" fill="#0f766e"/>
<text x="212.5" y="323.5" text-anchor="middle" font-size="23">0.5</text>
<text x="212.5" y="384" text-anchor="middle" font-size="20">3</text>
<rect x="250" y="302" width="35" height="57" fill="#0f766e"/>
<text x="267.5" y="295" text-anchor="middle" font-size="23">1</text>
<text x="267.5" y="384" text-anchor="middle" font-size="20">4</text>
<rect x="305" y="330.5" width="35" height="28.5" fill="#0f766e"/>
<text x="322.5" y="323.5" text-anchor="middle" font-size="23">0.5</text>
<text x="322.5" y="384" text-anchor="middle" font-size="20">5</text>
<rect x="360" y="302" width="35" height="57" fill="#0f766e"/>
<text x="377.5" y="295" text-anchor="middle" font-size="23">1</text>
<text x="377.5" y="384" text-anchor="middle" font-size="20">6</text>
<rect x="415" y="330.5" width="35" height="28.5" fill="#0f766e"/>
<text x="432.5" y="323.5" text-anchor="middle" font-size="23">0.5</text>
<text x="432.5" y="384" text-anchor="middle" font-size="20">7</text>
<text x="20" y="413" font-size="23" fill="#0f766e" font-weight="600">零延拓后：原始 0–7 点均可恢复</text>
<text x="20" y="438" font-size="20">横轴：原始索引 n；柱上数字：D[n]</text>
<text x="20" y="465" font-size="20">窗 [0, ½, 1, ½]，hop = 2</text>
</g>
</svg>
