<circle cx="85" cy="150" r="24" fill="#e4eff4" stroke="#167d9a" stroke-width="3"/>
<text x="79" y="157" font-size="21" fill="#182a3a">0</text>
<circle cx="290" cy="150" r="24" fill="#e4eff4" stroke="#167d9a" stroke-width="3"/>
<text x="284" y="157" font-size="21" fill="#182a3a">1</text>
<circle cx="290" cy="330" r="24" fill="#e4eff4" stroke="#167d9a" stroke-width="3"/>
<text x="284" y="337" font-size="21" fill="#182a3a">2</text>
<circle cx="85" cy="330" r="24" fill="#e4eff4" stroke="#167d9a" stroke-width="3"/>
<text x="79" y="337" font-size="21" fill="#182a3a">3</text>
<text x="38" y="405" font-size="17" fill="#182a3a">16 assignments, each probability 1/16</text>
<text x="420" y="117" font-size="20" fill="#182a3a">Condition (z,e)</text>
<text x="690" y="117" font-size="18" fill="#182a3a">(0, 0)</text>
<text x="805" y="117" font-size="18" fill="#182a3a">(0, 1)</text>
<text x="920" y="117" font-size="18" fill="#182a3a">(1, 0)</text>
<text x="1035" y="117" font-size="18" fill="#182a3a">(1, 1)</text>
<text x="420" y="163" font-size="17" fill="#182a3a">P(exposure), Bernoulli</text>
<text x="705" y="163" font-size="19" fill="#182a3a">1/8</text>
<text x="820" y="163" font-size="19" fill="#182a3a">3/8</text>
<text x="935" y="163" font-size="19" fill="#182a3a">1/8</text>
<text x="1050" y="163" font-size="19" fill="#182a3a">3/8</text>
