<svg xmlns="http://www.w3.org/2000/svg" width="425" height="620" viewBox="0 0 425 620" role="img" aria-labelledby="title desc"><title id="title">位置读数通过交叉协方差修正速度并降低后验不确定性</title><desc id="desc">二维状态的横轴是位置p（米）、纵轴是速度v（米每秒）。位置传感器读数为y等于p加epsilon，R为epsilon的方差。预测协方差的倾斜椭圆表示位置和速度相关，位置创新经两分量Kalman增益修正两者；后验椭圆较小，表示不确定性下降。偏置和延迟需要另建模型。</desc><style>text{font-family:'Arial Unicode MS','Hiragino Sans GB','PingFang SC','Noto Sans CJK SC',Arial,sans-serif;font-size:16px;fill:#172033}.h{font-weight:700}.card{fill:#fff;stroke:#3b5b87;stroke-width:1.7}.blue{fill:#eaf3ff;stroke:#2166a5}.orange{fill:#fff2e7;stroke:#a74818}.axis{stroke:#596678;stroke-width:1.5}.prior{fill:none;stroke:#a74818;stroke-width:2.5;stroke-dasharray:6 4}.post{fill:none;stroke:#2c7a52;stroke-width:2.5}.arrow{stroke:#2166a5;stroke-width:2;fill:none;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#2166a5"/></marker></defs><rect width="425" height="620" fill="#f8fbff"/><text class="h" x="18" y="31">从位置读数到条件不确定性</text><rect class="card blue" x="18" y="50" width="389" height="70" rx="6"/><text x="34" y="78">状态 x=(p,v)：p 的单位 m，v 的单位 m/s</text><text x="34" y="105">读数 y=p+ε，R=Var(ε) 的单位 m²</text><text x="18" y="151" class="h">预测：位置与速度相关，椭圆倾斜</text><line class="axis" x1="68" y1="348" x2="365" y2="348"/><line class="axis" x1="216" y1="195" x2="216" y2="420"/><text x="369" y="353">p (m)</text><text x="221" y="210">v (m/s)</text><ellipse class="prior" cx="218" cy="304" rx="130" ry="53" transform="rotate(-28 218 304)"/><text x="30" y="440" fill="#a74818">虚线：预测 P⁻（较大，不确定）</text><ellipse class="post" cx="235" cy="316" rx="80" ry="32" transform="rotate(-28 235 316)"/><text x="30" y="466" fill="#2c7a52">实线：读数后的 P（较小，不确定性降低）</text><path class="arrow" d="M65 494h110"/><rect class="card orange" x="180" y="478" width="220" height="72" rx="6"/><text x="195" y="505">创新 y−Hμ⁻</text><text x="195" y="530">K 两个分量分别修正 p、v</text><text x="18" y="580">偏置或延迟读数不满足此简化模型。</text><text x="18" y="607">需要另建状态或匹配观测时刻。</text></svg>
