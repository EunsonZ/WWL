<svg xmlns="http://www.w3.org/2000/svg" width="420" height="610" viewBox="0 0 420 610" role="img" aria-labelledby="title desc">
<title id="title">先消中心还是先消叶：哪里形成填充？</title>
<desc id="desc">三幅矩阵邻接图。中心先消使三叶间形成三条虚线。叶先消只改中心对角项与右端，不产生新边。所有线只表示矩阵非零项，不是接线。</desc>
<rect width="420" height="610" fill="white"/>
<g font-family="Arial, sans-serif" fill="#142b3a" font-size="15">
<text x="16" y="25">Center first or leaf first: fill-in?</text>
<text x="16" y="47" font-size="13">Matrix adjacency; not circuit wiring</text>
<rect x="12" y="62" width="396" height="165" rx="8" fill="#f3f6fa" stroke="#647b90"/>
<text x="25" y="85">Y: c connects to three leaves</text>
<line x1="103" y1="145" x2="237" y2="115" stroke="#275a80" stroke-width="2"/>
<line x1="103" y1="145" x2="319" y2="145" stroke="#275a80" stroke-width="2"/>
<line x1="103" y1="145" x2="237" y2="177" stroke="#275a80" stroke-width="2"/>
<circle cx="103" cy="145" r="14" fill="white" stroke="#233f50" stroke-width="2"/>
<text x="99" y="150">c</text>
<circle cx="237" cy="115" r="14" fill="white" stroke="#233f50" stroke-width="2"/>
<text x="233" y="120">1</text>
<circle cx="319" cy="145" r="14" fill="white" stroke="#233f50" stroke-width="2"/>
<text x="315" y="150">2</text>
<circle cx="237" cy="177" r="14" fill="white" stroke="#233f50" stroke-width="2"/>
<text x="233" y="182">3</text>
<text x="25" y="209" font-size="13">Leaf diagonals include 1 S to reference</text>
<rect x="12" y="237" width="396" height="165" rx="8" fill="#f3f6fa" stroke="#647b90"/>
<text x="25" y="260">Eliminate c: three new fill edges</text>
<line x1="237" y1="290" x2="319" y2="320" stroke="#923b26" stroke-width="2" stroke-dasharray="6 4"/>
<line x1="237" y1="290" x2="237" y2="352" stroke="#923b26" stroke-width="2" stroke-dasharray="6 4"/>
<line x1="319" y1="320" x2="237" y2="352" stroke="#923b26" stroke-width="2" stroke-dasharray="6 4"/>
<circle cx="103" cy="320" r="14" fill="#e0e0e0" stroke="#233f50" stroke-width="2"/>
<text x="99" y="325">c</text>
<path d="M93,310 L113,330" stroke="#222" stroke-width="2"/>
<circle cx="237" cy="290" r="14" fill="white" stroke="#233f50" stroke-width="2"/>
<text x="233" y="295">1</text>
<circle cx="319" cy="320" r="14" fill="white" stroke="#233f50" stroke-width="2"/>
<text x="315" y="325">2</text>
<circle cx="237" cy="352" r="14" fill="white" stroke="#233f50" stroke-width="2"/>
<text x="233" y="357">3</text>
<text x="25" y="384" font-size="13">Dashed: -1/3 S; new RHS: 1/3 A each</text>
<rect x="12" y="412" width="396" height="165" rx="8" fill="#f3f6fa" stroke="#647b90"/>
<text x="25" y="435">Leaf 1 first: no new edge</text>
<line x1="103" y1="495" x2="319" y2="495" stroke="#275a80" stroke-width="2"/>
<line x1="103" y1="495" x2="237" y2="527" stroke="#275a80" stroke-width="2"/>
<circle cx="103" cy="495" r="14" fill="white" stroke="#233f50" stroke-width="2"/>
<text x="99" y="500">c</text>
<circle cx="237" cy="465" r="14" fill="#e0e0e0" stroke="#233f50" stroke-width="2"/>
<text x="233" y="470">1</text>
<path d="M227,455 L247,475" stroke="#222" stroke-width="2"/>
<circle cx="319" cy="495" r="14" fill="white" stroke="#233f50" stroke-width="2"/>
<text x="315" y="500">2</text>
<circle cx="237" cy="527" r="14" fill="white" stroke="#233f50" stroke-width="2"/>
<text x="233" y="532">3</text>
<text x="25" y="559" font-size="13">c diagonal: 3 to 5/2 S; no fill</text>
<text x="16" y="603" font-size="12">Ordering changes storage, not physical wires.</text></g></svg>
