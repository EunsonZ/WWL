<svg xmlns="http://www.w3.org/2000/svg" width="425" height="801" viewBox="0 0 425 801"><title>CDC and reset physical structures</title><desc>Explicit DFF stages,stage1Qto2D timeddata,shared destination clock; separate two-flop resetrelease with externalRNclears. CDC budget uses launch L0, next capture L0+T+s, fitted first-stage tail origin L0+delta1, interstage d12, setup2 and uncertainty u. delta1 is not a guaranteed ordinary tCQ upper bound under metastability; fitted prefactor/tau/time-origin must match, with no double counting. No analog metastabilitytrace, no fullFIFO implementation.</desc><rect width="425" height="801" fill="white"/><g stroke="#111" stroke-width="2" fill="none"><text x="15" y="25" font-size="17">CDC: first stage resolves, second is timed</text><text x="15" y="53" font-size="14">Two real storage stages; binary model only</text><rect x="90" y="105" width="70" height="65" fill="white"/><text x="96" y="142.5" font-size="14">sync1</text><text x="94" y="122" font-size="12">D</text><text x="144" y="122" font-size="12">Q</text><path d="M90 147 L98 152 L90 157"/><rect x="285" y="105" width="70" height="65" fill="white"/><text x="291" y="142.5" font-size="14">sync2</text><text x="289" y="122" font-size="12">D</text><text x="339" y="122" font-size="12">Q</text><path d="M285 147 L293 152 L285 157"/><line x1="20" y1="122" x2="90" y2="122"/><text x="15" y="95" font-size="14">async bit</text><line x1="160" y1="122" x2="220" y2="122"/><rect x="220" y="105" width="35" height="32" fill="white"/><text x="226" y="126.0" font-size="14">buf</text><line x1="255" y1="122" x2="285" y2="122"/><line x1="355" y1="122" x2="400" y2="122"/><text x="365" y="105" font-size="12">out</text><line x1="90" y1="152" x2="70" y2="152"/><line x1="285" y1="152" x2="265" y2="152"/><line x1="70" y1="152" x2="70" y2="200"/><line x1="265" y1="152" x2="265" y2="200"/><line x1="70" y1="200" x2="265" y2="200"/><text x="80" y="228" font-size="14">destination clk to both</text><text x="15" y="266" font-size="14">Tr = T+s-delta1-d12-setup2-u</text><text x="15" y="288" font-size="12">s: capture-(launch+T); d12: wire/buffer</text><text x="15" y="310" font-size="12">delta1: fitted tail origin after launch</text><text x="15" y="332" font-size="12">ns: T=1,s=0,delta1=.2,d12=.1</text><text x="15" y="354" font-size="14">setup2=.1,u=.05 -&gt; Tr=.55ns</text><text x="15" y="376" font-size="14">delta1 not guaranteed CQ upper bound</text><text x="15" y="398" font-size="14">Do not false-path stage1Q -&gt; stage2D</text><text x="15" y="444" font-size="17">Reset release chain per destination domain</text><rect x="90" y="496" width="70" height="65" fill="white"/><text x="96" y="533.5" font-size="14">r1</text><text x="94" y="513" font-size="12">D</text><text x="144" y="513" font-size="12">Q</text><path d="M90 538 L98 543 L90 548"/><line x1="125" y1="561" x2="125" y2="578"/><text x="128" y="576" font-size="11">RN</text><rect x="285" y="496" width="70" height="65" fill="white"/><text x="291" y="533.5" font-size="14">r2</text><text x="289" y="513" font-size="12">D</text><text x="339" y="513" font-size="12">Q</text><path d="M285 538 L293 543 L285 548"/><line x1="320" y1="561" x2="320" y2="578"/><text x="323" y="576" font-size="11">RN</text><text x="20" y="513" font-size="14">1</text><line x1="35" y1="513" x2="90" y2="513"/><line x1="160" y1="513" x2="285" y2="513"/><line x1="355" y1="513" x2="400" y2="513"/><text x="315" y="486" font-size="12">localRN</text><line x1="90" y1="543" x2="70" y2="543"/><line x1="285" y1="543" x2="265" y2="543"/><line x1="70" y1="543" x2="70" y2="591"/><line x1="265" y1="543" x2="265" y2="591"/><line x1="70" y1="591" x2="265" y2="591"/><text x="80" y="616" font-size="14">localclk; release needs edges</text><line x1="125" y1="578" x2="125" y2="648"/><line x1="320" y1="578" x2="320" y2="648"/><line x1="30" y1="648" x2="320" y2="648"/><circle cx="125" cy="648" r="3" fill="#111"/><text x="15" y="676" font-size="14">external active-low RN -&gt; async clear pins</text><text x="15" y="719" font-size="14">Data bus held under req/ack, not bitwise CDC</text><text x="15" y="748" font-size="14">Independent source reset can change Q async</text><text x="15" y="777" font-size="14">Recovery/removal + reset epoch still checked</text></g><style>text{fill:#111;stroke:none;font-family:DejaVu Sans,sans-serif}</style></svg>