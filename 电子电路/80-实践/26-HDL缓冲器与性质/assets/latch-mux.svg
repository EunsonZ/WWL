<svg xmlns="http://www.w3.org/2000/svg" width="420" height="505" viewBox="0 0 420 505"><rect width="420" height="505" fill="white"/><g font-family="Arial, sans-serif" fill="#15263a" stroke="none"><text x="18" y="28" font-size="16">06  Incomplete branch requires memory</text><text x="18" y="49" font-size="12">Concept / CPU prediction — not a tool waveform</text><text x="18" y="85" font-size="14">if(en) y=d;  no else → retain y when en=0</text><text x="73" y="133" font-size="14">level latch</text><text x="18" y="132" font-size="14">d</text><text x="340" y="137" font-size="14">y</text><text x="145" y="201" font-size="14">EN=en (level)</text><text x="18" y="247" font-size="14">Complete combination: y = en ? d : 0</text><text x="158" y="303" font-size="14">MUX</text><text x="18" y="286" font-size="14">d</text><text x="18" y="316" font-size="14">0</text><text x="355" y="298" font-size="14">y</text><text x="219" y="369" font-size="14">en</text><text x="18" y="413" font-size="14">Clocked if(en) q&lt;=d retains via FF enable.</text><text x="18" y="438" font-size="14">Same missing else, different triggering process.</text><text x="18" y="476" font-size="14">Synthesis diagram here is conceptual, not netlist.</text></g><g fill="none" stroke="#15263a" stroke-width="1.8"><rect x="65" y="110" width="120" height="65"/><polyline points="18,145 65,145"/><polyline points="185,145 340,145"/><polyline points="125,175 125,205"/><rect x="150" y="280" width="100" height="65"/><polyline points="18,300 150,300"/><polyline points="18,328 150,328"/><polyline points="250,312 380,312"/><polyline points="200,345 200,368"/></g></svg>