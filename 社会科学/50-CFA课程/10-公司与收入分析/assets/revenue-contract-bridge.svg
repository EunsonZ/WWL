<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="430" viewBox="0 0 1080 430">
<style>text{font-family:"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#172033}.title{font-size:25px;font-weight:700}.head{font-size:18px;font-weight:700}.body{font-size:15px}.small{font-size:13px}.line{stroke:#506680;stroke-width:2;fill:none}.box{fill:#eef4fb;stroke:#2f5d8a;stroke-width:2}.accent{fill:#e9f7ef;stroke:#2b7a4b;stroke-width:2}.warn{fill:#fff3e8;stroke:#b65d18;stroke-width:2}</style>
<rect width="1080" height="430" fill="#ffffff"/>
<text x="35" y="45" class="title">同一年两份客户合同：收入126如何与现金70勾稽</text><rect x="50" y="120" width="220" height="105" rx="12" class="accent"/><text x="65" y="158" class="head">现金收取</text><text x="65" y="198" class="body">+70</text><rect x="288" y="120" width="220" height="105" rx="12" class="box"/><text x="303" y="158" class="head">应收增加</text><text x="303" y="198" class="body">+70</text><rect x="526" y="120" width="180" height="105" rx="12" class="box"/><text x="541" y="158" class="head">合同资产增加</text><text x="541" y="198" class="body">+10</text><rect x="724" y="120" width="172" height="105" rx="12" class="warn"/><text x="739" y="158" class="head">合同负债增加</text><text x="739" y="198" class="body">-24</text><text x="50" y="275" class="head">70 + 70 + 10 - 24 = 126</text><text x="50" y="315" class="body">合同A：系统收入 96，期末合同负债 24；合同B：期间收入 30，期末合同资产 10。</text><text x="50" y="360" class="body">应收是只差时间的无条件权利；合同资产仍取决于合同中的后续条件。三者都要另查减值、退款与可收性。</text>
</svg>
