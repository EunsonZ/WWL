<svg xmlns="http://www.w3.org/2000/svg" width="425" height="670" viewBox="0 0 425 670"><title>LFSR feedback and signature alias contract</title><desc>Three DFF serialpath withfeedbackXOR;equivalent explicitoldstate recurrence. SignatureMISRalternateinjectionequations below; collisionfourbitstrings given. No fabricatedrandomness or toolwaveforms.</desc><rect width="425" height="670" fill="white"/><g stroke="#111" stroke-width="2" fill="none"><text x="15" y="25" font-size="17">3bit LFSR: qnext=[q1,q0,q2 XOR q0]</text><text x="15" y="53" font-size="14">bits q2q1q0; each Q moves left after edge</text><rect x="60" y="140" width="70" height="65" fill="white"/><text x="66" y="177.5" font-size="14">q0</text><text x="64" y="157" font-size="12">D</text><text x="114" y="157" font-size="12">Q</text><path d="M60 182 L68 187 L60 192"/><rect x="185" y="140" width="70" height="65" fill="white"/><text x="191" y="177.5" font-size="14">q1</text><text x="189" y="157" font-size="12">D</text><text x="239" y="157" font-size="12">Q</text><path d="M185 182 L193 187 L185 192"/><rect x="310" y="140" width="70" height="65" fill="white"/><text x="316" y="177.5" font-size="14">q2</text><text x="314" y="157" font-size="12">D</text><text x="364" y="157" font-size="12">Q</text><path d="M310 182 L318 187 L310 192"/><line x1="130" y1="157" x2="185" y2="157"/><circle cx="150" cy="157" r="3" fill="#111"/><line x1="255" y1="157" x2="310" y2="157"/><line x1="380" y1="157" x2="402" y2="157"/><line x1="402" y1="157" x2="402" y2="267"/><rect x="175" y="235" width="70" height="50" fill="white"/><text x="181" y="265.0" font-size="14">XOR</text><text x="178" y="248" font-size="10">A</text><text x="232" y="257" font-size="10">B</text><text x="178" y="280" font-size="10">Y</text><line x1="245" y1="260" x2="402" y2="260"/><circle cx="402" cy="260" r="3" fill="#111"/><line x1="150" y1="157" x2="150" y2="248"/><line x1="150" y1="248" x2="175" y2="248"/><line x1="175" y1="270" x2="30" y2="270"/><line x1="30" y1="270" x2="30" y2="157"/><line x1="30" y1="157" x2="60" y2="157"/><line x1="60" y1="187" x2="45" y2="187"/><line x1="185" y1="187" x2="170" y2="187"/><line x1="310" y1="187" x2="295" y2="187"/><line x1="45" y1="187" x2="45" y2="315"/><line x1="170" y1="187" x2="170" y2="315"/><line x1="295" y1="187" x2="295" y2="315"/><line x1="45" y1="315" x2="295" y2="315"/><text x="70" y="341" font-size="14">testclk; feedback uses old q2/q0</text><text x="15" y="365" font-size="12">Only dots join crossing wires</text><text x="15" y="389" font-size="14">Seed001:1,3,7,6,5,2,4,1; zero locks</text><text x="15" y="429" font-size="17">Signature is a different injected recurrence</text><text x="15" y="465" font-size="14">f = oldq2 XOR response bit</text><text x="15" y="499" font-size="14">newq = (oldq&lt;&lt;1)&amp;7 XOR (f ?011:000)</text><text x="15" y="533" font-size="14">q2next=q1; q1next=q0 XOR f; q0next=f</text><text x="15" y="579" font-size="14">Initial000; ordered responses0000 and1011</text><text x="15" y="613" font-size="14">Both signature000: explicit information loss</text><text x="15" y="647" font-size="14">No uniform-fault assumption or HWcoverage</text></g><style>text{fill:#111;stroke:none;font-family:DejaVu Sans,sans-serif}</style></svg>