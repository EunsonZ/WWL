<svg xmlns="http://www.w3.org/2000/svg" width="1380" height="710" viewBox="0 0 1380 710"><title>新增RC与跨节点电荷连接</title><desc>同一11MOS及显式输入RC/跨节点补偿的有限教学模型；数据从固定spec/results读取，不是工艺或硅测量。</desc><rect width="100%" height="100%" fill="#f8fafc"/><g font-family="PingFang SC,sans-serif"><text x="35" y="40" font-size="26" fill="#24364b" text-anchor="start">原11管电路如何变为10个电压状态？</text><text x="35" y="75" font-size="17" fill="#24364b" text-anchor="start">原09全部MOS/体端/偏置保留；图中框是该完整电路的层级接口，Rdet改为2 MΩ</text><rect x="480" y="150" width="280" height="260" rx="7" fill="#edf3f9" stroke="#64788e"/><text x="620.0" y="286.0" font-size="17" fill="#24364b" text-anchor="middle">原09：11 MOS + CMFB</text><text x="35" y="180" font-size="16" fill="#24364b" text-anchor="start">dp：理想求和器输出</text><path d="M40 205 L145 205" fill="none" stroke="#64788e" stroke-width="2" stroke-dasharray=""/><rect x="145" y="185" width="110" height="40" rx="7" fill="#edf3f9" stroke="#64788e"/><text x="200.0" y="211.0" font-size="17" fill="#24364b" text-anchor="middle">Rg 20 kΩ</text><path d="M255 205 L480 205" fill="none" stroke="#64788e" stroke-width="2" stroke-dasharray=""/><text x="335" y="190" font-size="18" fill="#24364b" text-anchor="start">gp</text><path d="M335 205 L335 260" fill="none" stroke="#64788e" stroke-width="2" stroke-dasharray=""/><path d="M320 260 L350 260" fill="none" stroke="#64788e" stroke-width="2" stroke-dasharray=""/><path d="M320 268 L350 268" fill="none" stroke="#64788e" stroke-width="2" stroke-dasharray=""/><path d="M335 268 L335 287" fill="none" stroke="#64788e" stroke-width="2" stroke-dasharray=""/><text x="360" y="268" font-size="15" fill="#24364b" text-anchor="start">Cg 500 pF →0</text><text x="35" y="310" font-size="16" fill="#24364b" text-anchor="start">dm：理想求和器输出</text><path d="M40 335 L145 335" fill="none" stroke="#64788e" stroke-width="2" stroke-dasharray=""/><rect x="145" y="315" width="110" height="40" rx="7" fill="#edf3f9" stroke="#64788e"/><text x="200.0" y="341.0" font-size="17" fill="#24364b" text-anchor="middle">Rg 20 kΩ</text><path d="M255 335 L480 335" fill="none" stroke="#64788e" stroke-width="2" stroke-dasharray=""/><text x="335" y="320" font-size="18" fill="#24364b" text-anchor="start">gm</text><path d="M335 335 L335 390" fill="none" stroke="#64788e" stroke-width="2" stroke-dasharray=""/><path d="M320 390 L350 390" fill="none" stroke="#64788e" stroke-width="2" stroke-dasharray=""/><path d="M320 398 L350 398" fill="none" stroke="#64788e" stroke-width="2" stroke-dasharray=""/><path d="M335 398 L335 417" fill="none" stroke="#64788e" stroke-width="2" stroke-dasharray=""/><text x="360" y="398" font-size="15" fill="#24364b" text-anchor="start">Cg 500 pF →0</text><text x="35" y="455" font-size="19" fill="#24364b" text-anchor="start">dp/dm = Vic + uc ± [ud + 0.1(op−om)]/2</text><text x="35" y="488" font-size="17" fill="#24364b" text-anchor="start">MOS输入在gp/gm；Rg也是实际热噪声源</text><path d="M760 195 L900 195" fill="none" stroke="#64788e" stroke-width="2" stroke-dasharray=""/><text x="785" y="180" font-size="18" fill="#24364b" text-anchor="start">op</text><path d="M825 195 L825 130" fill="none" stroke="#64788e" stroke-width="2" stroke-dasharray=""/><rect x="750" y="90" width="150" height="40" rx="7" fill="#edf3f9" stroke="#64788e"/><text x="825.0" y="116.0" font-size="17" fill="#24364b" text-anchor="middle">Co 100pF →0</text><path d="M760 345 L1030 345" fill="none" stroke="#64788e" stroke-width="2" stroke-dasharray=""/><text x="785" y="330" font-size="18" fill="#24364b" text-anchor="start">om</text><path d="M825 345 L825 440" fill="none" stroke="#64788e" stroke-width="2" stroke-dasharray=""/><rect x="750" y="440" width="150" height="40" rx="7" fill="#edf3f9" stroke="#64788e"/><text x="825.0" y="466.0" font-size="17" fill="#24364b" text-anchor="middle">Co 100pF →0</text><path d="M900 195 L900 220" fill="none" stroke="#64788e" stroke-width="2" stroke-dasharray=""/><rect x="845" y="220" width="110" height="40" rx="7" fill="#edf3f9" stroke="#64788e"/><text x="900.0" y="246.0" font-size="17" fill="#24364b" text-anchor="middle">Cb 5pF</text><path d="M900 260 L900 270" fill="none" stroke="#64788e" stroke-width="2" stroke-dasharray=""/><path d="M1030 345 L1030 315" fill="none" stroke="#64788e" stroke-width="2" stroke-dasharray=""/><rect x="975" y="275" width="110" height="40" rx="7" fill="#edf3f9" stroke="#64788e"/><text x="1030.0" y="301.0" font-size="17" fill="#24364b" text-anchor="middle">Cb 5pF</text><path d="M1030 275 L1030 270" fill="none" stroke="#64788e" stroke-width="2" stroke-dasharray=""/><path d="M760 270 L1170 270" fill="none" stroke="#64788e" stroke-width="2" stroke-dasharray=""/><text x="775" y="253" font-size="18" fill="#24364b" text-anchor="start">vc</text><rect x="1170" y="250" width="160" height="40" rx="7" fill="#edf3f9" stroke="#64788e"/><text x="1250.0" y="276.0" font-size="17" fill="#24364b" text-anchor="middle">Cc 30nF →0</text><text x="760" y="520" font-size="16" fill="#24364b" text-anchor="start">两条桥电容接同一vc；所有→0明确表示接地</text><text x="35" y="600" font-size="18" fill="#24364b" text-anchor="start">对地Co/Cc与跨节点Cb分别盖章，不用两个对地Miller电容替掉前馈路径。</text><text x="35" y="640" font-size="18" fill="#24364b" text-anchor="start">C = diag(各节点对地C) + Cb(eop−evc)(eop−evc)ᵀ + Cb(eom−evc)(eom−evc)ᵀ</text><text x="35" y="675" font-size="17" fill="#24364b" text-anchor="start">四个offdiag均−5 pF；gp/gm的差与均也要变换，差模块是2状态，不是原来的1状态</text></g></svg>
