<text x="100.0" y="865" font-size="15" fill="#172433" text-anchor="middle">0</text>
<text x="325.0" y="865" font-size="15" fill="#172433" text-anchor="middle">1</text>
<text x="550.0" y="865" font-size="15" fill="#172433" text-anchor="middle">2</text>
<text x="775.0" y="865" font-size="15" fill="#172433" text-anchor="middle">3</text>
<text x="1000.0" y="865" font-size="15" fill="#172433" text-anchor="middle">4</text>
<text x="100" y="700" font-size="15" fill="#172433" text-anchor="start">高度 0.333333；实线 φ*，虚线 φ*(τ−1)。重叠区 [1,3) 长2。</text>
<text x="100" y="916" font-size="17" fill="#172433" text-anchor="start">保存 norm² = 0.333333333；lag1 内积 = 0.222222222</text>
<text x="100" y="950" font-size="15" fill="#172433" text-anchor="start">阴影为两函数的重叠区；两函数实际高度同为1/3。</text>
<text x="100" y="991" font-size="16" fill="#172433" text-anchor="start">此反例通过离散偶移正交与低mask归一化，仍需另证连续平移和cascade。</text>
<text x="100" y="1025" font-size="15" fill="#172433" text-anchor="start">边界非零不反驳内区间消多项式；输入零延拓后已不再是全局斜坡。</text>
