<svg xmlns="http://www.w3.org/2000/svg" width="940" height="515" viewBox="0 0 940 515"><rect width="100%" height="100%" fill="white"/><text x="30" y="32" font-family="Arial,sans-serif" font-size="21" fill="#172b4d" text-anchor="start">One topology, two mark allocations: one identity group</text><path d="M80,150h90" stroke="#73849a" stroke-width="3"/><path d="M170,150h90" stroke="#73849a" stroke-width="3"/><path d="M260,150h90" stroke="#73849a" stroke-width="3"/><circle cx="80" cy="150" r="22" fill="#D55E00"/><text x="80" y="156" font-family="Arial,sans-serif" font-size="16" fill="white" text-anchor="middle">0</text><circle cx="170" cy="150" r="22" fill="#D55E00"/><text x="170" y="156" font-family="Arial,sans-serif" font-size="16" fill="white" text-anchor="middle">1</text><circle cx="260" cy="150" r="22" fill="#dfe8f2"/><text x="260" y="156" font-family="Arial,sans-serif" font-size="16" fill="#172b4d" text-anchor="middle">2</text><circle cx="350" cy="150" r="22" fill="#dfe8f2"/><text x="350" y="156" font-family="Arial,sans-serif" font-size="16" fill="#172b4d" text-anchor="middle">3</text><text x="45" y="87" font-family="Arial,sans-serif" font-size="17" fill="#172b4d" text-anchor="start">marks (0, 1); y = 1</text><text x="45" y="220" font-family="Arial,sans-serif" font-size="14" fill="#172b4d" text-anchor="start">x</text><text x="80" y="239" font-family="Arial,sans-serif" font-size="14" fill="#172b4d" text-anchor="middle">1</text><text x="170" y="239" font-family="Arial,sans-serif" font-size="14" fill="#172b4d" text-anchor="middle">1</text><text x="260" y="239" font-family="Arial,sans-serif" font-size="14" fill="#172b4d" text-anchor="middle">0</text><text x="350" y="239" font-family="Arial,sans-serif" font-size="14" fill="#172b4d" text-anchor="middle">0</text><text x="45" y="258" font-family="Arial,sans-serif" font-size="14" fill="#172b4d" text-anchor="start">Ax</text><text x="80" y="277" font-family="Arial,sans-serif" font-size="14" fill="#172b4d" text-anchor="middle