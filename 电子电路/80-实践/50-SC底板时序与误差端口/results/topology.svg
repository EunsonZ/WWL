<text x="58" y="1020" font-size="17" fill="#172433" text-anchor="start">B净自由电荷守恒 ≠ 只看Cs单板；clock与参考源可经电容提供位移电流。</text>
<text x="58" y="1055" font-size="16" fill="#172433" text-anchor="start">本图是给定q/C线性端口模型；5V clock不表示任意工艺耐压已经验证。</text>
