<svg xmlns="http://www.w3.org/2000/svg" width="425" height="710" viewBox="0 0 425 710"><title>Supply feed and return physical budget</title><desc>Feed R and return R,cell currentload and localdecap connected across localrails. EMcrosssection dimensions explicitly teaching. Does not assert lifetimes, IRtoolrun or transient waveform.</desc><rect width="425" height="710" fill="white"/><g stroke="#111" stroke-width="2" fill="none"><text x="15" y="25" font-size="17">Power grid: feed, return, load and decap</text><text x="15" y="55" font-size="14">Source1V; I20mA; VDDpath0.5ohm</text><text x="15" y="112" font-size="14">Vsource</text><line x1="40" y1="135" x2="117.5" y2="135"/><rect x="117.5" y="127" width="40" height="16" fill="white"/><text x="123.5" y="140.0" font-size="14"></text><line x1="157.5" y1="135" x2="235" y2="135"/><text x="117.5" y="119" font-size="12">Rfeed0.5</text><circle cx="235" cy="135" r="3" fill="#111"/><line x1="235" y1="135" x2="350" y2="135"/><text x="245" y="115" font-size="12">Vlocal0.99V</text><line x1="235" y1="135" x2="235" y2="150"/><line x1="225" y1="150" x2="245" y2="150"/><line x1="225" y1="158" x2="245" y2="158"/><line x1="235" y1="158" x2="235" y2="180"/><text x="249" y="159" font-size="12">Cdecap</text><line x1="235" y1="180" x2="235" y2="330"/><rect x="305" y="180" width="80" height="95" fill="white"/><text x="311" y="232.5" font-size="14">cell load</text><line x1="350" y1="135" x2="350" y2="180"/><line x1="350" y1="275" x2="350" y2="330"/><line x1="350" y1="330" x2="235" y2="330"/><circle cx="235" cy="330" r="3" fill="#111"/><line x1="30" y1="330" x2="112.5" y2="330"/><rect x="112.5" y="322" width="40" height="16" fill="white"/><text x="118.5" y="335.0" font-size="14"></text><line x1="152.5" y1="330" x2="235" y2="330"/><text x="112.5" y="314" font-size="12">Rreturn</text><text x="20" y="366" font-size="14">VSSsource</text><text x="290" y="310" font-size="12">20mA down</text><text x="15" y="411" font-size="14">ReturnR can lift localVSS; not renamed away</text><text x="15" y="454" font-size="17">Metal section for EM units</text><rect x="90" y="490" width="190" height="55" fill="white"/><text x="96" y="522.5" font-size="14"></text><text x="110" y="522" font-size="14">1um x0.2um</text><text x="15" y="587" font-size="14">J=0.02A /0.2um2 =1e11A/m2</text><text x="15" y="616" font-size="14">No technology lifetime threshold asserted</text><text x="15" y="655" font-size="14">Transient1mA x1ns /10mV -&gt;100pF</text><text x="15" y="684" font-size="14">ESR/ESL and actual source grid still needed</text></g><style>text{fill:#111;stroke:none;font-family:DejaVu Sans,sans-serif}</style></svg>