<svg xmlns="http://www.w3.org/2000/svg" width="425" height="380" viewBox="0 0 425 380" role="img" aria-labelledby="t d"><title id="t">提案校正、证书和回退</title><desc id="d">候选提案先经独立证书。已知偏差可校正并复验；未知偏差或失败回退参照。两路都交出最终结果，成本逐项记录。</desc><rect width="425" height="380" fill="#fbfcfe"/><style>text{font:16px 'PingFang SC',sans-serif;fill:#17232e}.h{font-size:18px;font-weight:bold}.b{fill:#e7eef7;stroke:#52799f;stroke-width:1.5}.g{fill:#daf0df;stroke:#39834a;stroke-width:1.5}.w{fill:#fde3c1;stroke:#a66310;stroke-width:1.5}.a{stroke:#334a60;stroke-width:2}</style><text class="h" x="16" y="25">证书决定接受或回退</text><rect class="b" x="128" y="47" width="170" height="42" rx="7"/><text class="h" x="175" y="75">候选提案</text><line class="a" x1="213" y1="89" x2="213" y2="116"/><rect class="b" x="103" y="116" width="220" height="42" rx="7"/><text class="h" x="150" y="144">独立证书</text><line class="a" x1="160" y1="158" x2="95" y2="198"/><line class="a" x1="266" y1="158" x2="331" y2="198"/><rect class="g" x="16" y="198" width="185" height="69" rx="7"/><text x="30" y="226">已知偏差</text><text x="30" y="251">校正后复验</text><rect class="w" x="224" y="198" width="185" height="69" rx="7"/><text x="238" y="226">未知偏差 / 失败</text><text x="238" y="251">回退独立参照</text><line class="a" x1="108" y1="267" x2="181" y2="305"/><line class="a" x1="317" y1="267" x2="244" y2="305"/><rect class="b" x="135" y="300" width="156" height="42" rx="7"/><text class="h" x="163" y="328">最终结果</text><text x="16" y="369">成本：候选、校正、证书、回退、等待、同步。</text></svg>
