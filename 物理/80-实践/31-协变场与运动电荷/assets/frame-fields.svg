<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="450" viewBox="0 0 1000 450">
<title>One event, two frames: fields and force</title><desc>S prime moves at +0.6c along x. E, cB and force use separate normalizations. A circled cross means negative z.</desc>
<defs><marker id="arr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="context-stroke"/></marker></defs>
<rect width="100%" height="100%" fill="#fcfcfa"/>
<g fill="#152b3b" font-family="sans-serif" font-size="15">
<text x="30" y="30" font-size="21">One event, two frames: fields and force</text>
<text x="60" y="70" font-size="15">S: charge instantaneously at rest</text>
<line x1="140" y1="330" x2="370" y2="330" stroke="#718390" stroke-width="1" stroke-dasharray=""/>
<line x1="220" y1="370" x2="220" y2="130" stroke="#718390" stroke-width="1" stroke-dasharray=""/>
<text x="360" y="355" font-size="15">x</text>
<text x="230" y="140" font-size="15">y</text>
<text x="530" y="70" font-size="15">S prime: observer moves at +0.6c</text>
<line x1="610" y1="330" x2="840" y2="330" stroke="#718390" stroke-width="1" stroke-dasharray=""/>
<line x1="690" y1="370" x2="690" y2="130" stroke="#718390" stroke-width="1" stroke-dasharray=""/>
<text x="830" y="355" font-size="15">x</text>
<text x="700" y="140" font-size="15">y</text>
<line x1="220" y1="325" x2="220" y2="225" stroke="#006b8f" stroke-width="4" stroke-dasharray="" marker-end="url(#arr)"/>
<text x="95" y="205" font-size="15">E/E0 = +1 y</text>
<line x1="280" y1="325" x2="280" y2="225" stroke="#a54b00" stroke-width="4" stroke-dasharray="" marker-end="url(#arr)"/>
<text x="302" y="260" font-size="15">f/(qE0) = +1 y</text>
<text x="130" y="390" font-size="15">B = 0; u = 0</text>
<line x1="690" y1="325" x2="690" y2="200" stroke="#006b8f" stroke-width="4" stroke-dasharray="" marker-end="url(#arr)"/>
<text x="520" y="175" font-size="15">E prime/E0 = +1.25 y</text>
<line x1="750" y1="325" x2="750" y2="245" stroke="#a54b00" stroke-width="4" stroke-dasharray="" marker-end="url(#arr)"/>
<text x="765" y="285" font-size="15">f prime/(qE0) = +0.8 y</text>
<line x1="682" y1="325" x2="620" y2="325" stroke="#395c46" stroke-width="3" stroke-dasharray="" marker-end="url(#arr)"/>
<text x="505" y="385" font-size="15">u prime/c = -0.6 x</text>
<circle cx="855" cy="215" r="14" fill="none" stroke="#7b3e82" stroke-width="2"/>
<line x1="847" y1="207" x2="863" y2="223" stroke="#7b3e82" stroke-width="2" stroke-dasharray=""/>
<line x1="847" y1="223" x2="863" y2="207" stroke="#7b3e82" stroke-width="2" stroke-dasharray=""/>
<text x="765" y="185" font-size="15">cB prime/E0 = -0.75 z</text>
<text x="70" y="430" font-size="15">The magnetic force in S prime points along -y; it reduces the electric force.</text>
</g></svg>
