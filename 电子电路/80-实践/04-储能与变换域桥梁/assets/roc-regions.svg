<svg xmlns="http://www.w3.org/2000/svg" width="425" height="715" viewBox="0 0 425 715" role="img" aria-labelledby="title desc">
<title id="title">左右侧与双侧信号的ROC</title><desc id="desc">横轴sigma/a纵轴omega/a；右侧和左侧同一极点-1的不同开半平面，双侧两个极点之间的开条带，虚线排除边界。</desc>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#222"/></marker></defs>
<rect width="425" height="715" style="fill:white;stroke:none"/>
<style>text{font-family:DejaVu Sans,sans-serif;fill:#151515;stroke:none} path,rect,circle{stroke:#222;stroke-width:1.7;fill:none} .point{fill:#222}</style>
<text x="18" y="20" font-size="16" text-anchor="start">Right-sided: exp(-a t) theta(t)</text><rect x="171" y="45" width="224" height="140" style="fill:#e4edf3;stroke:none"/><path d="M58 115L395 115" marker-end="url(#arrow)"/><path d="M227 185L227 45" marker-end="url(#arrow)"/><path d="M171 45L171 185" stroke="#222" stroke-dasharray="5 4"/><text x="171" y="140" font-size="13" text-anchor="middle">-1</text><text x="400" y="109" font-size="12" text-anchor="end">sigma/a</text><text x="234" y="53" font-size="12" text-anchor="start">omega/a</text><text x="230" y="140" font-size="12" text-anchor="start">0</text><path d="M167 111L175 119" stroke="#222"/><path d="M167 119L175 111" stroke="#222"/><text x="25" y="211" font-size="14" text-anchor="start">Re(s) &gt; -a; boundary excluded</text><text x="18" y="260" font-size="16" text-anchor="start">Left-sided: -exp(-a t) theta(-t)</text><rect x="58" y="285" width="113" height="140" style="fill:#e4edf3;stroke:none"/><path d="M58 355L395 355" marker-end="url(#arrow)"/><path d="M227 425L227 285" marker-end="url(#arrow)"/><path d="M171 285L171 425" stroke="#222" stroke-dasharray="5 4"/><text x="171" y="380" font-size="13" text-anchor="middle">-1</text><text x="400" y="349" font-size="12" text-anchor="end">sigma/a</text><text x="234" y="293" font-size="12" text-anchor="start">omega/a</text><text x="230" y="380" font-size="12" text-anchor="start">0</text><path d="M167 351L175 359" stroke="#222"/><path d="M167 359L175 351" stroke="#222"/><text x="25" y="451" font-size="14" text-anchor="start">Re(s) &lt; -a; boundary excluded</text><text x="18" y="500" font-size="16" text-anchor="start">Two-sided: exp(-a |t|)</text><rect x="171" y="525" width="112" height="140" style="fill:#e4edf3;stroke:none"/><path d="M58 595L395 595" marker-end="url(#arrow)"/><path d="M227 665L227 525" marker-end="url(#arrow)"/><path d="M171 525L171 665" stroke="#222" stroke-dasharray="5 4"/><text x="171" y="620" font-size="13" text-anchor="middle">-1</text><path d="M283 525L283 665" stroke="#222" stroke-dasharray="5 4"/><text x="283" y="620" font-size="13" text-anchor="middle">+1</text><text x="400" y="589" font-size="12" text-anchor="end">sigma/a</text><text x="234" y="533" font-size="12" text-anchor="start">omega/a</text><text x="230" y="620" font-size="12" text-anchor="start">0</text><path d="M167 591L175 599" stroke="#222"/><path d="M167 599L175 591" stroke="#222"/><path d="M279 591L287 599" stroke="#222"/><path d="M279 599L287 591" stroke="#222"/><text x="25" y="691" font-size="14" text-anchor="start">-a &lt; Re(s) &lt; a; both tails converge</text></svg>