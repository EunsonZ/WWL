<svg xmlns="http://www.w3.org/2000/svg" width="425" height="670" viewBox="0 0 425 670"><title>STA physical paths and deadlines</title><desc>Teaching absolute-clock and data paths;setupnextcapture10.5ns andholdsamecapture.5ns;max6.8nsarrival,min.4nsarrival. Holdaxis uses a different zoom explicitly. No actual STA log.</desc><rect width="425" height="670" fill="white"/><g stroke="#111" stroke-width="2" fill="none"><text x="15" y="25" font-size="17">Setup and hold use different capture edges</text><text x="15" y="53" font-size="14">T10ns; capture-launch skew+0.5ns</text><rect x="45" y="95" width="70" height="65" fill="white"/><text x="51" y="132.5" font-size="14">launch</text><text x="49" y="112" font-size="12">D</text><text x="99" y="112" font-size="12">Q</text><path d="M45 137 L53 142 L45 147"/><rect x="290" y="95" width="70" height="65" fill="white"/><text x="296" y="132.5" font-size="14">capture</text><text x="294" y="112" font-size="12">D</text><text x="344" y="112" font-size="12">Q</text><path d="M290 137 L298 142 L290 147"/><line x1="115" y1="112" x2="155" y2="112"/><rect x="155" y="95" width="90" height="35" fill="white"/><text x="161" y="117.5" font-size="14">logic/wire</text><line x1="245" y1="112" x2="290" y2="112"/><text x="120" y="154" font-size="12">Q -&gt; max6/min0.25ns -&gt; D</text><line x1="45" y1="142" x2="25" y2="142"/><line x1="25" y1="142" x2="25" y2="185"/><line x1="290" y1="142" x2="275" y2="142"/><line x1="275" y1="142" x2="275" y2="185"/><text x="20" y="205" font-size="14">clk L0=0</text><text x="270" y="205" font-size="12">clk C0=0.5</text><text x="15" y="249" font-size="17">Latest data vs next edge: setup</text><line x1="55" y1="300" x2="390" y2="300"/><line x1="55" y1="294" x2="55" y2="306"/><line x1="70.0" y1="294" x2="70.0" y2="306"/><line x1="259.0" y1="294" x2="259.0" y2="306"/><line x1="343.0" y1="294" x2="343.0" y2="306"/><line x1="370.0" y1="294" x2="370.0" y2="306"/><text x="35" y="283" font-size="14">L0=0</text><text x="215" y="32