<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="770" viewBox="0 0 650 385"><rect width="650" height="385" fill="white"/><text x="15" y="18" font-family="sans-serif" font-size="12" fill="#7a1b00">SYNTHETIC PLOT BOUNDARY: zero MC samples; orange values are mock estimates</text><g transform="translate(0,35)"><svg width="650" height="340" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 340" role="img" aria-labelledby="title desc"><title id="title">OU terminal strong RMS error against time step, T=2</title><desc id="desc">Time step on log base two axis; error axis is log2. Blue connected values are exact analytic RMS errors. Orange dots are Monte Carlo values, bars show plus or minus two estimated delta method standard errors. This additive noise OU case approaches order one; the figure is not a general proof.</desc><rect width="650" height="340" fill="white"/><g font-family="sans-serif" font-size="13" fill="#222"><text x="75" y="28">OU strong RMS error, T=2; y: log2</text><path d="M75,55 V265 H590" fill="none" stroke="#333"/><polyline points="575.00,112.31 408.33,145.52 241.67,177.94 75.00,209.98" fill="none" stroke="#185fa0" stroke-width="2"/><path d="M575.00,112.31 V112.31" stroke="#b44517"/><circle cx="575.00" cy="112.31" r="4" fill="#b44517"/><path d="M408.33,145.52 V145.52" stroke="#b44517"/><circle cx="408.33" cy="145.52" r="4" fill="#b44517"/><path d="M241.67,177.94 V177.94" stroke="#b44517"/><circle cx="241.67" cy="177.94" r="4" fill="#b44517"/><path d="M75.00,209.98 V209.98" stroke="#b44517"/><circle cx="75.00" cy="209.98" r="4" fill="#b44517"/><text x="575.00" y="290" text-anchor="middle">0.25</text><text x="408.33" y="290" text-anchor="middle">0.125</text><text x="241.67" y="290" text-anchor="middle">0.0625</text><text x="75.00" y="290" text-anchor="middle">0.03125</text><text x="335" y="327" text-anchor="middle">Time step h (log2 axis)</text><text x="17" y="164" transform="rotate(-90 17 164)" text-anchor="middle">Terminal RMS error (state units)</text><text x="82" y="52">Blue: analytic; orange: MC +/- 2 estimated SE</text><text x="30" y="269">2^-9</text><text x="35" y="79">2^-3</text></g></svg></g></svg>
