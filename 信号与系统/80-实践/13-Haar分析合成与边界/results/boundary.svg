<text x="35.00" y="575.00" font-size="17" fill="#203142">C  四点可逆shear：a′=a+(0.5)d，d′=d（有限双基，非连续小波构造）</text>
<text x="55.00" y="617.00" font-size="16" fill="#203142">全留仍恢复；系数平方和 32.5 V² ≠ 原 50 V²。</text>
<text x="55.00" y="657.00" font-size="15" fill="#203142">删d′后恢复 (1.5, 1.5, 3.0, 3.0)，误差 12.5 V²。</text>
<text x="55.00" y="700.00" font-size="14" fill="#203142">原四维低保留为斜投影；奇长zero裁剪不幂等，不能统称为原域正交投影。</text>
<text x="35.00" y="768.00" font-size="13" fill="#203142">图只读取results.json。无真实采集、量化码率或去噪真值验证；原生Obsidian显示单独验收。</text>
