<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 350" role="img" aria-labelledby="title desc">
  <title id="title">同三条边，填面改变 H1</title>
  <desc id="desc">左图只有三角形边框，边界矩阵的整数核由 e01 加 e12 减 e02 生成，没有二维链。右图新增有向三角形 t，其边界恰为该循环，故 H1 从整数群变成零。边方向均由编号小的顶点指向编号大的顶点。</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#203950"/></marker></defs>
  <rect width="880" height="350" fill="#fff"/>
  <g font-family="sans-serif" fill="#172e40" font-size="18">
    <text x="85" y="30">只取边：C₂ = 0</text><text x="520" y="30">填面：C₂ = ℤt</text>
    <path d="M515 235L755 235L635 75Z" fill="#dfedf9" stroke="none"/>
    <g stroke="#203950" stroke-width="3" fill="none" marker-end="url(#arrow)">
      <path d="M75 235H315"/><path d="M315 235L195 75"/><path d="M75 235L195 75"/>
      <path d="M515 235H755"/><path d="M755 235L635 75"/><path d="M515 235L635 75"/>
    </g>
    <g fill="#203950"><circle cx="75" cy="235" r="5"/><circle cx="315" cy="235" r="5"/><circle cx="195" cy="75" r="5"/><circle cx="515" cy="235" r="5"/><circle cx="755" cy="235" r="5"/><circle cx="635" cy="75" r="5"/></g>
    <text x="43" y="259">v₀</text><text x="315" y="259">v₁</text><text x="185" y="65">v₂</text>
    <text x="483" y="259">v₀</text><text x="755" y="259">v₁</text><text x="625" y="65">v₂</text>
    <text x="172" y="257">e₀₁</text><text x="270" y="150">e₁₂</text><text x="90" y="150">e₀₂</text>
    <text x="612" y="257">e₀₁</text><text x="710" y="150">e₁₂</text><text x="530" y="150">e₀₂</text>
    <text x="628" y="170">t</text><text x="360" y="175">添一个面 →</text>
    <text x="62" y="292">z = e₀₁ + e₁₂ − e₀₂，∂₁z = 0</text><text x="520" y="292">∂₂t = z，∂₁∂₂t = 0</text>
    <text x="85" y="326">H₁ = ℤ，χ = 3 − 3 = 0</text><text x="520" y="326">H₁ = 0，χ = 3 − 3 + 1 = 1</text>
  </g>
</svg>
