<svg xmlns="http://www.w3.org/2000/svg" width="425" height="660" viewBox="0 0 425 660"><title>Device field and compact port model hierarchy</title><desc>Original diagram. Field geometry and mesh reduce to I and Q and finite compact laws then circuit unknowns. F01 supplies device field portion of V41; no packaging RLC/thermal/mechanical completion claim, no real PDK.</desc><rect width="425" height="660" fill="white"/><g stroke="#111" stroke-width="2" fill="none"><text x="15" y="28" font-size="17">One device: field -&gt; port -&gt; circuit</text><text x="15" y="59" font-size="14">F01 contribution; package model is F02</text><rect x="25" y="100" width="375" height="42" fill="white"/><text x="33" y="126.0" font-size="14">Geometry / material / contacts</text><text x="30" y="166" font-size="12">x[m], epsilon[F/m], doping[m^-3]</text><line x1="210" y1="172" x2="210" y2="192"/><rect x="25" y="196" width="375" height="42" fill="white"/><text x="33" y="222.0" font-size="14">Grid solve: phi, n, p</text><text x="30" y="262" font-size="12">Poisson + continuity; residual budget</text><line x1="210" y1="268" x2="210" y2="288"/><rect x="25" y="292" width="375" height="42" fill="white"/><text x="33" y="318.0" font-size="14">Port extraction: I and Q</text><text x="30" y="358" font-size="12">I=area x J [A]; Q [C]</text><line x1="210" y1="364" x2="210" y2="384"/><rect x="25" y="388" width="375" height="42" fill="white"/><text x="33" y="414.0" font-size="14">Compact law and fitted parameters</text><text x="30" y="454" font-size="12">I(V,T); Q(V,T); domain card</text><line x1="210" y1="460" x2="210" y2="480"/><rect x="25" y="484" width="375" height="42" fill="white"/><text x="33" y="510.0" font-size="14">Circuit nodes / states</text><text x="30" y="550" font-size="12">KCL + port laws; bias and initial state</text><text x="15" y="603" font-size="14">Holdout I/Q/derivatives check the mapping</text><text x="15" y="634" font-size="14">No real PDK, process or professional run</text></g><style>text{fill:#111;stroke:none;font-family:DejaVu Sans,sans-serif}</style></svg>