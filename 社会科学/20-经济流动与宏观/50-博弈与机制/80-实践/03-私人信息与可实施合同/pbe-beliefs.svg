<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="445" viewBox="0 0 1050 445"><title>Pure-behavior PBE: beliefs must also support the response</title><desc>Each row is a complete pure strategy profile. Bars show exact allowed receiver beliefs at signal0 and signal1; on-path Bayes beliefs are points. Mixed equilibria are not enumerated.</desc><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif" fill="#17212b"><text x="25" y="35" font-size="23">Pure-behavior PBE: beliefs must also support the response</text>
