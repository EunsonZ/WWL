<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1060" viewBox="0 0 1100 1060" role="img">
<title>消失矩、有限边缘与连续缩放反例</title><desc>保存的离散矩与斜坡完整零延拓输出；sparse QMF 的连续box平移存在重叠，不能由离散QMF推连续正交。</desc>
<rect width="1100" height="1060" fill="#fff"/>
<g font-family="Arial Unicode MS,PingFang SC,Noto Sans CJK SC,system-ui,sans-serif" fill="#172433">
<text x="55" y="42" font-size="27" fill="#172433" text-anchor="start">矩为零，零的是哪个对象？</text>
<text x="55" y="72" font-size="16" fill="#172433" text-anchor="start">有限内积 b[m]=Σ g[n]x[2m+n]；因果实现用反向 tap，再按保存 slice 取内区间。</text>
<text x="80" y="120" font-size="20" fill="#172433" text-anchor="start">A  保存的离散矩：连续消失矩仍须先有合法尺度函数</text>
