<rect x="427" y="149.0" width="20" height="105.0" fill="#0f766e"/>
<text x="413" y="279" text-anchor="middle" font-size="22">11</text>
<text x="20" y="280" font-size="18">BD</text>
<text x="20" y="308" font-size="20" fill="#1d4ed8">精确</text>
<text x="104" y="308" text-anchor="middle" font-size="20">0.087</text>
<text x="207" y="308" text-anchor="middle" font-size="20">0.037</text>
