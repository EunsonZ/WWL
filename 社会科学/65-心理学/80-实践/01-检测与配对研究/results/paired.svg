<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" role="img" aria-labelledby="title desc">
<title id="title">每人配对差与均值</title><desc id="desc">合成六人或变式配对中位数差；每点一个人，单位ms；不显示置信区间</desc>
<rect width="900" height="460" fill="white"/><g font-family="Hiragino Sans GB,Microsoft YaHei,Arial Unicode MS,sans-serif" fill="#1b2938">
<text x="65" y="35" font-size="22">每点一个人，保留配对与不同方向</text>
<text x="65" y="65" font-size="14">合成正确反应中位数差 B-A（ms）；没有原始逐试次记录</text>
<path d="M90,95 V350 H835" fill="none" stroke="#27394a"/>
<line x1="90" x2="835" y1="350.0000" y2="350.0000" stroke="#d4dce4"/>
<text x="80" y="355.0000" text-anchor="end" font-size="13">-20</text>
<line x1="90" x2="835" y1="298.8889" y2="298.8889" stroke="#d4dce4"/>
<text x="80" y="303.8889" text-anchor="end" font-size="13">0</text>
<line x1="90" x2="835" y1="222.2222" y2="222.2222" stroke="#d4dce4"/>
<text x="80" y="227.2222" text-anchor="end" font-size="13">30</text>
<line x1="90" x2="835" y1="120.0000" y2="120.0000" stroke="#d4dce4"/>
<text x="80" y="125.0000" text-anchor="end" font-size="13">70</text>
<circle cx="125.0000" cy="196.6667" r="5" fill="#255d85"/>
<text x="125.0000" y="184.6667" text-anchor="middle" font-size="14">40</text>
<text x="125.0000" y="377" text-anchor="middle" font-size="14">ID 1</text>
<circle cx="255.0000" cy="145.5556" r="5" fill="#255d85"/>
<text x="255.0000" y="133.5556" text-anchor="middle" font-size="14">60</text>
<text x="255.0000" y="377" text-anchor="middle" font-size="14">ID 2</text>
<circle cx="385.0000" cy="247.7778" r="5" fill="#255d85"/>
<text x="385.0000" y="235.7778" text-anchor="middle" font-size="14">20</text>
<text x="385.0000" y="377" text-anchor="middle" font-size="14">ID 3</text>
<circle cx="515.0000" cy="324.4444" r="5" fill="#255d85"/>
<text x="515.0000" y="312.4444" text-anchor="middle" font-size="14">-10</text>
<text x="515.0000" y="377" text-anchor="middle" font-size="14">ID 4</text>
<circle cx="645.0000" cy="171.1111" r="5" fill="#255d85"/>
<text x="645.0000" y="159.1111" text-anchor="middle" font-size="14">50</text>
<text x="645.0000" y="377" text-anchor="middle" font-size="14">ID 5</text>
<circle cx="775.0000" cy="247.7778" r="5" fill="#255d85"/>
<text x="775.0000" y="235.7778" text-anchor="middle" font-size="14">20</text>
<text x="775.0000" y="377" text-anchor="middle" font-size="14">ID 6</text>
<line x1="90" x2="835" y1="222.2222" y2="222.2222" stroke="#a14e18" stroke-dasharray="6 4"/>
<text x="90" y="420" font-size="15">均值 30 ms；线表示样本均值，不是个体定律或置信区间</text>
</g></svg>
