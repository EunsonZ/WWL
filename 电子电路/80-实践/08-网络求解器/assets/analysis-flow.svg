<svg xmlns="http://www.w3.org/2000/svg" width="360" height="590" viewBox="0 0 360 590"><title>AC linearizes at bias while transient advances consistent states</title><rect width="360" height="590" fill="#fff"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#17324d"/></marker></defs><g font-family="Arial, sans-serif"><text xml:space="preserve" x="14" y="25" font-size="16" fill="#17324d">M07-05  two different questions</text><rect x="12" y="46" width="336" height="38" rx="5" fill="#eef5fb" stroke="#adc4d8"/><text xml:space="preserve" x="20" y="70" font-size="14" fill="#17324d">AC: DC bias / operating point</text><rect x="12" y="106" width="336" height="38" rx="5" fill="#eef5fb" stroke="#adc4d8"/><text xml:space="preserve" x="20" y="130" font-size="14" fill="#17324d">device Jacobian at bias</text><rect x="12" y="166" width="336" height="38" rx="5" fill="#eef5fb" stroke="#adc4d8"/><text xml:space="preserve" x="20" y="190" font-size="14" fill="#17324d">complex solve at each f [Hz]</text><rect x="12" y="226" width="336" height="38" rx="5" fill="#eef5fb" stroke="#adc4d8"/><text xml:space="preserve" x="20" y="250" font-size="14" fill="#17324d">small-signal gain / phase</text><rect x="12" y="326" width="336" height="38" rx="5" fill="#eef5fb" stroke="#adc4d8"/><text xml:space="preserve" x="20" y="350" font-size="14" fill="#17324d">TRAN: source(t) + consistent x0</text><rect x="12" y="386" width="336" height="38" rx="5" fill="#eef5fb" stroke="#adc4d8"/><text xml:space="preserve" x="20" y="410" font-size="14" fill="#17324d">implicit time step + nonlinear solve</text><rect x="12" y="446" width="336" height="38" rx="5" fill="#eef5fb" stroke="#adc4d8"/><text xml:space="preserve" x="20" y="470" font-size="14" fill="#17324d">check time error by reducing h</text><rect x="12" y="506" width="336" height="38" rx="5" fill="#eef5fb" stroke="#adc4d8"/><text xml:space="preserve" x="20" y="530" font-size="14" fill="#17324d">v(t), i(t), energy / recovery</text><path d="M180 87 L180 102" stroke="#17324d" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M180 147 L180 162" stroke="#17324d" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M180 207 L180 222" stroke="#17324d" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M180 367 L180 382" stroke="#17324d" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M180 427 L180 442" stroke="#17324d" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M180 487 L180 502" stroke="#17324d" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text xml:space="preserve" x="14" y="295" font-size="14" fill="#17324d">AC amplitude is a perturbation scale.</text><text xml:space="preserve" x="14" y="568" font-size="14" fill="#17324d">Output grid ≠ fixed internal time step.</text></g></svg>
