<svg xmlns="http://www.w3.org/2000/svg" width="940" height="790" viewBox="0 0 940 790" role="img" aria-labelledby="title desc">
<title id="title">四点Haar：两支合起来恢复，删一支才改变信号</title><desc id="desc">The full pair transform is invertible and orthogonal. Correct synthesis, low-only reconstruction and a deliberately wrong detail sign are shown from the same saved samples. Units are V; energies are discrete squared norms in V squared.</desc>
<rect width="940" height="790" fill="white"/>
<g font-family="Arial Unicode MS,PingFang SC,Noto Sans CJK SC,system-ui,sans-serif" font-size="14" fill="#203142">
<text x="30.00" y="32.00" font-size="22" fill="#203142">四点Haar：两支合起来恢复，删一支才改变信号</text>
<text x="35.00" y="60.00" font-size="14" fill="#203142">分析保留奇相位；合成插零在偶位置。无下标延迟，仍须等每对第二个样点。</text>
<text x="30.00" y="97.00" font-size="18" fill="#203142">A  同一输入与三种合成结果</text>
<path d="M115.00 145.00 L115.00 305.00" fill="none" stroke="#ced6df" stroke-dasharray=""/>
<text x="111.00" y="326.00" font-size="14" fill="#203142">0</text>
