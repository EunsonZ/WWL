<svg xmlns="http://www.w3.org/2000/svg" width="425" height="875" viewBox="0 0 425 875"><title>Powerdomain isolation and retention sequence</title><desc>Switched VSW rail distinct from always-onrail;isolation andbackup powered byAON;clampvalid0 under specifiedreceiverprotocol; nine discreteactions and realexternalprerequisites. No power-aware simulation.</desc><rect width="425" height="875" fill="white"/><g stroke="#111" stroke-width="2" fill="none"><text x="15" y="25" font-size="17">AON supply owns isolation and controller</text><text x="15" y="57" font-size="14">validclamp0; receiver ignores data when0</text><text x="15" y="100" font-size="14">VDD_AON</text><line x1="40" y1="118" x2="390" y2="118"/><rect x="80" y="151" width="110" height="45" fill="white"/><text x="86" y="178.5" font-size="14">power switch</text><line x1="110" y1="118" x2="110" y2="151"/><line x1="110" y1="196" x2="110" y2="240"/><text x="115" y="226" font-size="12">VSW</text><rect x="55" y="240" width="125" height="105" fill="white"/><text x="61" y="297.5" font-size="14">domain flops</text><line x1="180" y1="280" x2="240" y2="280"/><rect x="240" y="250" width="95" height="60" fill="white"/><text x="246" y="285.0" font-size="14">isolate</text><line x1="335" y1="280" x2="395" y2="280"/><text x="340" y="264" font-size="12">valid</text><line x1="290" y1="118" x2="290" y2="250"/><rect x="205" y="360" width="160" height="45" fill="white"/><text x="211" y="387.5" font-size="14">retention backup</text><line x1="365" y1="380" x2="390" y2="380"/><line x1="390" y1="380" x2="390" y2="118"/><text x="200" y="431" font-size="12">backup on AON rail</text><line x1="130" y1="345" x2="130" y2="383"/><line x1="130" y1="383" x2="205" y2="383"/><text x="25" y="405" font-size="12">save/restore</text><rect x="30" y="450" width="355" height="45" fill="white"/><text x="36" y="477.5" font-size="14">AON controller: isolate, clk, power, RN</text><text x="15" y="544" font-size="17">k action                  required boundary</text><text x="15" y="580" font-size="14">1 quiesce: in-flight done/cancelled</text><text x="15" y="614" font-size="14">2 save: retention state acknowledged</text><text x="15" y="648" font-size="14">3 isolate: clamp valid0 before powerloss</text><text x="15" y="682" font-size="14">4 clock_off; 5 power_off</text><text x="15" y="716" font-size="14">6 power_on: wait actualpower_good</text><text x="15" y="750" font-size="14">7 clock_on; 8 restore/resetrelease</text><text x="15" y="784" font-size="14">9 release: valid protocol may restart</text><text x="15" y="850" font-size="14">No universal IPsequence or voltage waveforms</text></g><style>text{fill:#111;stroke:none;font-family:DejaVu Sans,sans-serif}</style></svg>