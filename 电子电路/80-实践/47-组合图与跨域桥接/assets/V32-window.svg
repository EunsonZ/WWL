<svg xmlns="http://www.w3.org/2000/svg" width="425" height="550" viewBox="0 0 425 550"><rect width="425" height="550" fill="white"/><style>text{font:16px sans-serif;fill:#18232c}.title{font-weight:bold}.small{font-size:14px}.wire{stroke:#18232c;stroke-width:2;fill:none}.box{fill:#f2f5f7;stroke:#18232c;stroke-width:1.5}</style><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#18232c"/></marker></defs><text x="16" y="28" class="title">V32: transparency and two timing paths</text><rect class="box" x="16" y="48" width="393" height="100"/><text x="26" y="71" class="">Latch: transparent while EN=1</text><text x="26" y="95" class="">EN  ____| HIGH |____</text><text x="26" y="119" class="">D may propagate during HIGH</text><text x="26" y="143" class="">DFF: sample only near rising edge</text><rect class="box" x="16" y="170" width="393" height="76"/><text x="26" y="193" class="">Source Q -&gt; logic + wire -&gt; capture D</text><text x="26" y="217" class="">Launch L0=0; capture C0=1, C1=11 ns</text><text x="26" y="241" class="">s = capture - launch = +1 ns</text><text x="16" y="280" class="">SETUP: longest path -&gt; NEXT capture</text><path class="wire" d="M30 315L390 315" marker-end="url(#a)"/><path class="wire" d="M30 308L30 322"/><text x="27" y="345" class="">0</text><path class="wire" d="M235 308L235 322"/><text x="232" y="345" class="">8</text><path class="wire" d="M260 308L260 322"/><text x="257" y="345" class="">9</text><path class="wire" d="M312 308L312 322"/><text x="309" y="345" class="">11</text><text x="16" y="372" class="">Stable at 8; deadline 9; slack +1 ns</text><text x="16" y="409" class="">HOLD: shortest path -&gt; SAME capture</text><path class="wire" d="M30 444L390 444" marker-end="url(#a)"/><path class="wire" d="M30 437L30 451"/><text x="27" y="474" class="">0</text><path class="wire" d="M56 437L56 451"/><text x="53" y="474" class="">1</text><path class="wire" d="M108 437L108 451"/><text x="105" y="474" class="">3</text><text x="16" y="502" class="">Pollution 3; deadline 3; slack 0 ns</text><text x="16" y="528" class="small">Teaching bounds, no STA or analog trace</text></svg>
