<svg xmlns="http://www.w3.org/2000/svg" width="860" height="400" viewBox="0 0 860 400" role="img">
<title>Coupled basis, total spin and exchange energy</title><desc>Four coupled states form one j=1 triplet and one j=0 singlet. Energy divided by Jc is one quarter or minus three quarters. Assumes Jc positive; no position space model.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<g font-family="sans-serif" fill="#172b4d" font-size="15">
<text x="35" y="34" font-size="21" text-anchor="start">Coupled states and energy: Jc &gt; 0</text>
<line x1="80" y1="105" x2="215" y2="105" stroke="#1261a0" stroke-width="4"/>
<text x="80" y="90" font-size="17" text-anchor="start">t+</text>
<text x="80" y="133" font-size="15" text-anchor="start">j=1, m=1</text>
<text x="80" y="158" font-size="15" text-anchor="start">P=+1</text>
<text x="80" y="183" font-size="15" text-anchor="start">E/Jc=0.25</text>
<line x1="275" y1="105" x2="410" y2="105" stroke="#1261a0" stroke-width="4"/>
<text x="275" y="90" font-size="17" text-anchor="start">t0</text>
<text x="275" y="133" font-size="15" text-anchor="start">j=1, m=0</text>
<text x="275" y="158" font-size="15" text-anchor="start">P=+1</text>
<text x="275" y="183" font-size="15" text-anchor="start">E/Jc=0.25</text>
<line x1="470" y1="105" x2="605" y2="105" stroke="#1261a0" stroke-width="4"/>
<text x="470" y="90" font-size="17" text-anchor="start">t-</text>
<text x="470" y="133" font-size="15" text-anchor="start">j=1, m=-1</text>
<text x="470" y="158" font-size="15" text-anchor="start">P=+1</text>
<text x="470" y="183" font-size="15" text-anchor="start">E/Jc=0.25</text>
<line x1="665" y1="250" x2="800" y2="250" stroke="#1261a0" stroke-width="4"/>
<text x="665" y="235" font-size="17" text-anchor="start">s</text>
<text x="665" y="278" font-size="15" text-anchor="start">j=0, m=0</text>
<text x="665" y="303" font-size="15" text-anchor="start">P=-1</text>
<text x="665" y="328" font-size="15" text-anchor="start">E/Jc=-0.75</text>
<text x="35" y="385" font-size="15" text-anchor="start">The repeated triplet energy is degeneracy, not three copies of the same state.</text>
</g></svg>
