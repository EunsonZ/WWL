<svg xmlns="http://www.w3.org/2000/svg" width="425" height="665" viewBox="0 0 425 665"><title>CMOS process and cell views</title><desc>Qualitative planarCMOS section and abstract cell top view. Geometry is teaching coordinates, not DRC-clean masks or a named technology process; voltage terminals and body/well taps labeled.</desc><rect width="425" height="665" fill="white"/><g stroke="#111" stroke-width="2" fill="none"><text x="15" y="25" font-size="17">Planar CMOS: section, not foundry masks</text><text x="15" y="52" font-size="14">PMOS in n-well; NMOS in p-substrate</text><rect x="25" y="120" width="375" height="140" fill="white"/><text x="31" y="195.0" font-size="14"></text><rect x="40" y="135" width="160" height="110" fill="white"/><text x="46" y="195.0" font-size="14">n-well</text><text x="240" y="220" font-size="14">p-substrate</text><rect x="55" y="130" width="25" height="28" fill="white"/><text x="61" y="149.0" font-size="14"></text><text x="52" y="178" font-size="12">p+S</text><rect x="145" y="130" width="25" height="28" fill="white"/><text x="151" y="149.0" font-size="14"></text><text x="142" y="178" font-size="12">p+D</text><rect x="255" y="130" width="25" height="28" fill="white"/><text x="261" y="149.0" font-size="14"></text><text x="252" y="178" font-size="12">n+D</text><rect x="345" y="130" width="25" height="28" fill="white"/><text x="351" y="149.0" font-size="14"></text><text x="342" y="178" font-size="12">n+S</text><rect x="90" y="112" width="44" height="6" fill="white"/><text x="96" y="120.0" font-size="14"></text><rect x="97" y="85" width="30" height="25" fill="white"/><text x="103" y="102.5" font-size="14">G</text><rect x="290" y="112" width="44" height="6" fill="white"/><text x="296" y="120.0" font-size="14"></text><rect x="297" y="85" width="30" height="25" fill="white"/><text x="303" y="102.5" font-size="14">G</text><line x1="40" y1="65" x2="390" y2="65"/><text x="345" y="56" font-size="14">u</text><line x1="112" y1="65" x2="112" y2="85"/><line x1="312" y1="65" x2="312" y2="85"/><line x1="67" y1="130" x2="67" y2="103"/><line x1="357" y1="130" x2="357" y2="103"/><text x="30" y="94" font-size="14">VDD</text><text x="350" y="94" font-size="12">VSS</text><line x1="157" y1="130" x2="157" y2="125"/><line x1="157" y1="125" x2="267" y2="125"/><line x1="267" y1="125" x2="267" y2="130"/><text x="206" y="116" font-size="12">y metal</text><line x1="185" y1="180" x2="185" y2="285"/><text x="105" y="305" font-size="14">well tap -&gt; VDD</text><line x1="370" y1="220" x2="370" y2="285"/><text x="270" y="305" font-size="12">body tap -&gt; VSS</text><text x="15" y="346" font-size="17">Cell top view: geometry + pins + rails</text><rect x="35" y="385" width="340" height="165" fill="white"/><text x="41" y="472.5" font-size="14"></text><line x1="35" y1="392" x2="375" y2="392"/><text x="40" y="381" font-size="14">VDD rail</text><line x1="35" y1="542" x2="375" y2="542"/><text x="40" y="575" font-size="14">VSS rail</text><rect x="60" y="420" width="85" height="30" fill="white"/><text x="66" y="440.0" font-size="14"></text><text x="80" y="442" font-size="12">P</text><rect x="60" y="486" width="85" height="30" fill="white"/><text x="66" y="506.0" font-size="14"></text><text x="80" y="508" font-size="12">N</text><line x1="103" y1="408" x2="103" y2="529"/><text x="155" y="419" font-size="12">drain metal</text><line x1="103" y1="464" x2="240" y2="464"/><circle cx="103" cy="464" r="3" fill="#111"/><text x="248" y="469" font-size="14">u pin</text><line x1="70" y1="435" x2="70" y2="392"/><circle cx="70" cy="435" r="3" fill="#111"/><line x1="70" y1="501" x2="70" y2="542"/><circle cx="70" cy="501" r="3" fill="#111"/><circle cx="135" cy="435" r="3" fill="#111"/><circle cx="135" cy="501" r="3" fill="#111"/><line x1="135" y1="435" x2="280" y2="435"/><line x1="135" y1="501" x2="280" y2="501"/><line x1="280" y1="435" x2="280" y2="501"/><text x="288" y="501" font-size="14">y pin</text><text x="15" y="615" font-size="14">Pin crossing only joins