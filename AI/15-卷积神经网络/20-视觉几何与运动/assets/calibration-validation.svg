<svg xmlns="http://www.w3.org/2000/svg" width="860" height="465" viewBox="0 0 860 465" role="img" aria-labelledby="title desc">
<title id="title">Low training error does not certify calibration</title><desc id="desc">Point RMS error in pixels, logarithmic axis display floor 1e-5. Blue training fit, orange held-out prediction with synthetic independently known pose. Cases clean, noisy, unmodeled k2 and common corner bias. Hold-out pose never enters calibration.</desc>
<rect width="860" height="465" fill="white"/><g font-family="sans-serif" font-size="15" fill="#172638">
<text x="25" y="25">Point RMS (px): model and corner errors can hide in training fits</text>
<text x="85" y="57" fill="#176a9b">blue: training</text><text x="340" y="57" fill="#b04e19">orange: held-out known-pose prediction</text>
<path d="M110,85 V340 H810" fill="none" stroke="#536478"/><text x="55" y="345.00000">1e-5</text><text x="55" y="265.00000">1e-3</text><text x="55" y="185.00000">1e-1</text><text x="55" y="105.00000">1e1</text><rect x="124" y="340.00000" width="28" height="0.00000" fill="#176a9b"/><circle cx="138" cy="340.00000" r="3" fill="#176a9b"/><rect x="168" y="340.00000" width="28" height="0.00000" fill="#b04e19"/><circle cx="182" cy="340.00000" r="3" fill="#b04e19"/><text x="115" y="370">clean</text><rect x="299" y="211.09164" width="28" height="128.90836" fill="#176a9b"/><circle cx="313" cy="211.09164" r="3" fill="#176a9b"/><rect x="343" y="175.81599" width="28" height="164.18401" fill="#b04e19"/><circle cx="357" cy="175.81599" r="3" fill="#b04e19"/><text x="290" y="370">noisy</text><rect x="474" y="213.04386" width="28" height="126.95614" fill="#176a9b"/><circle cx="488" cy="213.04386" r="3" fill="#176a9b"/><rect x="518" y="135.81586" width="28" height="204.18414" fill="#b04e19"/><circle cx="532" cy="135.81586" r="3" fill="#b04e19"/><text x="465" y="370">k2_mismatch</text><rect x="649" y="340.00000" width="28" height="0.00000" fill="#176a9b"/><circle cx="663" cy="340.00000" r="3" fill="#176a9b"/><rect x="693" y="131.01815" width="28" height="208.98185" fill="#b04e19"/><circle cx="707" cy="131.01815" r="3" fill="#b04e19"/><text x="640" y="370">corner_bias</text>
<text x="70" y="410">Point RMS = sqrt(mean squared 2D point norm); log display floor 1e-5 px.</text>
<text x="70" y="440">Known hold-out pose is an oracle for this simulation, not a real-camera result.</text></g></svg>
