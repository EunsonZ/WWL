<svg xmlns="http://www.w3.org/2000/svg" width="450" height="610" viewBox="0 0 450 610"><rect width="450" height="610" fill="white"/><g stroke="#152333" stroke-width="2" fill="none"><text x="18" y="28" fill="#152333" stroke="none" font-family="sans-serif" font-size="18">Interface: spatial model and small signal</text><rect x="20" y="60" width="110" height="105"/><text x="28" y="117.5" fill="#152333" stroke="none" font-family="sans-serif" font-size="16">metal e-</text><rect x="130" y="60" width="95" height="105"/><text x="138" y="117.5" fill="#152333" stroke="none" font-family="sans-serif" font-size="16"></text><text x="134" y="117" fill="#152333" stroke="none" font-family="sans-serif" font-size="14">double layer</text><rect x="225" y="60" width="205" height="105"/><text x="233" y="117.5" fill="#152333" stroke="none" font-family="sans-serif" font-size="16">electrolyte ions</text><text x="25" y="193" fill="#152333" stroke="none" font-family="sans-serif" font-size="16">charge storage: Q(V); local Cdl = dQ/dV</text><text x="25" y="221" fill="#152333" stroke="none" font-family="sans-serif" font-size="16">reaction slope: Rct = d(eta)/dI</text><text x="25" y="249" fill="#152333" stroke="none" font-family="sans-serif" font-size="16">Rs: bulk ionic/contact path; all are local</text><text x="20" y="292" fill="#152333" stroke="none" font-family="sans-serif" font-size="16">Two-terminal model; teaching parameters</text><path d="M30,390 L70,390"/><rect x="70" y="372" width="70" height="36"/><text x="78" y="395.0" fill="#152333" stroke="none" font-family="sans-serif" font-size="16">Rs</text><path d="M140,390 L180,390"/><path d="M180,335 L180,455"/><path d="M180,335 L225,335"/><rect x="225" y="317" width="75" height="36"/><text x="233" y="340.0" fill="#152333" stroke="none" font-family="sans-serif" font-size="16">Rct</text><path d="M300,335 L350,335"/><path d="M350,335 L350,455"/><path d="M180,455 L252,455"/><path d="M252,436 L252,474"/><path d="M267,436 L267,474"/><path d="M267,455 L350,455"/><path d="M350,390 L410,390"/><text x="242" y="507" fill="#152333" stroke="none" font-family="sans-serif" font-size="16">Cdl</text><text x="24" y="368" fill="#152333" stroke="none" font-family="sans-serif" font-size="16">a</text><text x="406" y="368" fill="#152333" stroke="none" font-family="sans-serif" font-size="16">b</text><text x="18" y="551" fill="#152333" stroke="none" font-family="sans-serif" font-size="16">Ehc is a separate DC source, not Z(f).</text><text x="18" y="581" fill="#152333" stroke="none" font-family="sans-serif" font-size="16">No skin geometry / diffusion / motion claim.</text></g></svg>