<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360"><style>text{font-family:Arial,sans-serif;font-size:17px} .edge{stroke:#2459a6;stroke-width:3;fill:none} .arrow{stroke:#b64228;stroke-width:3;fill:none;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#b64228"/></marker></defs><rect width="960" height="360" fill="#ffffff"/><text x="20" y="28">Square coordinates (u,v): u right, v up. Arrows specify pairing.</text><text x="85" y="65">Cylinder</text><rect class="edge" x="45" y="100" width="200" height="150"/><path class="arrow" d="M45 215 L45 140"/><path class="arrow" d="M245 215 L245 140"/><text x="45" y="278">(0,v) ~ (1,v)</text><text x="45" y="305">horizontal edges unpaired</text><text x="395" y="65">Torus</text><rect class="edge" x="355" y="100" width="200" height="150"/><path class="arrow" d="M355 215 L355 140"/><path class="arrow" d="M555 215 L555 140"/><path class="arrow" d="M410 100 L500 100"/><path class="arrow" d="M410 250 L500 250"/><text x="355" y="278">(0,v) ~ (1,v)</text><text x="355" y="305">(u,0) ~ (u,1)</text><text x="705" y="65">Mobius band</text><rect class="edge" x="665" y="100" width="200" height="150"/><path class="arrow" d="M665 215 L665 140"/><path class="arrow" d="M865 140 L865 215"/><text x="665" y="278">(0,v) ~ (1,1-v)</text><text x="665" y="305">horizontal edges unpaired</text><text x="20" y="342">No extra interior identifications. Boundary and orientation require definitions/proofs.</text></svg>
