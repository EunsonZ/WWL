<text x="650" y="565" class="">Bar card is independent of Schottky TE card:</text>
<text x="650" y="595" class="small">n=1e21 m^-3, mu=0.135 m^2/(V s)</text>
<text x="650" y="625" class="small">A=Ac=1e-12 m^2; rho_c=1e-8 Ohm m^2</text>
<text x="650" y="655" class="small">Intercept=20 kOhm =&gt; each Rc=10 kOhm</text>
<text x="650" y="685" class="small">At L=1 um: G=15.0981 uS</text>
<text x="650" y="715" class="small">Slope still identifies n*mu only.</text>
<text x="90" y="806" class="small">No hardware measurement, activated implant, surface preparation or true tunnelling current is verified.</text>
