<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="730" viewBox="0 0 1200 730"><title>同样的企业，谁会支持改变投资？</title><desc>上部是旧债既存后的市场现金；下部是另一创业项目的努力激励，不能混成同一福利总量。</desc><rect width="1200" height="100%" fill="#f7fafc"/><g font-family="PingFang SC, sans-serif">
<text x="35" y="48" font-size="30" fill="#17324d">同样的企业，谁会支持改变投资？</text>
<text x="35" y="83" font-size="18" fill="#17324d">上部是旧债既存后的市场现金；下部是另一创业项目的努力激励，不能混成同一福利总量。</text>
<text x="40" y="135" font-size="23" fill="#17324d">方案</text>
<text x="400" y="135" font-size="23" fill="#17324d">总值 V</text>
<text x="650" y="135" font-size="23" fill="#17324d">旧债 D</text>
<text x="900" y="135" font-size="23" fill="#17324d">股 E</text>
<text x="40" y="184" font-size="24" fill="#17324d">安全方案</text>
<text x="400" y="184" font-size="24" fill="#17324d">100</text>
<text x="650" y="184" font-size="24" fill="#17324d">80</text>
<text x="900" y="184" font-size="24" fill="#17324d">20</text>
<text x="40" y="234" font-size="24" fill="#17324d">风险替换</text>
<text x="400" y="234" font-size="24" fill="#17324d">90</text>
<text x="650" y="234" font-size="24" fill="#17324d">40</text>
<text x="900" y="234" font-size="24" fill="#17324d">50</text>
<text x="40" y="288" font-size="23" fill="#a93628">股权变化 30；旧债变化 -40；总值变化 -10。</text>
<line x1="110.0" y1="446.8478260869565" x2="800.0" y2="446.8478260869565" stroke="#788b9c"/>
<line x1="110.0" y1="393.3695652173913" x2="800.0" y2="571.6304347826087" stroke="#3975b7" stroke-width="4"/>
<text x="40" y="342" font-size="23" fill="#17324d">努力−偷懒效用差 ΔU = (pH−pL)(R−D)−b</text>
<text x="108" y="620" font-size="18" fill="#17324d">成功偿付 D：0</text>
<text x="710" y="620" font-size="18" fill="#17324d">100</text>
<text x="825" y="421" font-size="20" fill="#17324d">ΔU ≥ 0才满足弱IC</text>
<text x="825" y="461" font-size="20" fill="#17324d">D上限：30</text>
<text x="825" y="501" font-size="20" fill="#17324d">外部融资上限：24</text>
<text x="40" y="685" font-size="22" fill="#a93628">若连 D=0 时 ΔU&lt;0，努力集合为空；不能把负上限裁成0来制造可行点。</text>
</g></svg>
