00 584 L100 595"/><path class="wire" d="M88 556 L88 584"/><path class="gate" d="M62 570 L88 570"/><text x="113" y="575" font-size="15" text-anchor="start">M6</text><path class="gate" d="M100 530 L52 530"/><path class="gate" d="M52 530 L52 570"/><path class="gate" d="M52 570 L62 570"/><path class="wire" d="M100 595 L100 620"/><text x="100" y="640" font-size="16" text-anchor="middle">0</text><text x="110" y="535" font-size="15" text-anchor="start">vb</text><text x="100" y="444" font-size="14" text-anchor="middle">VDD</text><text x="320" y="600" font-size="15" text-anchor="start">Bodies: NMOS -&gt; 0; PMOS -&gt; VDD. Teaching GAMMA = 0.</text><text x="320" y="625" font-size="15" text-anchor="start">C to 0: op/om 20 pF; s/vb/sense/sc/vm 5 pF; vc 10 nF.</text><text x="320" y="650" font-size="14" text-anchor="start">Ideal sources: supply, 50 uA, ref and external DM sum. Dots = junctions.</text></svg>