<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="845" viewBox="0 0 1200 845"><title>噪声端口与有限参数角</title><desc>同一11MOS及显式输入RC/跨节点补偿的有限教学模型；数据从固定spec/results读取，不是工艺或硅测量。</desc><rect width="100%" height="100%" fill="#f8fafc"/><g font-family="PingFang SC,sans-serif"><text x="35" y="40" font-size="25" fill="#24364b" text-anchor="start">同一噪声源只数一次；确定角点也不等于良率</text><text x="35" y="75" font-size="17" fill="#24364b" text-anchor="start">balanced：1 Hz处逐源输出PSD；DM与CM分别列，单位V²/Hz，左→右不是信号增益</text><text x="35" y="120" font-size="16" fill="#24364b" text-anchor="start">源</text><text x="210" y="120" font-size="16" fill="#24364b" text-anchor="start">DM PSD</text><text x="450" y="120" font-size="16" fill="#24364b" text-anchor="start">CM PSD</text><text x="720" y="120" font-size="19" fill="#24364b" text-anchor="start">15个实际注入端口</text><text x="35" y="153" font-size="15" fill="#24364b" text-anchor="start">M1</text><text x="210" y="153" font-size="15" fill="#24364b" text-anchor="start">5.672e-15</text><text x="450" y="153" font-size="15" fill="#24364b" text-anchor="start">5.903e-23</text><text x="35" y="178" font-size="15" fill="#24364b" text-anchor="start">M2</text><text x="210" y="178" font-size="15" fill="#24364b" text-anchor="start">5.672e-15</text><text x="450" y="178" font-size="15" fill="#24364b" text-anchor="start">5.903e-23</text><text x="35" y="203" font-size="15" fill="#24364b" text-anchor="start">M3</text><text x="210" y="203" font-size="15" fill="#24364b" text-anchor="start">4.053e-15</text><text x="450" y="203" font-size="15" fill="#24364b" text-anchor="start">9.580e-19</text><text x="35" y="228" font-size="15" fill="#24364b" text-anchor="start">M4</text><text x="210" y="228" font-size="15" fill="#24364b" text-anchor="start">4.053e-15</text><text x="450" y="228" font-size="15" fill="#24364b" text-anchor="start">9.580e-19</text><text x="35" y="253" font-size="15" fill="#24364b" text-anchor="start">M5</text><text x="210" y="253" font-size="15" fill="#24364b" text-anchor="start">4.535e-50</text><text x="450" y="253" font-size="15" fill="#24364b" text-anchor="start">2.928e-18</text><text x="35" y="278" font-size="15" fill="#24364b" text-anchor="start">M6</text><text x="210" y="278" font-size="15" fill="#24364b" text-anchor="start">4.598e-50</text><text x="450" y="278" font-size="15" fill="#24364b" text-anchor="start">2.843e-18</text><text x="35" y="303" font-size="15" fill="#24364b" text-anchor="start">M7</text><text x="210" y="303" font-size="15" fill="#24364b" text-anchor="start">1.530e-46</text><text x="450" y="303" font-size="15" fill="#24364b" text-anchor="start">1.081e-14</text><text x="35" y="328" font-size="15" fill="#24364b" text-anchor="start">M8</text><text x="210" y="328" font-size="15" fill="#24364b" text-anchor="start">1.530e-46</text><text x="450" y="328" font-size="15" fill="#24364b" text-anchor="start">1.082e-14</text><text x="35" y="353" font-size="15" fill="#24364b" text-anchor="start">M9</text><text x="210" y="353" font-size="15" fill="#24364b" text-anchor="start">1.162e-49</text><text x="450" y="353" font-size="15" fill="#24364b" text-anchor="start">9.242e-18</text><text x="35" y="378" font-size="15" fill="#24364b" text-anchor="start">M10</text><text x="210" y="378" font-size="15" fill="#24364b" text-anchor="start">0.000e+00</text><text x="450" y="378" font-size="15" fill="#24364b" text-anchor="start">7.399e-15</text><text x="35" y="403" font-size="15" fill="#24364b" text-anchor="start">M11</text><text x="210" y="403" font-size="15" fill="#24364b" text-anchor="start">1.074e-46</text><text x="450" y="403" font-size="15" fill="#24364b" text-anchor="start">7.853e-15</text><text x="35" y="428" font-size="15" fill="#24364b" text-anchor="start">RDp</text><text x="210" y="428" font-size="15" fill="#24364b" text-anchor="start">2.965e-17</text><text x="450" y="428" font-size="15" fill="#24364b" text-anchor="start">8.285e-15</text><text x="35" y="453" font-size="15" fill="#24364b" text-anchor="start">RDm</text><text x="210" y="453" font-size="15" fill="#24364b" text-anchor="start">2.965e-17</text><text x="450" y="453" font-size="15" fill="#24364b" text-anchor="start">8.285e-15</text><text x="35" y="478" font-size="15" fill="#24364b" text-anchor="start">RGp</text><text x="210" y="478" font-size="15" fill="#24364b" text-anchor="start">2.442e-14</text><text x="450" y="478" font-size="15" fill="#24364b" text-anchor="start">2.541e-22</text><text x="35" y="503" font-size="15" fill="#24364b" text-anchor="start">RGm</text><text x="210" y="503" font-size="15" fill="#24364b" text-anchor="start">2.442e-14</text><text x="450" y="503" font-size="15" fill="#24364b" text-anchor="start">2.541e-22</text><text x="720" y="160" font-size="16" fill="#24364b" text-anchor="start">M1…M11：漏→源的白电流源</text><text x="720" y="195" font-size="16" fill="#24364b" text-anchor="start">RDp/RDm：输出↔sense</text><text x="720" y="230" font-size="16" fill="#24364b" text-anchor="start">RGp/RGm：实际栅↔理想驱动</text><text x="720" y="275" font-size="16" fill="#24364b" text-anchor="start">单源经镜像/反馈分成多条响应，</text><text x="720" y="302" font-size="16" fill="#24364b" text-anchor="start">先在同一传递中合成，再合PSD。</text><text x="720" y="350" font-size="16" fill="#24364b" text-anchor="start">对称时控制器噪声可在DM消去，</text><text x="720" y="377" font-size="16" fill="#24364b" text-anchor="start">CM仍非零；失配后重新求Q与传递。</text><text x="720" y="425" font-size="16" fill="#24364b" text-anchor="start">对称DM理论为0；极小非零数是</text><text x="720" y="452" font-size="16" fill="#24364b" text-anchor="start">浮点消差残差，不是可测噪声底。</text><text x="35" y="580" font-size="21" fill="#24364b" text-anchor="start">四个教学角：相同预算逐项判定，不调掉失败条件</text><text x="35" y="625" font-size="16" fill="#24364b" text-anchor="start">1: VDD=3 V，T=273.15 K，KP×1.037，Δ|VT|=+0.047 V</text><text x="720" y="625" font-size="16" fill="#217653" text-anchor="start">全部已列预算通过</text><text x="35" y="665" font-size="16" fill="#24364b" text-anchor="start">2: VDD=3.6 V，T=333.15 K，KP×0.941，Δ|VT|=-0.053 V</text><text x="720" y="665" font-size="16" fill="#217653" text-anchor="start">全部已列预算通过</text><text x="35" y="705" font-size="16" fill="#24364b" text-anchor="start">3: VDD=3 V，T=333.15 K，KP×0.770，Δ|VT|=-0.013 V</text><text x="720" y="705" font-size="16" fill="#913c33" text-anchor="start">common_input_grid</text><text x="35" y="745" font-size="16" fill="#24364b" text-anchor="start">4: VDD=3.6 V，T=273.15 K，KP×1.267，Δ|VT|=+0.007 V</text><text x="720" y="745" font-size="16" fill="#217653" text-anchor="start">全部已列预算通过</text><text x="35" y="815" font-size="17" fill="#24364b" text-anchor="start">角3在Vic=1.35 V的最小饱和余量约20.4 mV：仍在饱和，但未过50 mV预算。不是统计失效概率。</text></g></svg>
