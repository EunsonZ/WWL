   <g id="text_14">
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start" x="9.265742" y="13.638052" transform="rotate(-0 9.265742 13.638052)">Two separate ports: dots are not wires</text>
   </g>
  </g>
  <g id="axes_2">
   <g id="text_15">
    <text style="font-size: 13px; font-family: 'DejaVu Sans'" transform="translate(10.08023 273.87509)">Both currents enter dotted terminals.</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'" transform="translate(10.08023 289.478645)">v1, v2: dot minus non-dot.</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'" transform="translate(10.08023 305.082199)">λ1=L1 i1+M i2; λ2=M i1+L2 i2</text>
   </g>
   <g id="text_16">
    <text style="font-size: 13px; font-family: 'DejaVu Sans'" transform="translate(10.08023 361.461764)">L1=10 mH, L2=40 mH, k=0.8</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'" transform="translate(10.08023 377.065319)">M=16 mH; open port 2: di2/dt=0</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'" transform="translate(10.08023 392.668873)">di1/dt=100 A/s ⇒ v2=1.6 V</text>
   </g>
   <g id="text_17">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'" transform="translate(10.08023 463.547354)">Reversing a reference changes signs</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'" transform="translate(10.08023 477.950635)">in both the matrix and port power.</text>
   </g>
  </g>
