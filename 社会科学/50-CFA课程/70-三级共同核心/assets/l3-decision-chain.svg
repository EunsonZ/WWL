<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400">
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}.t{font-size:21px;font-weight:700}.s{font-size:14px}.box{fill:#f5f7fb;stroke:#4e6eaa;stroke-width:2}.accent{fill:#eaf3ff;stroke:#1864ab;stroke-width:2}.warn{fill:#fff4e6;stroke:#d9480f;stroke-width:2}.line{stroke:#486581;stroke-width:2;fill:none}.grid{stroke:#d9e2ec;stroke-width:1}</style>
<rect width="760" height="400" fill="white"/>
<text x="25" y="40" class="t">同一决策链：每一步都保留可检查的输入与反馈</text><rect x="25" y="150" width="125" height="72" rx="9" class="box"/><text x="87.5" y="179" text-anchor="middle" class="s">客户/机构</text><text x="87.5" y="201" text-anchor="middle" class="s">事实与负债</text><path d="M150 186.0 L167 186.0" class="line"/><path d="M167 186.0 l-9 -5 v10 z" fill="#486581"/><rect x="175" y="150" width="125" height="72" rx="9" class="accent"/><text x="237.5" y="179" text-anchor="middle" class="s">IPS</text><text x="237.5" y="201" text-anchor="middle" class="s">目标与约束</text><path d="M300 186.0 L317 186.0" class="line"/><path d="M317 186.0 l-9 -5 v10 z" fill="#486581"/><rect x="325" y="150" width="125" height="72" rx="9" class="accent"/><text x="387.5" y="179" text-anchor="middle" class="s">资本预期</text><text x="387.5" y="201" text-anchor="middle" class="s">与战略配置</text><path d="M450 186.0 L467 186.0" class="line"/><path d="M467 186.0 l-9 -5 v10 z" fill="#486581"/><rect x="475" y="150" width="125" height="72" rx="9" class="box"/><text x="537.5" y="179" text-anchor="middle" class="s">风险调整</text><text x="537.5" y="201" text-anchor="middle" class="s">实施与再平衡</text><path d="M600 186.0 L617 186.0" class="line"/><path d="M617 186.0 l-9 -5 v10 z" fill="#486581"/><rect x="625" y="150" width="110" height="72" rx="9" class="warn"/><text x="680.0" y="179" text-anchor="middle" class="s">归因评价</text><text x="680.0" y="201" text-anchor="middle" class="s">经理判断</text><path d="M680 230 C680 330 235 340 235 230" class="line" stroke-dasharray="7 6"/><text x="455" y="326" text-anchor="middle" class="s">归因结果只在任务、基准或约束变化时反馈修订；不能追逐一次输赢</text>
</svg>
