<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360"><style>text{font-family:Arial,sans-serif;font-size:17px} .edge{stroke:#2459a6;stroke-width:3;fill:none} .arrow{stroke:#b64228;stroke-width:3;fill:none;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#b64228"/></marker></defs><rect width="960" height="360" fill="#ffffff"/><text x="25" y="28">Lift of gamma(t)=exp(4 pi i t): theta(t)=2t, 0 &lt;= t &lt;= 1</text><path class="edge" d="M70 280 L460 280 M70 280 L70 60"/><text x="465" y="286">t</text><text x="25" y="55">theta (turns)</text><text x="60" y="305">0</text><text x="420" y="305">1</text><text x="35" y="88">2</text><path class="arrow" d="M70 280 L420 80"/><text x="170" y="65">endpoint difference = 2</text><circle cx="70.0" cy="280.0" r="5" fill="#b64228"/><circle cx="157.5" cy="230.0" r="5" fill="#b64228"/><circle cx="245.0" cy="180.0" r="5" fill="#b64228"/><circle cx="332.5" cy="130.0" r="5" fill="#b64228"/><circle cx="420.0" cy="80.0" r="5" fill="#b64228"/><circle class="edge" cx="720" cy="175" r="90"/><path class="arrow" d="M810.000 175.000 L808.271 157.442 L803.149 140.558 L794.832 124.999 L783.640 111.360 L770.001 100.168 L754.442 91.851 L737.558 86.729 L720.000 85.000"/><circle cx="810" cy="175" r="7" fill="#b64228"/><text x="824" y="172">1</text><text x="606" y="305">p(theta) forgets integer turns</text><text x="565" y="334">Continuous loop, no derivative assumed.</text></svg>
