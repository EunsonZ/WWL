[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "wwl-measurement-import"
version = "0.1.0"
description = "Recoverable CSV measurement import for WWL"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
wwl-measurements = "measurement_import.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
