<circle cx="590.0" cy="385.0" r="3" fill="#244b71"/><text x="595.0" y="377.0" font-size="14">1</text>
<circle cx="680.0" cy="325.0" r="3" fill="#244b71"/><text x="685.0" y="344.0" font-size="14">2</text>
