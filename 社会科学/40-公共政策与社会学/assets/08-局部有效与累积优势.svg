<svg xmlns="http://www.w3.org/2000/svg" width="425" height="865" viewBox="0 0 425 865" role="img">
  <title>局部有效、累积优势与扩容判断</title>
  <desc>纵向窄图从项目邀请或资格规则，依次显示实际选择与环境暴露、过程结果和长期结果。蓝色实线是研究可描述或比较的对象；橙色虚线是尚待检验的累积机制、容量和分配问题。底部说明阈值上调若同时改变人群、学区资格或住房供给，旧证据不可直接借用。</desc>
  <rect width="425" height="865" fill="#fbfaf7"/>
  <g font-family="PingFang SC, Noto Sans CJK SC, Hiragino Sans GB, sans-serif" fill="#1f2937">
    <text x="212" y="32" text-anchor="middle" font-size="21" font-weight="700">局部有效不自动等于可以普遍扩容</text>
    <text x="212" y="58" text-anchor="middle" font-size="16">蓝实线＝可比较对象；橙虚线＝机制、容量与分配待核验</text>
    <g fill="#e6f0f5" stroke="#416a83" stroke-width="2"><rect x="50" y="88" width="325" height="76" rx="12"/><rect x="50" y="234" width="325" height="76" rx="12"/><rect x="50" y="380" width="325" height="76" rx="12"/><rect x="50" y="526" width="325" height="76" rx="12"/></g>
    <g text-anchor="middle" font-size="18"><text x="212" y="120">项目邀请／资格规则</text><text x="212" y="147" font-size="16">例如随机邀请或明确的收入资格</text><text x="212" y="266">实际选择与环境暴露</text><text x="212" y="293" font-size="16">是否迁入、迁到哪里、停留多久</text><text x="212" y="412">过程结果</text><text x="212" y="439" font-size="16">学校、网络、安全、租金与家庭压力</text><text x="212" y="558">长期结果</text><text x="212" y="585" font-size="16">收入、教育等；需要足够长的随访窗口</text></g>
    <g stroke="#416a83" stroke-width="3" fill="none"><path d="M212 164V234"/><path d="M212 310V380"/><path d="M212 456V526"/></g>
    <g stroke="#b45309" stroke-width="2.5" stroke-dasharray="8 6" fill="none"><path d="M375 272C415 345 415 510 375 564"/><path d="M50 126C10 250 10 490 50 564"/></g>
    <text x="212" y="640" text-anchor="middle" font-size="17" fill="#92400e">候选累积机制：更早、更久暴露怎样改变后续机会？</text>
    <text x="212" y="666" text-anchor="middle" font-size="16" fill="#92400e">须检查选择、中介、容量、溢出与不同年龄组</text>
    <rect x="26" y="705" width="373" height="122" rx="12" fill="#f8e7d2" stroke="#b45309" stroke-width="1.5"/>
    <text x="212" y="737" text-anchor="middle" font-size="18">新规则同时改变什么？</text><text x="212" y="765" text-anchor="middle" font-size="16">阈值上调 + 新人群／学区资格／住房供给</text><text x="212" y="792" text-anchor="middle" font-size="16">比较对象和处理版本改变：重新检查组成、</text><text x="212" y="817" text-anchor="middle" font-size="16">同步规则、操纵、容量、溢出与外推</text>
  </g>
</svg>
