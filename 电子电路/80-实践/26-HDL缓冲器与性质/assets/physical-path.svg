<svg xmlns="http://www.w3.org/2000/svg" width="420" height="520" viewBox="0 0 420 520"><rect width="420" height="520" fill="white"/><g font-family="Arial, sans-serif" fill="#15263a" stroke="none"><text x="18" y="28" font-size="16">05  Physical timing path: Q → logic → D</text><text x="18" y="49" font-size="12">Concept / CPU prediction — not a tool waveform</text><text x="33" y="118" font-size="14">launch L</text><text x="30" y="141" font-size="14">D</text><text x="110" y="141" font-size="14">Q</text><text x="77" y="165" font-size="12">/RST</text><text x="278" y="118" font-size="14">capture C</text><text x="275" y="141" font-size="14">D</text><text x="355" y="141" font-size="14">Q</text><text x="322" y="165" font-size="12">/RST</text><text x="173" y="135" font-size="14">logic</text><text x="18" y="212" font-size="14">MAX: tCQ=3 + tPD=5 + setup=2 = 10 ns</text><text x="18" y="237" font-size="14">T=10 ns; skew C−L=+1 ns; u_setup=.2</text><text x="18" y="262" font-size="14">Available 10+1−.2=10.8 → slack +.8 ns</text><text x="18" y="304" font-size="14">MIN: tCQ=1 + tCD=2 = 3 ns</text><text x="18" y="329" font-size="14">Hold needs 2+1+.1=3.1 → slack −.1 ns</text><text x="18" y="406" font-size="14">Common clock tree, different branch arrival times</text><text x="18" y="435" font-size="14">L clock arrival 0 ns; C arrival +1 ns</text><text x="18" y="468" font-size="14">Slower T helps MAX; does not repair MIN.</text><text x="18" y="495" font-size="14">Not STA signoff; cell/route values are hypotheses.</text></g><g fill="none" stroke="#15263a" stroke-width="1.8"><rect x="25" y="95" width="110" height="76"/><polyline points="53,171 53,161 60,166 53,171"/><rect x="270" y="95" width="110" height="76"/><polyline points="298,171 298,161 305,166 298,171"/><polyline points="135,137 165,137"/><rect x="165" y="112" width="75" height="50"/><polyline points="240,137 270,137"/><polyline points="53,171 53,190 298,190 298,171"/></g></svg>