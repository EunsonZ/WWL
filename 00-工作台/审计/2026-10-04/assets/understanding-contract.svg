<svg xmlns="http://www.w3.org/2000/svg" width="425" height="850" viewBox="0 0 425 850" role="img" aria-labelledby="title desc">
<title id="title">跨学科跳转后，应带回什么？</title>
<desc id="desc">这是阅读与查验顺序框图，不是现实因果图。先固定对象、范围和问题，再区分数学模型、程序实现、经验识别、历史材料、规范理由各自承担的主张与条件。带回能检查的产物，在条件改变后回查原主张；缺信息时允许停止判断。各学科不必经过所有出口。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#294766"/></marker></defs>
<rect width="425" height="850" fill="#fff"/>
<g font-family="Arial Unicode MS, PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#152b40">
<text x="22" y="35" font-size="20">跨学科跳转后，应带回什么？</text>
<text x="22" y="60" font-size="13">实线箭头＝阅读查验顺序；不表示现实因果</text>
<rect x="22" y="83" width="381" height="73" rx="9" fill="#edf4fa" stroke="#294766"/>
<text x="37" y="108" font-size="16">先固定问题与对象</text>
<text x="37" y="132" font-size="13">谁、何时、单位、输入输出、允许改变什么？</text>
<path d="M212 157V183" stroke="#294766" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="22" y="187" width="381" height="283" rx="9" fill="#f8fafc" stroke="#294766"/>
<text x="37" y="214" font-size="16">按所要主张选择出口；不要求全做</text>
<text x="37" y="247" font-size="14">数学：定义、假设、推导、证明与反例</text>
<text x="37" y="271" font-size="12">带回：命题的条件；数值实验的有限边界</text>
<text x="37" y="303" font-size="14">程序：规格、语义、状态、执行证据</text>
<text x="37" y="327" font-size="12">带回：哪层保证成立；失败怎样处理</text>
<text x="37" y="359" font-size="14">经验／历史：比较、材料与竞争解释</text>
<text x="37" y="383" font-size="12">带回：比较对象、证据范围、剩余未知</text>
<text x="37" y="415" font-size="14">规范：价值前提、权利、分配与反对意见</text>
<text x="37" y="439" font-size="12">带回：为何接受理由；不能由指标直接推出</text>
<path d="M212 471V497" stroke="#294766" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="22" y="501" width="381" height="112" rx="9" fill="#edf4fa" stroke="#294766"/>
<text x="37" y="529" font-size="16">返回原问题，检查这一步补了什么</text>
<text x="37" y="555" font-size="13">一个对象图／推导／材料比较／可复算输出</text>
<text x="37" y="579" font-size="13">一句当前可说的结论＋一句不能推出什么</text>
<path d="M212 614V640" stroke="#294766" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="22" y="644" width="381" height="122" rx="9" fill="#fff5e8" stroke="#9d6420"/>
<text x="37" y="672" font-size="16">改变条件，重新选择方法与证据</text>
<text x="37" y="699" font-size="13">如：stride＋精度；时期＋材料；人群＋制度</text>
<text x="37" y="723" font-size="13">能接受／拒绝／暂不能判断，并写出理由</text>
<text x="37" y="747" font-size="12">有链接、有公式或有图，都不能替代这一步</text>
<text x="22" y="804" font-size="13">图可帮助安排查验；正文仍须兑现每个出口。</text>
<text x="22" y="828" font-size="12">证据不足是合法停点。图不是全库学习效果证明。</text>
</g></svg>
