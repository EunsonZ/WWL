<title>Frozen local actor success at checkpoints</title><desc>Lines are exact 16-event expected success averaged over the fixed seed family. x is each trainable role update count, not equal environment cost. Snapshot uses twice as many environment episodes. Dashed limits are noisy channel optimum and no-message upper bound.</desc>
