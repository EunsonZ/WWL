<svg xmlns="http://www.w3.org/2000/svg" width="425" height="730" viewBox="0 0 425 730" role="img" aria-labelledby="title desc">
<title id="title">承重主张的三层证据边界</title>
<desc id="desc">蓝色描述记录持产、人事、继任与法域，并标明时期和群体。描述材料只能用于提出橙色候选机制，竞争解释可能改写机制。紫色现代结果和规范判断没有从古代机制连接而来的因果箭头，需要独立证据或理由。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#9a5b16"/></marker></defs>
<rect width="425" height="730" fill="#faf9f5"/>
<g font-family="PingFang SC, Arial Unicode MS, sans-serif" fill="#18283c">
<text x="22" y="34" font-size="21" font-weight="700">一张表，不能变成总因果链</text>
<text x="22" y="62" font-size="15">先固定对象、时期与材料读取范围</text>
<rect x="18" y="82" width="389" height="153" rx="12" fill="#eaf3fa" stroke="#497ba0"/>
<text x="34" y="112" font-size="18" font-weight="700">1 描述：实际观察到了什么</text>
<text x="34" y="141" font-size="16">持产 · 人事 · 继任 · 法域 · 退出</text>
<text x="34" y="169" font-size="16">同一名称，未必是同一组织</text>
<text x="34" y="197" font-size="16">共同文字，未必是政治统一</text>
<text x="34" y="221" font-size="14">P-02 / P-03 / P-10：支持范围各自有限</text>
<path d="M70 237V293" fill="none" stroke="#9a5b16" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
<text x="88" y="268" font-size="15" fill="#814c10">关系：材料用于提出待检验解释</text>
<rect x="18" y="301" width="389" height="172" rx="12" fill="#fff1df" stroke="#ae772e"/>
<text x="34" y="332" font-size="18" font-weight="700">2 候选机制：为何能持续行动</text>
<text x="34" y="361" font-size="16">资源、规则与庇护可能互补或替代</text>
<text x="34" y="389" font-size="16">存续、自治、认可要分别测量</text>
<text x="34" y="417" font-size="16">竞争解释：市场、战争任务、成员</text>
<text x="34" y="445" font-size="16">档案缺失也会改变我们看到的分布</text>
<text x="28" y="507" font-size="16" font-weight="700">此处没有通往现代结果的因果箭头</text>
<rect x="18" y="528" width="389" height="174" rx="12" fill="#f1edf8" stroke="#88759e"/>
<text x="34" y="559" font-size="18" font-weight="700">3 另需证据与理由的问题</text>
<text x="34" y="589" font-size="16">民主：代表、权利、问责与更替</text>
<text x="34" y="618" font-size="16">科学：知识、合作、复现各自检验</text>
<text x="34" y="647" font-size="16">正当性：谁的权利，能否退出</text>
<text x="34" y="679" font-size="16" font-weight="700">P-01：组织能力不能推出正当性</text>
</g></svg>
