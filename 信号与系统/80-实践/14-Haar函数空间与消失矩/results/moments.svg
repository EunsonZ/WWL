<text x="80" y="660" font-size="20" fill="#172433" text-anchor="start">C  sparse QMF 的单位积分 refinement 解，不是连续正交尺度基</text>
<line x1="100.0" y1="840" x2="1000.0" y2="840" stroke="#53687c" stroke-width="1.4" stroke-dasharray=""/>
<rect x="325.0" y="735" width="450.0" height="105" fill="#d9e8ed"/>
<path d="M100.0000,840.0000 L100.0000,735.0000 L775.0000,735.0000 L775.0000,840.0000" fill="none" stroke="#246cba" stroke-width="2.3" stroke-dasharray=""/>
