<title id="title">奇长度边界与非正交：可逆不等于每种能量账都相同</title><desc id="desc">All coefficients reconstruct the original after explicit extension and cropping. Zero and repeat-right extension give different low-only endpoints and coefficient squared norms. A finite nonorthogonal shear is invertible but is not Parseval.</desc>
