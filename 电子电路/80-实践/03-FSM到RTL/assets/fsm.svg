<svg xmlns="http://www.w3.org/2000/svg" width="425" height="415" viewBox="0 0 425 415">
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#222"/></marker></defs>
<rect width="425" height="415" fill="white"/>
<style>text{font-family:Arial,sans-serif;font-size:14px;fill:#171717} .title{font-size:18px;font-weight:bold} .small{font-size:12px} .box{fill:#eef3f7;stroke:#222;stroke-width:1.5} .path{fill:none;stroke:#222;stroke-width:1.5;marker-end:url(#arrow)}</style>
<text x="20" y="28" class="title" text-anchor="start">One-place control FSM</text><circle cx="98" cy="165" r="52" class="box"/><circle cx="326" cy="165" r="52" class="box"/><text x="98" y="161" class="" text-anchor="middle">EMPTY</text><text x="98" y="182" class="" text-anchor="middle">q=0</text><text x="326" y="161" class="" text-anchor="middle">FULL</text><text x="326" y="182" class="" text-anchor="middle">q=1</text><path d="M137 130 Q212 70 287 130" class="path"/><text x="212" y="87" class="" text-anchor="middle">p=1 / LOAD</text><path d="M287 201 Q212 255 137 201" class="path"/><text x="212" y="248" class="" text-anchor="middle">c=1, p=0 / EMPTY</text><path d="M291 125 C250 32 402 32 361 125" class="path"/><text x="326" y="78" class="small" text-anchor="middle">REPLACE</text><text x="326" y="98" class="small" text-anchor="middle">p=c=1</text><path d="M360 204 C402 295 250 295 292 204" class="path"/><text x="326" y="296" class="" text-anchor="middle">p=c=0: HOLD</text><path d="M55 136 C-8 85 -8 245 55 194" class="path"/><text x="8" y="265" class="small" text-anchor="start">p=0</text><text x="20" y="323" class="" text-anchor="start">p=push: accept input; c=pop: emit old data</text><text x="20" y="347" class="" text-anchor="start">rst_n=0: any state -&gt; EMPTY; no transfers</text><text x="20" y="371" class="" text-anchor="start">HOLD forbids write; REPLACE writes new data</text><text x="20" y="395" class="" text-anchor="start">Control q is one bit; payload d is W bits</text></svg>