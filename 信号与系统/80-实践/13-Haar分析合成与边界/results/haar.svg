<rect x="836.00" y="252.52" width="8" height="8" fill="white" stroke="#923a81" stroke-width="2"/>
<text x="30.00" y="357.00" font-size="18" fill="#203142">B  两个低支系数 + 两个细节系数 = 四个自由度</text>
<text x="55.00" y="404.00" font-size="14" fill="#203142">输入对 0: (1, 3)</text>
<text x="300.00" y="404.00" font-size="16" fill="#3266a5">a[0]=2.82843 V</text>
<text x="550.00" y="404.00" font-size="16" fill="#b46314">d[0]=-1.41421 V</text>
<path d="M235.00 399.00 L280.00 399.00" fill="none" stroke="#35485b" stroke-dasharray=""/>
<text x="250.00" y="392.00" font-size="14" fill="#203142">→</text>
<text x="775.00" y="404.00" font-size="14" fill="#27765d">合成 → 原输入</text>
<text x="55.00" y="470.00" font-size="14" fill="#203142">输入对 1: (2, 6)</text>
<text x="300.00" y="470.00" font-size="16" fill="#3266a5">a[1]=5.65685 V</text>
<text x="550.00" y="470.00" font-size="16" fill="#b46314">d[1]=-2.82843 V</text>
<path d="M235.00 465.00 L280.00 465.00" fill="none" stroke="#35485b" stroke-dasharray=""/>
<text x="250.00" y="458.00" font-size="14" fill="#203142">→</text>
<text x="775.00" y="470.00" font-size="14" fill="#27765d">合成 → 原输入</text>
<text x="35.00" y="550.00" font-size="18" fill="#203142">离散平方和：50 = 低支 40 + 细节 10 V²</text>
<text x="35.00" y="591.00" font-size="16" fill="#203142">删细节误差 10 V²；仅改合成细节符号，误差 40 V²。</text>
<text x="35.00" y="648.00" font-size="18" fill="#203142">C  再拆低支：同一四点的两级Haar</text>
<text x="55.00" y="685.00" font-size="15" fill="#203142">a₂=6 V，d₂=-2 V；平方和 36 + 4 + 10 V²</text>
<text x="35.00" y="748.00" font-size="13" fill="#203142">全输入PR来自任意一对的代数恒等；固定N的全部basis另核实现，不从一次素材重建推全输入。</text>
</g></svg>
