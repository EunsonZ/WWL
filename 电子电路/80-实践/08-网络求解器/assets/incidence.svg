 x="157" y="125" font-size="14" fill="#17324d">i3</text><path d="M55 110 L55 179" stroke="#17324d" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text xml:space="preserve" x="21" y="192" font-size="14" fill="#17324d">i1</text><path d="M295 110 L295 179" stroke="#17324d" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text xml:space="preserve" x="300" y="192" font-size="14" fill="#17324d">i2</text><path d="M75 40 L75 76" stroke="#17324d" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text xml:space="preserve" x="14" y="40" font-size="14" fill="#17324d">b1 = 1 mA</text><text xml:space="preserve" x="20" y="260" font-size="16" fill="#17324d">columns:   e1        e2        e3</text><text xml:space="preserve" x="20" y="288" font-size="16" fill="#17324d">row 1:      +1          0          +1</text><text xml:space="preserve" x="20" y="316" font-size="16" fill="#17324d">row 2:        0        +1          −1</text><text xml:space="preserve" x="20" y="350" font-size="16" fill="#17324d">u = Aᵀv [V]   →   i = Gu [A]</text><text xml:space="preserve" x="20" y="382" font-size="16" fill="#17324d">Ai = b [A]   →   Y = AGAᵀ [S]</text><text xml:space="preserve" x="20" y="414" font-size="16" fill="#17324d">v = (5/11, 3/11) V</text><text xml:space="preserve" x="20" y="442" font-size="15" fill="#17324d">i = (5/11, 6/11, 6/11) mA</text></g></svg>
