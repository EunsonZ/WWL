<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" role="img" aria-labelledby="title desc">
<title id="title">D4 left cosets of a reflection subgroup</title>
<desc id="desc">Four rows show r^k H={r^k,r^k s}. Conjugation sends s to r^2 s outside H. These rows do not define quotient multiplication.</desc>
<rect width="760" height="420" fill="#f8fafc"/>
<g font-family="sans-serif" font-size="22" fill="#0f172a">
<text x="28" y="38">D4: |G|=8, H={e,s}, left cosets r^k H</text>
<rect x="28" y="65" width="410" height="52" rx="10" fill="#dbeafe"/>
<text x="48" y="99">k=0:  { e, s }</text>
<rect x="28" y="130" width="410" height="52" rx="10" fill="#dbeafe"/>
<text x="48" y="164">k=1:  { r, rs }</text>
<rect x="28" y="195" width="410" height="52" rx="10" fill="#dbeafe"/>
<text x="48" y="229">k=2:  { r^2, r^2s }</text>
<rect x="28" y="260" width="410" height="52" rx="10" fill="#dbeafe"/>
<text x="48" y="294">k=3:  { r^3, r^3s }</text>
<text x="470" y="140">r s r^-1 = r^2s</text>
<text x="470" y="180">r^2s is outside H</text>
<text x="28" y="378">Coset partition exists; H is not normal.</text>
<text x="28" y="407">No quotient multiplication on these four rows.</text>
</g>
</svg>
