<text x="90" y="409" class="small">Width scan fixes band bending; it does not reuse the MB chemical potential at high doping.</text>
<text x="90" y="435" class="small">At ND=1e25 m^-3, ND/Nc=3.006: the original MB population assumption fails.</text>
<text x="90" y="517" class="">Separate uniform linear contacts: Rtotal = 2 Rc + Rbulk</text>
