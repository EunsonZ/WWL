<svg xmlns="http://www.w3.org/2000/svg" width="840" height="480" viewBox="0 0 840 480" role="img" aria-labelledby="title desc">
<title id="title">One point and two known camera centers</title>
<desc id="desc">Top view X-Z; Y=0 metres is suppressed. CL=(0,0), CR=(0.1,0), P=(0.3,2) metres. X/Z drawing scales differ. f=800 px, cx=0 px; left u=120 px, right u=80 px.</desc>
<rect width="840" height="480" fill="white"/><g font-family="sans-serif" font-size="16" fill="#172638">
<text x="25" y="28">Known stereo: P=(0.3, 0, 2) m, f=800 px</text>
<path d="M 120.000,390.000 L 490.000,90.000 L 243.333,390.000" fill="none" stroke="#156a9b" stroke-width="3"/>
<path d="M 120.000,390.000 L 243.333,390.000" stroke="#b24d17" stroke-width="5"/>
<path d="M 70,390 H 520 M 120.000,420 V 45" fill="none" stroke="#536478"/>
<text x="465" y="418">+X (m)</text><text x="55.000" y="65">+Z (m)</text>
<circle cx="120.000" cy="390" r="6"/><circle cx="243.333" cy="390" r="6"/>
<circle cx="490.000" cy="90" r="6" fill="#156a9b"/>
<text x="85.000" y="438">C_L</text><text x="238.333" y="438">C_R</text>
<text x="498.000" y="85">P</text>
<text x="100" y="470">B=0.1 m (known)</text>
<text x="555" y="125">X/Z=0.15</text><text x="555" y="155">(X-B)/Z=0.1</text>
<text x="555" y="205">u_L=120 px</text><text x="555" y="235">u_R=80 px</text>
<text x="555" y="275">d=40 px; Z=2 m</text>
<text x="555" y="325">Top view; +Y into page</text>
<text x="555" y="355">X/Z drawing scales differ</text></g></svg>
