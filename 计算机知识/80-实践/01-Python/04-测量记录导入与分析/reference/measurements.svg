<svg xmlns="http://www.w3.org/2000/svg" width="800" height="470" viewBox="0 0 800 470" role="img" aria-labelledby="title desc">
<title id="title">Committed synthetic measurement records</title>
<desc id="desc">Time in milliseconds, voltage in millivolts. Labeled circles show committed sample identities. A dashed horizontal line shows their descriptive mean, not a confidence interval. Lines connect records for reading order only.</desc>
<rect width="800" height="470" fill="#fff"/>
<g font-family="sans-serif" font-size="15" fill="#172b4d">
<text x="90" y="35" font-size="21">Committed synthetic measurement records</text>
<text x="90" y="60">n=4; mean=5 mV; descriptive variance=5 mV²</text>
<path d="M90 90 V360 H680" fill="none" stroke="#172b4d" stroke-width="2"/>
<text x="310" y="420">tick_ms (ms)</text>
<text x="22" y="285" transform="rotate(-90 22 285)">voltage (mV)</text>
<line x1="90" y1="225.00" x2="680" y2="225.00" stroke="#a14c00" stroke-width="2" stroke-dasharray="8 5"/>
<text x="688" y="230.00" fill="#a14c00">mean 5</text>
<polyline points="90.00,306.00 286.67,252.00 483.33,198.00 680.00,144.00" fill="none" stroke="#1f6b9c" stroke-width="2"/>
<text x="55" y="365.00">0</text>
<text x="55" y="311.00">2</text>
<text x="55" y="257.00">4</text>
<text x="55" y="203.00">6</text>
<text x="55" y="149.00">8</text>
<text x="55" y="95.00">10</text>
<circle cx="90.00" cy="306.00" r="5" fill="#1f6b9c"/>
<text x="99.00" y="297.00">a: 2</text>
<text x="75.00" y="386">0</text>
<circle cx="286.67" cy="252.00" r="5" fill="#1f6b9c"/>
<text x="295.67" y="243.00">b: 4</text>
<text x="271.67" y="386">1000</text>
<circle cx="483.33" cy="198.00" r="5" fill="#1f6b9c"/>
<text x="492.33" y="189.00">c: 6</text>
<text x="468.33" y="386">2000</text>
<circle cx="680.00" cy="144.00" r="5" fill="#1f6b9c"/>
<text x="689.00" y="135.00">d: 8</text>
<text x="665.00" y="386">3000</text>
<text x="90" y="452" font-size="13">1 mV/code, zero offset; synthetic finite records; no confidence interval.</text>
</g></svg>
