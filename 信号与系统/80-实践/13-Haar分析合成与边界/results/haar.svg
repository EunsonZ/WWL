<text x="352.67" y="326.00" font-size="14" fill="#203142">1</text>
<path d="M598.33 145.00 L598.33 305.00" fill="none" stroke="#ced6df" stroke-dasharray=""/>
<text x="594.33" y="326.00" font-size="14" fill="#203142">2</text>
<path d="M840.00 145.00 L840.00 305.00" fill="none" stroke="#ced6df" stroke-dasharray=""/>
<text x="836.00" y="326.00" font-size="14" fill="#203142">3</text>
<path d="M90.00 305.00 L865.00 305.00" fill="none" stroke="#ced6df" stroke-dasharray=""/>
<text x="42.00" y="309.00" font-size="14" fill="#203142">0</text>
<path d="M90.00 265.00 L865.00 265.00" fill="none" stroke="#ced6df" stroke-dasharray=""/>
<text x="42.00" y="269.00" font-size="14" fill="#203142">1.65</text>
<path d="M90.00 225.00 L865.00 225.00" fill="none" stroke="#ced6df" stroke-dasharray=""/>
<text x="42.00" y="229.00" font-size="14" fill="#203142">3.3</text>
<path d="M90.00 185.00 L865.00 185.00" fill="none" stroke="#ced6df" stroke-dasharray=""/>
<text x="42.00" y="189.00" font-size="14" fill="#203142">4.95</text>
<path d="M90.00 145.00 L865.00 145.00" fill="none" stroke="#ced6df" stroke-dasharray=""/>
<text x="42.00" y="149.00" font-size="14" fill="#203142">6.6</text>
<path d="M90.00 145.00 L90.00 305.00" fill="none" stroke="#35485b" stroke-dasharray=""/>
<path d="M90.00 305.00 L865.00 305.00" fill="none" stroke="#35485b" stroke-dasharray=""/>
<text x="870.00" y="327.00" font-size="14" fill="#203142">n</text>
<text x="30.00" y="133.00" font-size="14" fill="#203142">V</text>
<text x="105.00" y="119.00" font-size="14" fill="#3266a5">原输入 / 全系数恢复</text>
<polyline points="115.00,280.76 356.67,232.27 598.33,256.52 840.00,159.55" fill="none" stroke="#3266a5" stroke-width="2" stroke-dasharray=""/>
<circle cx="115.00" cy="280.76" r="4" fill="white" stroke="#3266a5" stroke-width="2"/>
<circle cx="356.67" cy="232.27" r="4" fill="white" stroke="#3266a5" stroke-width="2"/>
<circle cx="598.33" cy="256.52" r="4" fill="white" stroke="#3266a5" stroke-width="2"/>
<circle cx="840.00" cy="159.55" r="4" fill="white" stroke="#3266a5" stroke-width="2"/>
<text x="365.00" y="119.00" font-size="14" fill="#b46314">只留低支</text>
<polyline points="115.00,256.52 356.67,256.52 598.33,208.03 840.00,208.03" fill="none" stroke="#b46314" stroke-width="2" stroke-dasharray="7 4"/>
<circle cx="115.00" cy="256.52" r="4" fill="white" stroke="#b46314" stroke-width="2"/>
<circle cx="356.67" cy="256.52" r="4" fill="white" stroke="#b46314" stroke-width="2"/>
<circle cx="598.33" cy="208.03" r="4" fill="white" stroke="#b46314" stroke-width="2"/>
<circle cx="840.00" cy="208.03" r="4" fill="white" stroke="#b46314" stroke-width="2"/>
<text x="625.00" y="119.00" font-size="14" fill="#923a81">合成细节符号反号</text>
<polyline points="115.00,232.27 356.67,280.76 598.33,159.55 840.00,256.52" fill="none" stroke="#923a81" stroke-width="2" stroke-dasharray="3 4"/>
<rect x="111.00" y="228.27" width="8" height="8" fill="white" stroke="#923a81" stroke-width="2"/>
<rect x="352.67" y="276.76" width="8" height="8" fill="white" stroke="#923a81" stroke-width="2"/>
