<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560"><title>带宽敏感性</title><desc>四个手动带宽下的局部线性跳跃和普通HC1区间。</desc><rect width="900" height="560" fill="#fbfaf7"/><g font-family="Arial Unicode MS, Noto Sans CJK SC, sans-serif" fill="#202124"><text x="450" y="38" font-size="24" font-weight="700" text-anchor="middle">带宽改变了哪些临界选举进入比较</text><text x="450" y="64" font-size="14" text-anchor="middle">点为跳跃，线为普通HC1 95%区间；均不是RBC。</text><line x1="204.2" y1="85" x2="204.2" y2="455" stroke="#777" stroke-dasharray="5 5"/><line x1="416.1" y1="130" x2="730.2" y2="130" stroke="#526d82" stroke-width="6"/><circle cx="573.1" cy="130" r="9" fill="#d55e00"/><text x="128" y="135" text-anchor="end">h=5</text><text x="573.1" y="114" text-anchor="middle" font-size="13">288+322；τ=6.81</text><line x1="388.5" y1="212" x2="663.0" y2="212" stroke="#526d82" stroke-width="6"/><circle cx="525.7" cy="212" r="9" fill="#d55e00"/><text x="128" y="217" text-anchor="end">h=10</text><text x="525.7" y="196" text-anchor="middle" font-size="13">577+632；τ=5.94</text><line x1="445.1" y1="294" x2="682.7" y2="294" stroke="#526d82" stroke-width="6"/><circle cx="563.9" cy="294" r="9" fill="#d55e00"/><text x="128" y="299" text-anchor="end">h=15</text><text x="563.9" y="278" text-anchor="middle" font-size="13">869+896；τ=6.64</text><line x1="499.6" y1="376" x2="710.4" y2="376" stroke="#526d82" stroke-width="6"/><circle cx="605.0" cy="376" r="9" fill="#d55e00"/><text x="128" y="381" text-anchor="end">h=20</text><text x="605.0" y="360" text-anchor="middle" font-size="13">1123+1142；τ=7.40</text><line x1="150" y1="455" x2="800" y2="455" stroke="#555"/><text x="204.2" y="486" text-anchor="middle">0</text><text x="312.5" y="486" text-anchor="middle">2</text><text x="420.8" y="486" text-anchor="middle">4</text><text x="529.2" y="486" text-anchor="middle">6</text><text x="637.5" y="486" text-anchor="middle">8</text><text x="745.8" y="486" text-anchor="middle">10</text><text x="525" y="525" font-size=