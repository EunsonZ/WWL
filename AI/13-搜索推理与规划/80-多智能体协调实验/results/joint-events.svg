<svg xmlns="http://www.w3.org/2000/svg" width="940" height="390" viewBox="0 0 940 390">
<title>Same marginal policies, different joint behavior</title><desc>Fixed LL reward 2 and RR reward 1. Independent p=q=1/3 has four event probabilities; shared public coin has only diagonal events. Height is probability.</desc>
<rect width="100%" height="100%" fill="white"/>
<style>text{font:14px Arial,sans-serif;fill:#17212d}.head{font-weight:bold;font-size:19px}.grid{stroke:#d7dfe7;stroke-width:1}</style>
<text x="30" y="30" class="head">Joint events: independent randomization vs public signal</text>
<text x="70" y="64">Independent p=q=1/3</text>
<rect x="70" y="285.5556" width="42" height="24.4444" fill="#2563a6"/>
<text x="70" y="275.5556">1/9</text><text x="70" y="334">LL</text>
<rect x="140" y="261.1111" width="42" height="48.8889" fill="#b34438"/>
<text x="140" y="251.1111">2/9</text><text x="140" y="334">LR</text>
<rect x="210" y="261.1111" width="42" height="48.8889" fill="#b34438"/>
<text x="210" y="251.1111">2/9</text><text x="210" y="334">RL</text>
<rect x="280" y="212.2222" width="42" height="97.7778" fill="#2563a6"/>
<text x="280" y="202.2222">4/9</text><text x="280" y="334">RR</text>
<text x="70" y="363">Success 5/9; reward each 2/3</text>
<text x="520" y="64">Public coin: P(L signal)=1/3</text>
<rect x="520" y="236.6667" width="42" height="73.3333" fill="#2563a6"/>
<text x="520" y="226.6667">1/3</text><text x="520" y="334">LL</text>
<rect x="590" y="310.0000" width="42" height="0.0000" fill="#b34438"/>
<text x="590" y="300.0000">0</text><text x="590" y="334">LR</text>
<rect x="660" y="310.0000" width="42" height="0.0000" fill="#b34438"/>
<text x="660" y="300.0000">0</text><text x="660" y="334">RL</text>
<rect x="730" y="163.3333" width="42" height="146.6667" fill="#2563a6"/>
<text x="730" y="153.3333">2/3</text><text x="730" y="334">RR</text>
<text x="520" y="363">Success 1; reward each 4/3</text>
</svg>
