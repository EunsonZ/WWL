<svg xmlns="http://www.w3.org/2000/svg" width="425" height="590" viewBox="0 0 425 590"><title>Actual interface decoupling loop</title><desc>C2 bothterminals to VDD/reference, J3source and J2externalADC power/return pins give closed load loop;dashedannotation only. External device and cable geometry not characterized; charge/ESR/L illustrative.</desc><rect width="425" height="590" fill="white"/><g stroke="#111" stroke-width="2" fill="none"><text x="15" y="25" font-size="17">Fast loop closes through external ADC</text><text x="15" y="55" font-size="15">ADC not on-board; its loop remains unknown</text><line x1="40" y1="110" x2="385" y2="110"/><text x="15" y="95" font-size="15">J3.1 sourceVDD</text><line x1="130" y1="110" x2="130" y2="128"/><line x1="118" y1="128" x2="142" y2="128"/><line x1="118" y1="137" x2="142" y2="137"/><line x1="130" y1="137" x2="130" y2="162"/><text x="147" y="138" font-size="13"></text><text x="40" y="190" font-size="13">C2 100n</text><line x1="130" y1="162" x2="130" y2="260"/><circle cx="130" cy="110" r="3" fill="#111"/><circle cx="130" cy="260" r="3" fill="#111"/><line x1="40" y1="260" x2="385" y2="260"/><text x="15" y="290" font-size="15">J3.2 / localGND via / C2 minus</text><line x1="270" y1="110" x2="270" y2="165"/><rect x="240" y="165" width="145" height="55" fill="white"/><text x="245" y="197.5" font-size="15">externalADC</text><line x1="270" y1="220" x2="270" y2="260"/><text x="265" y="150" font-size="12">J2.1</text><text x="290" y="246" font-size="12">J2.3</text><path d="M145 130 L215 130 L215 240 L145 240" stroke-dasharray="5 4"/><text x="155" y="322" font-size="15">fast C -&gt; J2 -&gt;ADC -&gt;GND -&gt;C</text><text x="15" y="378" font-size="15">5mA x5ns /100nF =.25mV charge</text><text x="15" y="411" font-size="15">ESR .05ohm gives.25mV current step</text><text x="15" y="444" font-size="15">Assumed2nH x1mA/ns gives2mV</text><text x="15" y="477" font-size="15">Different times: no automatic RSS or doubleL</text><text x="15" y="535" font-size="15">Later source replenishes charge via J3</text><text x="15" y="566" font-size="15">No real VDD trace / no chosen ADC model</text></g><style>text{fill:#111;stroke:none;font-family:DejaVu Sans,sans-serif}</style></svg>