<svg xmlns="http://www.w3.org/2000/svg" width="425" height="980" viewBox="0 0 425 980" role="img" aria-labelledby="title desc"><title id="title">Integer multiply accumulate rounding and narrowing path</title><desc id="desc">Volts and unitless coefficients separately encoded, exact integer products with2F fraction, declared accumulator guard, one ties-even rounding, explicit storage saturation or wrap, initial code preserved.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#222"/></marker></defs><rect width="425" height="980" style="fill:white;stroke:none"/><style>text{font-family:DejaVu Sans,sans-serif;fill:#151515;stroke:none} path,rect,circle{stroke:#222;stroke-width:1.7;fill:none}</style><text x="18" y="27" font-size="18" text-anchor="start">Integer RC update: one rounding</text><text x="18" y="55" font-size="14" text-anchor="start">W=16, F=14; Delta=1/16384 V</text><rect x="18" y="85" width="389" height="83" rx="7"/><text x="30" y="112" font-size="17" text-anchor="start">Encode values</text><text x="30" y="140" font-size="14" text-anchor="start">u and initial v -&gt; signed q (W bits)</text><path d="M212 172L212 193" marker-end="url(#arrow)"/><rect x="18" y="200" width="389" height="83" rx="7"/><text x="30" y="227" font-size="17" text-anchor="start">Quantize coefficients</text><text x="30" y="255" font-size="14" text-anchor="start">A=12760; B=3624 (unitless scaled)</text><path d="M212 287L212 308" marker-end="url(#arrow)"/><rect x="18" y="315" width="389" height="83" rx="7"/><text x="30" y="342" font-size="17" text-anchor="start">Exact multiply and add</text><text x="30" y="370" font-size="14" text-anchor="start">P=A*q[k]+B*qu[k]; fraction 2F</text><path d="M212 402L212 423" marker-end="url(#arrow)"/><rect x="18" y="430" width="389" height="83" rx="7"/><text x="30" y="457" font-size="17" text-anchor="start">Accumulator guard</text><text x="30" y="485" font-size="14" text-anchor="start">2W+1=33 signed bits, or reject</text><path d="M212 517L212 538" marker-end="url(#arrow)"/><rect x="18" y="545" width="389" height="83" rx="7"/><text x="30" y="572" font-size="17" text-anchor="start">Round once</text><text x="30" y="600" font-size="14" text-anchor="start">roundEven(P/16384), fraction F</text><path d="M212 632L212 653" marker-end="url(#arrow)"/><rect x="18" y="660" width="389" height="83" rx="7"/><text x="30" y="687" font-size="17" text-anchor="start">Narrow and store</text><text x="30" y="715" font-size="14" text-anchor="start">saturate by default; wrap explicit</text><path d="M212 747L212 768" marker-end="url(#arrow)"/><rect x="18" y="775" width="389" height="83" rx="7"/><text x="30" y="802" font-size="17" text-anchor="start">Next boundary</text><text x="30" y="830" font-size="14" text-anchor="start">q[k+1]; q[0] is supplied initial code</text><text x="18" y="920" font-size="14" text-anchor="start">.4 V -&gt; q0=6554 -&gt; .4000244141 V</text><text x="18" y="950" font-size="13" text-anchor="start">CPU exact integers; no actual DSP chip proof</text></svg>