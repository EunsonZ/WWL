<svg xmlns="http://www.w3.org/2000/svg" width="860" height="460" viewBox="0 0 860 460" role="img" aria-labelledby="title desc">
<title id="title">同一合成班级计数的两种权重</title>
<desc id="desc">学生等权和班级等权的成功比例。标签与高度均由输入计数计算；仅教学合成数据，无真实学习效果。</desc>
<rect width="860" height="460" fill="white"/>
<g font-family="Hiragino Sans GB,Microsoft YaHei,Arial Unicode MS,sans-serif" fill="#172635">
<text x="80" y="35" font-size="23">同一计数，先确定平均的是谁</text>
<text x="80" y="64" font-size="15">合成班级数据；成功比例（%），纵轴从0开始</text>
<line x1="80" x2="815" y1="350" y2="350" stroke="#d6dfe6"/>
<text x="65" y="355" font-size="14" text-anchor="end">0</text>
<line x1="80" x2="815" y1="302" y2="302" stroke="#d6dfe6"/>
<text x="65" y="307" font-size="14" text-anchor="end">20</text>
<line x1="80" x2="815" y1="254" y2="254" stroke="#d6dfe6"/>
<text x="65" y="259" font-size="14" text-anchor="end">40</text>
<line x1="80" x2="815" y1="206" y2="206" stroke="#d6dfe6"/>
<text x="65" y="211" font-size="14" text-anchor="end">60</text>
<line x1="80" x2="815" y1="158" y2="158" stroke="#d6dfe6"/>
<text x="65" y="163" font-size="14" text-anchor="end">80</text>
<line x1="80" x2="815" y1="110" y2="110" stroke="#d6dfe6"/>
<text x="65" y="115" font-size="14" text-anchor="end">100</text>
<rect x="133" y="206" width="95" height="144" fill="#245f91"/>
<text x="180.5" y="194" font-size="19" text-anchor="middle">60%</text>
<text x="180.5" y="378" font-size="16" text-anchor="middle">学生等权 A</text>
<text x="180.5" y="404" font-size="14" text-anchor="middle">24/40</text>
<rect x="308" y="182" width="95" height="168" fill="#245f91"/>
<text x="355.5" y="170" font-size="19" text-anchor="middle">70%</text>
<text x="355.5" y="378" font-size="16" text-anchor="middle">学生等权 B</text>
<text x="355.5" y="404" font-size="14" text-anchor="middle">28/40</text>
<rect x="483" y="182" width="95" height="168" fill="#805219"/>
<text x="530.5" y="170" font-size="19" text-anchor="middle">70%</text>
<text x="530.5" y="378" font-size="16" text-anchor="middle">班级等权 A</text>
<text x="530.5" y="404" font-size="14" text-anchor="middle">(90%+50%)/2</text>
<rect x="658" y="206" width="95" height="144" fill="#805219"/>
<text x="705.5" y="194" font-size="19" text-anchor="middle">60%</text>
<text x="705.5" y="378" font-size="16" text-anchor="middle">班级等权 B</text>
<text x="705.5" y="404" font-size="14" text-anchor="middle">(80%+40%)/2</text>
<text x="80" y="442" font-size="14">权重不同产生不同描述；未给分配经过，不解释为教学因果效果。</text></g></svg>
