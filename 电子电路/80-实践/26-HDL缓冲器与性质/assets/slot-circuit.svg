<svg xmlns="http://www.w3.org/2000/svg" width="420" height="500" viewBox="0 0 420 500"><rect width="420" height="500" fill="white"/><g font-family="Arial, sans-serif" fill="#15263a" stroke="none"><text x="18" y="28" font-size="16">01  One slot: data register + occupancy</text><text x="18" y="49" font-size="12">Concept / CPU prediction — not a tool waveform</text><text x="18" y="82" font-size="14">W unsigned bits; local rst_n; rising clk</text><text x="98" y="133" font-size="14">MUX data</text><text x="253" y="123" font-size="14">data_q [W]</text><text x="250" y="146" font-size="14">D</text><text x="330" y="146" font-size="14">Q</text><text x="297" y="170" font-size="12">/RST</text><text x="18" y="119" font-size="14">s_data</text><text x="260" y="231" font-size="14">hold feedback</text><text x="290" y="89" font-size="14">m_data=data_q</text><text x="90" y="252" font-size="14">MUX select = push = sv &amp; ready</text><text x="98" y="298" font-size="14">MUX full</text><text x="253" y="288" font-size="14">full q [1]</text><text x="250" y="311" font-size="14">D</text><text x="330" y="311" font-size="14">Q</text><text x="297" y="335" font-size="12">/RST</text><text x="18" y="284" font-size="14">s_valid</text><text x="90" y="394" font-size="14">MUX select = ready = rst_n &amp; (!q | mr)</text><text x="325" y="381" font-size="12">clk / rst_n</text><text x="18" y="419" font-size="14">m_valid = rst_n &amp; q; reset both registers</text><text x="18" y="443" font-size="14">clk → both triangle pins; /RST → rst_n</text><text x="18" y="470" font-size="14">Empty data is retained but is not a transaction.</text></g><g fill="none" stroke="#15263a" stroke-width="1.8"><rect x="90" y="110" width="110" height="60"/><rect x="245" y="100" width="110" height="76"/><polyline points="273,176 273,166 280,171 273,176"/><polyline points="18,132 90,132"/><polyline points="200,142 245,142"/><polyline points="355,142 394,142 394,210 60,210 60,155 90,155"/><circle cx="375" cy="142" r="3" fill="#15263a"/><polyline points="375,142 400,142"/><rect x="90" y="275" width="110" height="60"/><rect x="245" y="265" width="110" height="76"/><polyline points="273,341 273,331 280,336 273,341"/><polyline points="18,297 90,297"/><polyline points="200,307 245,307"/><polyline points="355,307 394,307 394,363 60,363 60,321 90,321"/><polyline points="273,176 273,181 405,181 405,350 273,350 273,341"/><polyline points="315,176 315,192 414,192 414,360 315,360 315,341"/></g></svg>