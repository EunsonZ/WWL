<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="510" viewBox="0 0 1000 510"><title>Relation messages and multiplicity</title><desc>Two relation labelings have equal untyped adjacency and opposite encoded values; multiplicity changes the normalized mean.</desc><rect width="100%" height="100%" fill="white"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#52677f"/></marker></defs><text x="30" y="32" font-family="Arial,sans-serif" font-size="22" fill="#172b4d" text-anchor="start">Relation identity changes the message; entity order does not</text><path d="M125,110L225,176" stroke="#0072B2" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M365,110L265,176" stroke="#D55E00" stroke-width="3" fill="none" marker-end="url(#arrow)"/><circle cx="115" cy="90" r="24" fill="#dfe8f2"/><text x="115" y="95" font-family="Arial,sans-serif" font-size="16" fill="#172b4d" text-anchor="middle">u</text><text x="115" y="137" font-family="Arial,sans-serif" font-size="14" fill="#172b4d" text-anchor="middle">x = 1</text><circle cx="375" cy="90" r="24" fill="#dfe8f2"/><text x="375" y="95" font-family="Arial,sans-serif" font-size="16" fill="#172b4d" text-anchor="middle">v</text><text x="375" y="137" font-family="Arial,sans-serif" font-size="14" fill="#172b4d" text-anchor="middle">x = 3</text><circle cx="245" cy="200" r="24" fill="#dfe8f2"/><text x="245" y="205" font-family="Arial,sans-serif" font-size="16" fill="#172b4d" text-anchor="middle">i</text><text x="245" y="247" font-family="Arial,sans-serif" font-size="14" fill="#172b4d" text-anchor="middle">x = 0</text><text x="45" y="166" font-family="Arial,sans-serif" font-size="14" fill="#172b4d" text-anchor="start">friend (+1)</text><text x="310" y="166" font-family="Arial,sans-serif" font-size="14" fill="#172b4d" text-anchor="start">blocks (-1)</text><text x="245" y="294" font-family="Arial,sans-serif" font-size="19" fill="#172b4d" text-anchor="middle">encoded i = -2</text><path d="M615,110L715,176" stroke="#D55E00" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M855,110L755,176" stroke="#0072B2" stroke-width="3" fill="none" marker-end="url(#arrow)"/><circle cx="605" cy="90" r="24" fill="#dfe8f2"/><text x="605" y="95" font-family="Arial,sans-serif" font-size="16" fill="#172b4d" text-anchor="middle">u</text><text x="605" y="137" font-family="Arial,sans-serif" font-size="14" fill="#172b4d" text-anchor="middle">x = 1</text><circle cx="865" cy="90" r="24" fill="#dfe8f2"/><text x="865" y="95" font-family="Arial,sans-serif" font-size="16" fill="#172b4d" text-anchor="middle">v</text><text x="865" y="137" font-family="Arial,sans-serif" font-size="14" fill="#172b4d" text-anchor="middle">x = 3</text><circle cx="735" cy="200" r="24" fill="#dfe8f2"/><text x="735" y="205" font-family="Arial,sans-serif" font-size="16" fill="#172b4d" text-anchor="middle">i</text><text x="735" y="247" font-family="Arial,sans-serif" font-size="14" fill="#172b4d" text-anchor="middle">x = 0</text><text x="535" y="166" font-family="Arial,sans-serif" font-size="14" fill="#172b4d" text-anchor="start">blocks (-1)</text><text x="800" y="166" font-family="Arial,sans-serif" font-size="14" fill="#172b4d" text-anchor="start">friend (+1)</text><text x="735" y="294" font-family="Arial,sans-serif" font-size="19" fill="#172b4d" text-anchor="middle">encoded i = 2</text><text x="30" y="354" font-family="Arial,sans-serif" font-size="16" fill="#172b4d" text-anchor="start">Both directed untyped adjacency matrices are identical; only relation labels are swapped.</text><text x="30" y="400" font-family="Arial,sans-serif" font-size="16" fill="#172b4d" text-anchor="start">Multiplicity fixture: i receives x=1 twice and x=3 once within one relation.</text><text x="30" y="438" font-family="Arial,sans-serif" font-size="16" fill="#172b4d" text-anchor="start">Relation mean = (2*1+3)/3 = 1.666667; deduplicating gives 2.</text><text x="30" y="478" font-family="Arial,sans-serif" font-size="14" fill="#172b4d" text-anchor="start">Root weight is zero here; all values are computed by the same encode() used in the practice.</text></svg>
