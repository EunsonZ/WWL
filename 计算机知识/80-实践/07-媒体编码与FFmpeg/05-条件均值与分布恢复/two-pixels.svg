<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="800" viewBox="0 0 1160 800">
<title>Two pixels: lost order, posterior mean and independent posterior pairs</title>
<desc>Black=0, white=1, grey=one half, values in [0,1]. Each image has two pixels. The mean sensor reading is scalar, not a reference image. Four independent pairs are enumerated from the same input table. This is a mathematical diagram, no preference test.</desc>
<rect width="1160" height="800" fill="#f4f6f8"/>
<g font-family="sans-serif" fill="#182738">
<text x="30" y="38" font-size="25">One table, two objectives: squared reference error and output distribution</text>
<text x="30" y="72" font-size="18">Pixel order: LEFT then RIGHT. Values in [0,1]. Black=0, white=1, grey=1/2.</text>
<text x="45" y="126" font-size="20">True Y: p=1/2</text>
