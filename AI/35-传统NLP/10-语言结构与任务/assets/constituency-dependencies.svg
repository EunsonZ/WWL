<title id="title">Two constituent trees and their declared dependency conversions</title><desc id="desc">The same five words keep IDs1..5. On the left are the two published CKY trees. On the right arrows point from head to dependent, with artificial ROOT0. Only the incoming head and relation of scopes differ: birds to scopes nmod versus saw to scopes obl. with is case dependent of scopes in both. Grammar and head rules allow analyses; neither diagram proves which situation occurred.</desc>
