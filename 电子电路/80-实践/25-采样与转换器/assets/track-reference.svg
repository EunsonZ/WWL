<svg xmlns="http://www.w3.org/2000/svg" width="425" height="565" viewBox="0 0 425 565"><title>Track and reference networks</title><desc>Actual source-series resistance, switched reservoir/hold capacitor and reference recharge RC. Switches ideal; ADC/comparator downstream separate.</desc><rect width="425" height="565" fill="white"/><g stroke="#111" stroke-width="2" fill="none"><text x="15" y="25" font-size="17">Track: source R, reservoir and CH</text><text x="15" y="51" font-size="14">u, a, h are volts relative to ground</text><text x="15" y="108" font-size="14">u</text><line x1="35" y1="120" x2="70.0" y2="120"/><rect x="70.0" y="112" width="40" height="16" fill="white"/><line x1="110.0" y1="120" x2="145" y2="120"/><text x="68.0" y="105" font-size="13">Rsource</text><circle cx="145" cy="120" r="3" fill="#111"/><text x="147" y="108" font-size="14">a</text><line x1="145" y1="120" x2="157" y2="120"/><line x1="157" y1="120" x2="242" y2="108"/><line x1="242" y1="120" x2="250" y2="120"/><text x="145" y="85" font-size="13">track clock</text><circle cx="250" cy="120" r="3" fill="#111"/><text x="255" y="108" font-size="14">h</text><line x1="250" y1="120" x2="340" y2="120"/><line x1="145" y1="120" x2="145" y2="135"/><line x1="133" y1="135" x2="157" y2="135"/><line x1="133" y1="143" x2="157" y2="143"/><line x1="145" y1="143" x2="145" y2="160"/><text x="161" y="145" font-size="13">CR 1nF</text><line x1="145" y1="160" x2="145" y2="172"/><line x1="135" y1="172" x2="155" y2="172"/><line x1="138" y1="176" x2="152" y2="176"/><line x1="250" y1="120" x2="250" y2="135"/><line x1="238" y1="135" x2="262" y2="135"/><line x1="238" y1="143" x2="262" y2="143"/><line x1="250" y1="143" x2="250" y2="160"/><text x="266" y="145" font-size="13">CH 20pF</text><line x1="250" y1="160" x2="250" y2="172"/><line x1="240" y1="172" x2="260" y2="172"/><line x1="243" y1="176" x2="257" y2="176"/><text x="305" y="180" font-size="12">to ADC</text><text x="15" y="211" font-size="14">Closure shares old charge; then R restores</text><text x="15" y="239" font-size="14">CR:2V, CH:0V -&gt; 1.960784V</text><text x="15" y="290" font-size="17">Reference: periodic charge withdrawal</text><text x="15" y="331" font-size="14">VRef=3V</text><line x1="85" y1="345" x2="135.0" y2="345"/><rect x="135.0" y="337" width="40" height="16" fill="white"/><line x1="175.0" y1="345" x2="225" y2="345"/><text x="133.0" y="330" font-size="13">Rref 10ohm</text><circle cx="225" cy="345" r="3" fill="#111"/><line x1="225" y1="345" x2="345" y2="345"/><text x="310" y="332" font-size="14">to CDAC</text><line x1="225" y1="345" x2="225" y2="360"/><line x1="213" y1="360" x2="237" y2="360"/><line x1="213" y1="368" x2="237" y2="368"/><line x1="225" y1="368" x2="225" y2="385"/><text x="241" y="370" font-size="13">Cref 1uF</text><line x1="225" y1="385" x2="225" y2="397"/><line x1="215" y1="397" x2="235" y2="397"/><line x1="218" y1="401" x2="232" y2="401"/><line x1="335" y1="345" x2="335" y2="402"/><circle cx="335" cy="417" r="15"/><line x1="335" y1="410" x2="335" y2="424"/><path d="M331 420 L335 425 L339 420"/><line x1="335" y1="432" x2="335" y2="457"/><line x1="335" y1="457" x2="335" y2="469"/><line x1="325" y1="469" x2="345" y2="469"/><line x1="328" y1="473" x2="342" y2="473"/><text x="15" y="494" font-size="14">Q=20pC/event, period10us; pulse current</text><text x="15" y="519" font-size="14">External VDD powers switches/comparator</text><text x="15" y="544" font-size="14">Reference scale is separate from VDD</text></g><style>text{fill:#111;stroke:none;font-family:DejaVu Sans,sans-serif}</style></svg>