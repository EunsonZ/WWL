<svg xmlns="http://www.w3.org/2000/svg" width="425" height="685" viewBox="0 0 425 685"><title>Bounded bringup fault tree</title><desc>Safe lowenergy passiveboard plan with TP localreference and explicitbranches/failurestop. No measuredreadings;realinstrumentground/ratings/manual stillneeded. Scopeearthnotremoved.</desc><rect width="425" height="685" fill="white"/><g stroke="#111" stroke-width="2" fill="none"><text x="15" y="25" font-size="17">Before power: inspect, verify pins and reference</text><text x="15" y="55" font-size="15">0..3.3V isolated source;5mA initial limit plan</text><rect x="30" y="90" width="365" height="40" fill="white"/><text x="35" y="115.0" font-size="15">VDD wrong?</text><text x="35" y="155" font-size="13">source/limit -&gt;disconnectADC -&gt;J3/C2C3</text><rect x="30" y="185" width="365" height="40" fill="white"/><text x="35" y="210.0" font-size="15">IN wrong?</text><text x="35" y="250" font-size="13">source/cable/J1 pin / TP4 reference</text><rect x="30" y="280" width="365" height="40" fill="white"/><text x="35" y="305.0" font-size="15">OUT DC wrong?</text><text x="35" y="345" font-size="13">R1/R2 /loading /solder /instrument</text><rect x="30" y="375" width="365" height="40" fill="white"/><text x="35" y="400.0" font-size="15">OUT transient wrong?</text><text x="35" y="440" font-size="13">C1effective /sourceR /initial /probe</text><rect x="30" y="470" width="365" height="40" fill="white"/><text x="35" y="495.0" font-size="15">volts okay, code wrong?</text><text x="35" y="535" font-size="13">externalADCref /timing /format /valid</text><text x="15" y="598" font-size="15">Sustainedunexpectedcurrent -&gt;stop/poweroff</text><text x="15" y="629" font-size="15">TP4 local reference; scopeground may be PE</text><text x="15" y="660" font-size="15">Never remove protectiveearth to float a scope</text></g><style>text{fill:#111;stroke:none;font-family:DejaVu Sans,sans-serif}</style></svg>