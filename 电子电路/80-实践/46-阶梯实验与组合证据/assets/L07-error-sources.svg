<svg xmlns="http://www.w3.org/2000/svg" width="360" height="880" viewBox="0 0 360 880"><title>L07 five distinct error accounts at defined ports</title><rect width="360" height="880" fill="white"/><g font-family="DejaVu Sans" fill="#182d45"><text x="14" y="26" font-size="15">L07: one synthetic chain, five accounts</text><text x="14" y="49" font-size="13">1mVpk -&gt; G20 -&gt; G10 -&gt; LP4 -&gt; ADC16</text><text x="14" y="70" font-size="13">bias1.65V; 1kHz; fs100kHz; VFS3.3V</text><rect x="12" y="92" width="336" height="134" rx="4" fill="#f0f4f7" stroke="#263e55"/><text x="24" y="116" font-size="16">DC bound</text><text x="24" y="139" font-size="14">18.406964 uV input</text><text x="24" y="164" font-size="12">Vos, reference mismatch, Ib+ / Ib-</text><text x="24" y="184" font-size="12">signed KCL first; absolute bounds after</text><text x="24" y="204" font-size="12">NOT a random RSS guarantee</text><rect x="12" y="240" width="336" height="134" rx="4" fill="#f0f4f7" stroke="#263e55"/><text x="24" y="264" font-size="16">Random before quantization</text><text x="24" y="287" font-size="14">0.796457 uVrms input</text><text x="24" y="312" font-size="12">ports -&gt; |H(f)|^2 -&gt; integral df [Hz]</text><text x="24" y="332" font-size="12">single-sided PSD [V^2/Hz]</text><text x="24" y="352" font-size="12">independence assumed; correlation adds terms</text><rect x="12" y="388" width="336" height="134" rx="4" fill="#f0f4f7" stroke="#263e55"/><text x="24" y="412" font-size="16">Quantization</text><text x="24" y="435" font-size="14">14.535949 uVrms ADC</text><text x="24" y="460" font-size="12">Delta / sqrt(12) conditional model</text><text x="24" y="480" font-size="12">fixed DC may lock one code</text><text x="24" y="500" font-size="12">NOT universal white noise</text><rect x="12" y="536" width="336" height="134" rx="4" fill="#f0f4f7" stroke="#263e55"/><text x="24" y="560" font-size="16">Aliased tone</text><text x="24" y="583" font-size="14">0.650638 uVpk ADC</text><text x="24" y="608" font-size="12">99kHz -&gt; analog LP -&gt; fold to 1kHz</text><text x="24" y="628" font-size="12">peak and RMS have different contracts</text><text x="24" y="648" font-size="12">digital filtering cannot unmix same samples</text><rect x="12" y="684" width="336" height="134" rx="4" fill="#f0f4f7" stroke="#263e55"/><text x="24" y="708" font-size="16">Acquisition</text><text x="24" y="731" font-size="14">halfLSB 25.177002 uV</text><text x="24" y="756" font-size="12">3.3V step; R200ohm, C20pF; 5us</text><text x="24" y="776" font-size="12">RC and driver transient separately</text><text x="24" y="796" font-size="12">NOT a real ADC BUSY/valid measurement</text><text x="14" y="854" font-size="12">allocated ADC20uVrms already includes kT/C</text><text x="14" y="873" font-size="12">CPU content != measured hardware budget</text></g></svg>